const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const SKY_FS = () => `#version 300 es
precision highp float;
precision highp int;
${SCENE_UNIFORMS.map(([n, t, , len]) => `uniform ${t} ${n}${len ? `[${len}]` : ''};`).join('\n')}
uniform sampler2D uTrans, uSkySun, uSkyMoon;
uniform highp sampler3D uNoise3;
uniform vec2 uPix0;
uniform float uPixStep, uTargetH, uSnap, uQuality;
uniform int uSamples;
out vec4 outColor;
${GLSL_COMMON}
${GLSL_ATMO}
${GLSL_NOISE}
${GLSL_NIGHT}

vec3 viewDir(vec2 img, out float valid) {
  valid = 1.0;
  if (uProj == 3) {
    float lon = uHeading + (img.x / uImg.x - 0.5) * TAU;
    float lat = (0.5 - img.y / uImg.y) * PI;
    valid = step(abs(lat), 0.5 * PI);
    lat = clamp(lat, -0.5 * PI, 0.5 * PI);
    return vec3(sin(lon) * cos(lat), sin(lat), cos(lon) * cos(lat));
  }
  vec2 n = (img - 0.5 * uImg) / (0.5 * length(uImg));
  n.y = -n.y;
  if (uProj == 0) {
    vec2 s = n * tan(uHalfDiag);
    return normalize(uFwd + uRight * s.x + uUp * s.y);
  }
  float r = length(n);
  float th = uProj == 1 ? r * uHalfDiag : 2.0 * atan(r * tan(0.5 * uHalfDiag));
  valid = step(th, PI);
  vec2 u = r > 1e-6 ? n / r : vec2(0.0);
  return uFwd * cos(th) + (uRight * u.x + uUp * u.y) * sin(th);
}

// ── Sky ──

vec3 skyLUT(sampler2D t, vec3 d, vec2 lightAz) {
  float lh = length(d.xz);
  float ca = lh > 1e-6 ? dot(d.xz / lh, lightAz) : 1.0;
  float az = acos(clamp(ca, -1.0, 1.0));
  float el = asin(clamp(d.y, -1.0, 1.0));
  vec2 x = vec2(sqrt(az / PI), 0.5 + 0.5 * sign(el) * sqrt(abs(el) / (0.5 * PI)));
  return fetchBilinear(t, x, SKY_SIZE).rgb;
}

vec3 physicalSky(vec3 d) {
  vec3 c = skyLUT(uSkySun, d, uSunAz) * uSunScale;
  if (uMoonScale > 0.0) c += skyLUT(uSkyMoon, d, uMoonAz) * uMoonScale;
  return c;
}

vec3 nightSky(vec3 d) {
  float e = max(d.y, 0.0);
  vec3 c = mix(uNightZenith, uNightHorizon, pow(1.0 - e, 1.0 + uNightCurve * 10.0));
  vec2 hd = d.xz / max(length(d.xz), 1e-6);
  float facing = 0.5 + 0.5 * dot(hd, uLPDir);
  c += uLPColor * uLP.x * exp(-e / max(uLP.y, 0.005)) * mix(1.0, 2.0 * facing * facing, uLP.z);
  float el = asin(e);
  c += uAirglow.rgb * uAirglow.a * exp(-pow((el - 0.16) / 0.12, 2.0));
  return c;
}

vec3 sunLight(vec3 d, float fp) {
  float ang = 2.0 * asin(clamp(length(d - uSunDir) * 0.5, 0.0, 1.0));
  float r = uSunDisk.y;
  vec3 T = transmittance(OBS, d.y);
  float q = ang / r;
  float limb = 1.0 - 0.6 * (1.0 - sqrt(max(0.0, 1.0 - q * q)));
  float cover = clamp((r - ang) / max(fp, 1e-7) + 0.5, 0.0, 1.0) * uSunDisk.x;
  vec3 c = T * cover * limb / (PI * SUN_R * SUN_R);
  c += transmittance(OBS, uSunDir.y) * uSunDisk.z * (6.0 * exp(-ang / 0.01) + 0.5 * exp(-ang / 0.06) + 0.05 * exp(-ang / 0.3));
  return c * uSunScale;
}

${GLSL_CLOUDS}
${GLSL_LAND}

vec3 skyAbove(vec3 d, float fp, float fpOut, float jitter, vec3 amb) {
  vec3 col = physicalSky(d);
  if (d.y > -fp) {
    float above = smoothstep(-fp, fp, d.y);
    vec3 Tv = mix(vec3(1.0), transmittance(OBS, max(d.y, 0.0)) / transmittance(OBS, 1.0), uStarLook.w);
    vec4 moon = uMoon.x > 0.0 ? moonDisk(d, fp) : vec4(0.0);
    vec3 night = nightSky(d) + aurora(d, fp, jitter);
    // Stars and deep-sky layers are invisible against daylight; skip their cost.
    if (uNightScale > 2e-3) night += (nightLayers(d, fp, fpOut) * (1.0 - moon.a) + meteors(d, fp, fpOut)) * Tv;
    col += (night * uNightScale + moon.rgb * Tv) * above;
    if (!gMirror) col += sunLight(d, fp) * above;
  }
  if (uCloudN > 0) {
    vec4 c = clouds(d, fp, jitter, amb);
    col = c.rgb + c.a * col;
  }
  return applyFog(col, d, 60000.0, amb);
}

vec3 viewRadiance(vec3 d, float fp, float fpOut, float jitter, vec3 amb) {
  vec3 landCol = vec3(0.0);
  float landT = 1.0;
  if (uLand.x > 0.5 && d.y < 0.4) {
    float az = atan(d.x, d.z), el = asin(clamp(d.y, -1.0, 1.0));
    for (int L = 0; L < 4; L++) {
      if (L >= int(uLand.w) || el < -uSurf.y / (LAND_DIST[L] * uLandB.x * 1000.0)) break;
      Ridge rg = ridgeAt(L, az, fp);
      float cov = smoothstep(-fp, fp, rg.h - el);
      if (cov > 0.0) {
        landCol += landT * cov * shadeLand(L, d, az, el, rg, amb, fp);
        landT *= 1.0 - cov;
        if (landT < 0.004) break;
      }
    }
  }
  if (landT < 0.004) return landCol;
  return landCol + landT * skyAbove(d, fp, fpOut, jitter, amb);
}

vec3 sceneColor(vec3 d, float fp, float fpOut, float jitter) {
  vec3 amb = skyAmbient();
  float Dm = d.y < 0.0 ? uSurf.y / -d.y : 1e9;
  bool ground = d.y < 0.0 && (uLand.x < 0.5 || Dm < LAND_DIST[0] * uLandB.x * 1000.0);
  if (!ground) return viewRadiance(d, fp, fpOut, jitter, amb);
  float rate = fp * Dm * inversesqrt(max(-d.y, 0.02));
  int type = int(uSurf.x);
  vec3 col;
  if (type == 1 || type == 2) col = shadeWater(d, Dm, rate, fp, fpOut, jitter, amb);
  else {
    vec3 n;
    vec4 s = surfaceAt(d.xz * Dm, rate, d, Dm, n);
    col = s.rgb * (directLight(n) + amb);
  }
  col = mix(horizonSky(d), col, hazeT(Dm * 0.001));
  return applyFog(col, d, Dm, amb);
}

// ── Tone & Grade ──

vec3 agxCurve(vec3 x) {
  vec3 x2 = x * x, x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}

vec3 agx(vec3 c, bool punchy) {
  const mat3 inMat = mat3(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                          0.0784335999999992, 0.878468636469772, 0.0784336,
                          0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  const mat3 outMat = mat3(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                           -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                           -0.0990297440797205, -0.0989611768448433, 1.15107367264116);
  const float lo = -12.47393, hi = 4.026069;
  c = clamp(log2(max(inMat * c, 1e-10)), lo, hi);
  c = agxCurve((c - lo) / (hi - lo));
  if (punchy) {
    float l = luma(c);
    c = pow(max(c, 0.0), vec3(1.35));
    c = l + 1.4 * (c - l);
  }
  return pow(max(outMat * c, 0.0), vec3(2.2));
}

vec3 aces(vec3 c) {
  const mat3 inMat = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
  const mat3 outMat = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
  c = inMat * c;
  c = (c * (c + 0.0245786) - 0.000090537) / (c * (0.983729 * c + 0.4329510) + 0.238081);
  return outMat * c;
}

vec3 softTone(vec3 c) {
  float l = luma(c);
  vec3 o = c * ((1.0 + l / 16.0) / (1.0 + l));
  float m = max(o.r, max(o.g, o.b));
  return m > 1.0 ? mix(o / m, vec3(1.0), clamp(1.0 - 1.0 / m, 0.0, 1.0) * 0.5) : o;
}

vec3 tonemap(vec3 c) {
  if (uTone == 1) return agx(c, false);
  if (uTone == 2) return agx(c, true);
  if (uTone == 3) return aces(c);
  return softTone(c);
}

vec3 toSRGB(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

vec3 softLight(vec3 a, vec3 b) { return (1.0 - 2.0 * b) * a * a + 2.0 * b * a; }

vec3 hueRotate(vec3 c, float a) {
  const vec3 k = vec3(0.57735027);
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}

vec3 grade(vec3 lin, vec2 img) {
  vec3 c = toSRGB(tonemap(max(lin * uWB, 0.0)));
  vec3 k = vec3(uGrade.x);
  c = mix(pow(c * 2.0, k) * 0.5, 1.0 - pow((1.0 - c) * 2.0, k) * 0.5, step(0.5, c));
  if (uGrade.w != 0.0) c = hueRotate(c, uGrade.w);
  float l = luma(c);
  c = mix(vec3(l), c, uGrade.y);
  float sat = max(c.r, max(c.g, c.b)) - min(c.r, min(c.g, c.b));
  c = clamp(mix(vec3(l), c, 1.0 + uGrade.z * (1.0 - sat)), 0.0, 1.0);
  l = luma(c);
  c = mix(c, softLight(c, uShadowTint.rgb), uShadowTint.a * (1.0 - l) * (1.0 - l));
  c = mix(c, softLight(c, uHighTint.rgb), uHighTint.a * l * l);
  c = mix(c, c * uFilter.rgb / max(luma(uFilter.rgb), 0.05), uFilter.a);
  c = c + uLift * (1.0 - c);
  vec2 n = (img - 0.5 * uImg) / (0.5 * length(uImg));
  c *= 1.0 - uLens.x * smoothstep(0.3, 1.15, length(n));
  return clamp(c, 0.0, 1.0);
}

float valueNoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y);
}

vec3 addGrain(vec3 c, vec2 img) {
  if (uLens.y <= 0.0) return c;
  float cell = uLens.z * length(uImg) / 1000.0;
  vec2 g = img / cell;
  float n = valueNoise(g) + 0.5 * valueNoise(g * 2.1 + 17.0) - 0.75;
  float l = luma(c);
  float amp = uLens.y * 0.16 * min(1.0, cell / max(uPixStep, 1.0)) * (0.35 + 2.6 * l * (1.0 - l));
  return c + n * amp;
}

vec3 shadePixel(vec2 img, float jitter) {
  float valid, v1, v2;
  vec3 d = viewDir(img, valid);
  vec3 dx = viewDir(img + vec2(1.0, 0.0), v1) - d;
  vec3 dy = viewDir(img + vec2(0.0, 1.0), v2) - d;
  float fpOut = sqrt(length(dx) * length(dy));
  vec3 c = sceneColor(d, fpOut * max(uPixStep, 1.0), fpOut, jitter);
  return grade(c, img) * valid;
}

void main() {
  vec2 fc = vec2(gl_FragCoord.x, uTargetH - gl_FragCoord.y);
  vec2 img = uPix0 + fc * uPixStep;
  if (uSnap > 0.5) img = floor(img) + 0.5;
  float px = max(uPixStep, 1.0);
  vec3 c = vec3(0.0);
  for (int i = 0; i < 16; i++) {
    if (i >= uSamples) break;
    vec2 j = uSamples > 1 ? fract(vec2(0.7548777, 0.5698403) * float(i) + 0.5) - 0.5 : vec2(0.0);
    vec2 q = floor(img / px);
    c += shadePixel(img + j * px, fract(52.9829189 * fract(dot(q, vec2(0.06711056, 0.00583715))) + float(i) * 0.618034));
  }
  c = addGrain(c / float(uSamples), img);
  vec2 dp = floor(uPix0 / max(uPixStep, 1e-6)) + floor(fc);
  c += (hash12(dp) + hash12(dp + 71.3) - 1.0) / 255.0;
  outColor = vec4(c, 1.0);
}`;

// ─── WebGL ──────────────────────────────────────────────────────────────────

const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) fail('WebGL2 is unavailable in this browser.');
if (!gl.getExtension('EXT_color_buffer_float')) fail('This browser lacks float render targets (EXT_color_buffer_float).');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const lines = src.split('\n').map((l, i) => `${String(i + 1).padStart(4)}  ${l}`).join('\n');
    fail('Shader compile error:\n' + gl.getShaderInfoLog(s) + '\n\n' + lines);
  }
  return s;
}

function program(vs, fs, samplers = {}) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Program link error:\n' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  gl.useProgram(p);
  for (const [name, unit] of Object.entries(samplers)) if (u[name]) gl.uniform1i(u[name], unit);
  return { p, u };
}

function target(w, h, format = gl.RGBA8) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, format, w, h);
  const filter = format === gl.RGBA32F ? gl.NEAREST : gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h, free() { gl.deleteFramebuffer(fbo); gl.deleteTexture(tex); } };
}

gl.bindVertexArray(gl.createVertexArray());

const SETTERS = {
  float: (l, v) => Array.isArray(v) ? gl.uniform1fv(l, v) : gl.uniform1f(l, v),
  int: (l, v) => gl.uniform1i(l, v),
  uint: (l, v) => gl.uniform1ui(l, v),
  vec2: (l, v) => gl.uniform2fv(l, v),
  vec3: (l, v) => gl.uniform3fv(l, v),
  vec4: (l, v) => gl.uniform4fv(l, v),
  mat3: (l, v) => gl.uniformMatrix3fv(l, false, v),
};

const sky = program(VS, SKY_FS(), { uTrans: 0, uSkySun: 1, uSkyMoon: 2, uNoise3: 3 });

const noise3 = (() => {
  const prog = program(VS, NOISE3_FS);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_3D, tex);
  gl.texStorage3D(gl.TEXTURE_3D, Math.log2(NOISE_N) + 1, gl.RGBA8, NOISE_N, NOISE_N, NOISE_N);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, NOISE_N, NOISE_N);
  gl.useProgram(prog.p);
  for (let z = 0; z < NOISE_N; z++) {
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex, 0, z);
    gl.uniform1f(prog.u.uSlice, (z + 0.5) / NOISE_N);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fbo);
  gl.deleteProgram(prog.p);
  gl.generateMipmap(gl.TEXTURE_3D);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  for (const w of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, w, gl.REPEAT);
  return tex;
})();

// ─── Atmosphere ─────────────────────────────────────────────────────────────

const KEY = 0.25;
const NIGHT_FLOOR = 2.5e-6;
const transProg = program(VS, TRANS_FS);
const lutProg = program(VS, SKYLUT_FS, { uTrans: 0 });
const atmo = {
  trans: target(TR_W, TR_H, gl.RGBA32F),
  sun: target(SKY_W, SKY_H, gl.RGBA32F),
  moon: target(SKY_W, SKY_H, gl.RGBA32F),
  transSig: '', sunSig: '', moonSig: '', Ysun: 0, Ymoon: 0,
};
const lutBuf = new Float32Array(SKY_W * SKY_H * 4);

function skyMeter(b) {
  let sum = 0, wsum = 0;
  for (let j = 0; j < SKY_H; j++) {
    const s = j / (SKY_H - 1) * 2 - 1;
    if (s <= 0) continue;
    const wj = Math.cos(s * s * Math.PI / 2) * s;
    for (let i = 1; i < SKY_W; i++) {
      const w = wj * i, o = (j * SKY_W + i) * 4;
      sum += w * (0.2126 * b[o] + 0.7152 * b[o + 1] + 0.0722 * b[o + 2]);
      wsum += w;
    }
  }
  return sum / wsum;
}

function renderSkyLUT(t, elev) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.viewport(0, 0, SKY_W, SKY_H);
  gl.useProgram(lutProg.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, atmo.trans.tex);
  gl.uniform4f(lutProg.u.uAtmo, P.rayleigh, P.mie, P.ozone, P.mieG);
  gl.uniform3f(lutProg.u.uLight, 0, Math.sin(elev * DEG), Math.cos(elev * DEG));
  gl.uniform1f(lutProg.u.uFill, P.skyFill);
  gl.uniform1f(lutProg.u.uAlbedo, P.albedo);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, SKY_W, SKY_H, gl.RGBA, gl.FLOAT, lutBuf);
  return skyMeter(lutBuf);
}

function updateAtmosphere() {
  const transSig = [P.rayleigh, P.mie, P.ozone].join();
  if (transSig !== atmo.transSig) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, atmo.trans.fbo);
    gl.viewport(0, 0, TR_W, TR_H);
    gl.useProgram(transProg.p);
    gl.uniform4f(transProg.u.uAtmo, P.rayleigh, P.mie, P.ozone, P.mieG);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    atmo.transSig = transSig;
  }
  const lutSig = [transSig, P.mieG, P.skyFill, P.albedo].join();
  const sunSig = lutSig + ',' + P.sunElev;
  if (sunSig !== atmo.sunSig) {
    atmo.Ysun = renderSkyLUT(atmo.sun, P.sunElev);
    atmo.sunSig = sunSig;
  }
  const moonSig = lutSig + ',' + P.moonElev;
  if (P.moon && moonSig !== atmo.moonSig) {
    atmo.Ymoon = renderSkyLUT(atmo.moon, P.moonElev);
    atmo.moonSig = moonSig;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ─── Scene State ────────────────────────────────────────────────────────────

const D = {};
const ANIM = { time: 0, micro: 0, cloud: [[0, 0, 0], [0, 0, 0], [0, 0, 0]] };

const MOON_I = 2e-5;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), a | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function celestialFrame() {
  const phi = P.latitude * DEG, th = P.skyRotation * DEG;
  const ez = [0, Math.sin(phi), Math.cos(phi)], ex0 = [0, Math.cos(phi), -Math.sin(phi)], ey0 = [-1, 0, 0];
  const ex = v3.add(v3.scale(ex0, Math.cos(th)), v3.scale(ey0, Math.sin(th)));
  const ey = v3.add(v3.scale(ex0, -Math.sin(th)), v3.scale(ey0, Math.cos(th)));
  return [...ex, ...ey, ...ez];
}

function meteorField() {
  const radiant = skyVector(55, P.meteorHeading);
  const A = [], B = [], prog = [];
  for (let i = 0; i < 12; i++) {
    const period = 3 + 7 * rng(i * 131 + 7)(), phase = ANIM.micro / period + rng(i * 71 + 3)();
    const cycle = ANIM.playing || ANIM.micro > 0 ? Math.floor(phase) : 0;
    prog.push(ANIM.playing || ANIM.micro > 0 ? (phase - cycle) / 0.18 : -1);
    const R = rng(P.meteorSeed * 9973 + 17 + i * 7919 + cycle * 104729);
    let dir = radiant;
    for (let k = 0; k < 24; k++) {
      dir = skyVector(10 + R() * 72, R() * 360);
      const c = v3.dot(dir, radiant);
      if (c < Math.cos(14 * DEG) && c > Math.cos(80 * DEG)) break;
    }
    const tangent = v3.norm(v3.add(v3.scale(dir, v3.dot(dir, radiant)), v3.scale(radiant, -1)));
    A.push(...dir, P.meteorLength * DEG * (0.5 + R()));
    B.push(...tangent, (0.35 + 0.65 * R()) * P.meteorBright);
  }
  return { A, B, prog };
}

// Directional wave components (kx, kz, phase, amplitude) for the water shader. "Waves & Wind"
// sets a wind speed, which fixes the total slope variance (Cox–Munk) and the longest swell.
function waveField() {
  const R = rng(7331), U = P.surfWaves * 4, wind = P.surfWind * DEG;
  const lmax = P.surfScale * (1.5 + 0.85 * U * U), lmin = 0.02 * Math.sqrt(P.surfScale);
  const mss = 0.0006 + 0.0048 * U;
  const out = [], weights = [];
  for (let i = 0; i < 32; i++) {
    const f = (i + R()) / 32;
    const k = TAU / (lmax * Math.pow(lmin / lmax, f));
    const th = wind + (R() + R() + R() - 1.5) * (0.5 + 1.4 * f);
    const s = 0.5 + R();
    weights.push(s * s);
    out.push(Math.sin(th) * k, Math.cos(th) * k, R() * TAU, k);
  }
  const total = weights.reduce((a, b) => a + b);
  for (let i = 0; i < 32; i++) out[i * 4 + 3] = Math.sqrt(2 * 0.7 * mss * weights[i] / total) / out[i * 4 + 3];
  return { waves: out, fx: [clamp(P.surfWaves / 2.5, 0, 0.8), P.surface === 1 ? P.surfFoam * clamp((P.surfWaves - 0.8) / 1.4, 0, 1) : 0, 0.15 * mss] };
}

function derive(img) {
  D.img = img || captureDims();
  ({ waves: D.waves, fx: D.waveFx } = waveField());
  D.basis = cameraBasis();
  D.sunDir = skyVector(P.sunElev, P.sunHeading);
  D.sunAz = [Math.sin(P.sunHeading * DEG), Math.cos(P.sunHeading * DEG)];
  D.moonDir = skyVector(P.moonElev, P.moonHeading);
  D.moonAz = [Math.sin(P.moonHeading * DEG), Math.cos(P.moonHeading * DEG)];
  D.cel = celestialFrame();
  const alpha = Math.PI * Math.abs(1 - 2 * P.moonPhase);
  const lx = (P.moonPhase < 0.5 ? 1 : -1) * Math.sin(alpha), tilt = P.moonTilt * DEG;
  D.moonLight = [lx * Math.cos(tilt), lx * Math.sin(tilt), Math.cos(alpha)];
  const moonI = P.moon ? MOON_I * Math.pow((1 + Math.cos(alpha)) / 2, 3.5) * P.moonLight : 0;
  const meteors = meteorField();
  D.meteorA = meteors.A;
  D.meteorB = meteors.B;
  D.meteorP = meteors.prog;
  D.meteorN = P.meteors;
  const layers = [0, 1, 2].filter(i => P[`c${i}On`] && P[`c${i}Cover`] > 0).sort((a, b) => P[`c${a}Alt`] - P[`c${b}Alt`]);
  D.cloudN = layers.length;
  D.cloudA = new Array(12).fill(0);
  D.cloudB = new Array(12).fill(0);
  D.cloudC = new Array(12).fill(0);
  D.cloudD = new Array(12).fill(0);
  layers.forEach((i, n) => {
    const c = k => P[`c${i}${k}`], w = c('Wind') * DEG, a = ANIM.cloud[i];
    D.cloudA.splice(n * 4, 4, c('Cover'), c('Dens'), c('Alt'), c('Thick'));
    D.cloudB.splice(n * 4, 4, c('Scale'), c('Billow'), c('Cells'), c('Streak'));
    D.cloudC.splice(n * 4, 4, c('Detail'), c('Soft'), a[2], c('Seed') + i * 7.3);
    D.cloudD.splice(n * 4, 4, Math.sin(w), Math.cos(w), a[0], a[1]);
  });
  updateAtmosphere();
  const ev = Math.pow(2, P.ev);
  const sunY = atmo.Ysun * P.sunIntensity;
  const gain = KEY / (sunY + (P.moon ? atmo.Ymoon * moonI : 0) + NIGHT_FLOOR);
  const nightVis = gain * NIGHT_FLOOR / KEY, sunVis = gain * sunY / KEY;
  D.gain = gain;
  D.sunScale = P.sunIntensity * gain * ev;
  D.moonScale = moonI * gain * ev;
  D.nightScale = nightVis * ev;
  D.moonDisk = ev * P.moonBright * (nightVis * 1.5 + sunVis * 0.05 * gain);
}

function sceneValues(img) {
  derive(img);
  return SCENE_UNIFORMS.map(([name, type, get]) => [name, type, get()]);
}

function drawSky(fbo, w, h, pix0, step, values, opts = {}) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, w, h);
  gl.useProgram(sky.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, atmo.trans.tex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, atmo.sun.tex);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, atmo.moon.tex);
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_3D, noise3);
  for (const [name, type, v] of values) if (sky.u[name]) SETTERS[type](sky.u[name], v);
  gl.uniform2fv(sky.u.uPix0, pix0);
  gl.uniform1f(sky.u.uPixStep, step);
  gl.uniform1f(sky.u.uTargetH, h);
  gl.uniform1f(sky.u.uSnap, opts.snap ? 1 : 0);
  gl.uniform1i(sky.u.uSamples, opts.samples || 1);
  gl.uniform1f(sky.u.uQuality, (opts.quality ?? 1) * P.cQuality);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ─── Motion ─────────────────────────────────────────────────────────────────

const RATES = [[1, 'Real'], [60, '1 min/s'], [600, '10 min/s'], [3600, '1 h/s'], [10800, '3 h/s']];
Object.assign(ANIM, { playing: false, reverse: false, rate: 600, elapsed: 0, origin: null, scale: 0.7 }, store('horizon-motion') || {});
ANIM.playing = false;

function rotateAboutPole(v, deg) {
  const phi = P.latitude * DEG, k = [0, Math.sin(phi), Math.cos(phi)], a = deg * DEG;
  const c = Math.cos(a), s = Math.sin(a), kv = v3.dot(k, v);
  const kx = [k[1] * v[2] - k[2] * v[1], k[2] * v[0] - k[0] * v[2], k[0] * v[1] - k[1] * v[0]];
  return [0, 1, 2].map(i => v[i] * c + kx[i] * s + k[i] * kv * (1 - c));
}

function setSkyVector(v, elevKey, headKey) {
  P[elevKey] = Math.asin(clamp(v[1], -1, 1)) / DEG;
  P[headKey] = (Math.atan2(v[0], v[2]) / DEG + 360) % 360;
}

function advance(dtReal) {
  const dt = dtReal * ANIM.rate * (ANIM.reverse ? -1 : 1);
  ANIM.time += dt;
  ANIM.elapsed += dt;
  ANIM.micro += dtReal * Math.min(ANIM.rate, 4);
  if (P.motionSky) {
    const h = dt / 3600;
    setSkyVector(rotateAboutPole(skyVector(P.sunElev, P.sunHeading), 15 * h), 'sunElev', 'sunHeading');
    setSkyVector(rotateAboutPole(skyVector(P.moonElev, P.moonHeading), 14.49 * h), 'moonElev', 'moonHeading');
    P.skyRotation = ((P.skyRotation + 15.041 * h) % 360 + 360) % 360;
  }
  if (P.motionClouds) {
    for (let i = 0; i < 3; i++) {
      const w = P[`c${i}Wind`] * DEG, ds = P[`c${i}Speed`] * P.windMul * dt / 1000;
      ANIM.cloud[i][0] -= Math.sin(w) * ds;
      ANIM.cloud[i][1] -= Math.cos(w) * ds;
      ANIM.cloud[i][2] += P[`c${i}Morph`] * P.morphMul * dt / 3600;
    }
  }
}

const ORIGIN_KEYS = ['sunElev', 'sunHeading', 'moonElev', 'moonHeading', 'skyRotation'];

function setPlaying(on) {
  if (on === ANIM.playing) return;
  if (on && !ANIM.origin) ANIM.origin = Object.fromEntries(ORIGIN_KEYS.map(k => [k, P[k]]));
  ANIM.playing = on;
  if (!on) commitSoon();
  invalidate();
  syncUI();
}

function resetTime() {
  if (ANIM.origin) Object.assign(P, ANIM.origin);
  Object.assign(ANIM, { time: 0, micro: 0, elapsed: 0, origin: ANIM.playing ? Object.fromEntries(ORIGIN_KEYS.map(k => [k, P[k]])) : null });
  ANIM.cloud = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
  changed();
}

function setRate(rate) {
  ANIM.rate = rate;
  store('horizon-motion', { rate });
  syncUI();
}

function elapsedLabel() {
  const t = Math.abs(ANIM.elapsed), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = Math.floor(t) % 60;
  return (ANIM.elapsed < 0 ? '−' : '+') + (h ? `${h}:${String(m).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`) + (h ? ' h' : '');
}

// ─── Preview Rendering ──────────────────────────────────────────────────────

const VIEW = Object.assign({ scale: 1 }, store('horizon-view'));
const LOW = 0.45;
let needLow = true, needFull = true, lastChange = 0, lowTarget = null;
let renderMs = 0;

function invalidate() {
  needLow = needFull = true;
  lastChange = performance.now();
}

function viewMapping(cw) {
  const k = cw / canvas.clientWidth;
  const [W, H] = captureDims();
  return { pix0: [-F.x * W / F.w, -F.y * H / F.h], step: W / (F.w * k) };
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr * VIEW.scale));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr * VIEW.scale));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    invalidate();
  }
}

function renderView(scale = 1, quality = 1) {
  const values = sceneValues();
  const t0 = performance.now();
  if (scale < 1) {
    const w = Math.max(1, Math.round(canvas.width * scale)), h = Math.max(1, Math.round(canvas.height * scale));
    if (!lowTarget || lowTarget.w !== w || lowTarget.h !== h) {
      if (lowTarget) lowTarget.free();
      lowTarget = target(w, h);
    }
    const m = viewMapping(w);
    drawSky(lowTarget.fbo, w, h, m.pix0, m.step, values, { quality });
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, lowTarget.fbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    gl.blitFramebuffer(0, 0, w, h, 0, 0, canvas.width, canvas.height, gl.COLOR_BUFFER_BIT, gl.LINEAR);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  } else {
    const m = viewMapping(canvas.width);
    drawSky(null, canvas.width, canvas.height, m.pix0, m.step, values, { quality });
  }
  renderMs = performance.now() - t0;
}

const loupeEl = $('loupe');
const loupeCtx = loupeEl.getContext('2d');
let loupeTarget = null, loupeAt = null, loupeQueued = false;

function drawLoupe() {
  loupeQueued = false;
  if (!C.on || !C.loupe || !loupeAt) { loupeEl.classList.remove('on'); return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const S = Math.round(220 * dpr);
  if (!loupeTarget || loupeTarget.w !== S) {
    if (loupeTarget) loupeTarget.free();
    loupeTarget = target(S, S);
    loupeEl.width = loupeEl.height = S;
  }
  const [ix, iy] = cssToImage(loupeAt[0], loupeAt[1]);
  const step = 0.5;
  drawSky(loupeTarget.fbo, S, S, [ix - S / 2 * step, iy - S / 2 * step], step, sceneValues(), { snap: true });
  const px = new Uint8ClampedArray(S * S * 4);
  gl.readPixels(0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const img = new ImageData(S, S);
  for (let y = 0; y < S; y++) img.data.set(px.subarray((S - 1 - y) * S * 4, (S - y) * S * 4), y * S * 4);
  loupeCtx.putImageData(img, 0, 0);
  loupeEl.style.left = loupeAt[0] - 110 + 'px';
  loupeEl.style.top = loupeAt[1] - 110 + 'px';
  loupeEl.classList.add('on');
}

function queueLoupe() {
  if (!loupeQueued) { loupeQueued = true; requestAnimationFrame(drawLoupe); }
}

// ─── Export ─────────────────────────────────────────────────────────────────

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(parts) {
  let c = 0xffffffff;
  for (const b of parts) for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function pngChunk(type, data) {
  const head = new Uint8Array(8);
  new DataView(head.buffer).setUint32(0, data.length);
  for (let i = 0; i < 4; i++) head[4 + i] = type.charCodeAt(i);
  const tail = new Uint8Array(4);
  new DataView(tail.buffer).setUint32(0, crc32([head.subarray(4), data]));
  return [head, data, tail];
}

async function encodePNG(rgba, W, H, progress) {
  const ihdr = new Uint8Array(13);
  const dv = new DataView(ihdr.buffer);
  dv.setUint32(0, W);
  dv.setUint32(4, H);
  ihdr[8] = 8;
  ihdr[9] = 2;
  const cs = new CompressionStream('deflate');
  const compressed = new Response(cs.readable).arrayBuffer();
  const writer = cs.writable.getWriter();
  const stride = W * 3, ROWS = 48;
  let t0 = performance.now();
  for (let y0 = 0; y0 < H; y0 += ROWS) {
    const n = Math.min(ROWS, H - y0), buf = new Uint8Array(n * (stride + 1));
    for (let i = 0; i < n; i++) {
      const y = y0 + i, o = i * (stride + 1) + 1, cur = y * W * 4, prev = cur - W * 4;
      buf[o - 1] = 4;
      for (let x = 0, k = 0; x < W; x++) {
        for (let ch = 0; ch < 3; ch++, k++) {
          const q = x * 4 + ch;
          const a = x > 0 ? rgba[cur + q - 4] : 0;
          const b = y > 0 ? rgba[prev + q] : 0;
          const c = x > 0 && y > 0 ? rgba[prev + q - 4] : 0;
          const p = a + b - c, pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
          buf[o + k] = rgba[cur + q] - (pa <= pb && pa <= pc ? a : pb <= pc ? b : c);
        }
      }
    }
    await writer.write(buf);
    if (performance.now() - t0 > 40) {
      progress((y0 + n) / H);
      await nextFrame();
      t0 = performance.now();
      if (job.cancel) { writer.abort(); return null; }
    }
  }
  await writer.close();
  const idat = new Uint8Array(await compressed);
  const sig = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
  return new Blob([sig, ...pngChunk('IHDR', ihdr), ...pngChunk('IDAT', idat), ...pngChunk('IEND', new Uint8Array(0))], { type: 'image/png' });
}

async function encodeJPEG(rgba, W, H) {
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d');
  if (!ctx) return null;
  const ROWS = 512;
  for (let y0 = 0; y0 < H; y0 += ROWS) {
    const n = Math.min(ROWS, H - y0);
    ctx.putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer, y0 * W * 4, n * W * 4), W, n), 0, y0);
  }
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.95));
}

let job = null;

function busy(title, frac, meta) {
  $('busy').classList.add('on');
  $('busy-title').textContent = title;
  $('busy-fill').style.width = (frac * 100).toFixed(1) + '%';
  $('busy-meta').textContent = meta;
}

async function renderTiles(W, H, opts, onTile) {
  const T = 512, values = sceneValues(), tile = target(T, T);
  const px = new Uint8Array(T * T * 4), out = opts.into || new Uint8Array(W * H * 4);
  const total = Math.ceil(W / T) * Math.ceil(H / T);
  let done = 0, t0 = performance.now();
  for (let ty = 0; ty < H && !job.cancel; ty += T) {
    for (let tx = 0; tx < W && !job.cancel; tx += T) {
      const tw = Math.min(T, W - tx), th = Math.min(T, H - ty);
      drawSky(tile.fbo, tw, th, [tx * opts.step, ty * opts.step], opts.step, values, opts);
      gl.readPixels(0, 0, tw, th, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (let r = 0; r < th; r++) out.set(px.subarray(r * tw * 4, (r + 1) * tw * 4), ((ty + th - 1 - r) * W + tx) * 4);
      done++;
      if (performance.now() - t0 > 32) {
        onTile(done / total);
        await nextFrame();
        t0 = performance.now();
      }
    }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  tile.free();
  return out;
}

function runExport() {
  if (job) return;
  setPlaying(false);
  (C.format === 'mp4' ? recordVideo : saveStill)().catch(e => toast(e.message)).finally(() => {
    job = null;
    $('busy').classList.remove('on');
    invalidate();
    syncUI();
  });
}

async function saveStill() {
  const [W, H] = captureDims(), label = `${W} × ${H}`, format = C.format;
  job = { cancel: false };
  busy(`Rendering ${label}`, 0, 'Preparing');
  await nextFrame();
  const rgba = await renderTiles(W, H, { step: 1, samples: C.samples, quality: C.samples > 1 ? 1.5 : 1.2 },
    f => busy(`Rendering ${label}`, f * 0.7, `${Math.round(f * 100)}% rendered`));
  if (job.cancel) return;
  busy(`Encoding ${format === 'png' ? 'PNG' : 'JPEG'}`, 0.7, label);
  await nextFrame();
  const blob = format === 'png'
    ? await encodePNG(rgba, W, H, f => busy('Encoding PNG', 0.7 + f * 0.3, label))
    : await encodeJPEG(rgba, W, H);
  if (job.cancel) return;
  if (!blob) throw new Error(`This browser can't encode a ${label} JPEG. Use PNG instead.`);
  presentCapture(blob, W, H, format);
}

// ─── Video ──────────────────────────────────────────────────────────────────

const AVC_LEVELS = [[0x28, 8192, 245760], [0x2a, 8704, 522240], [0x32, 22080, 589824], [0x33, 36864, 983040], [0x34, 36864, 2073600]];

async function videoConfig(W, H, fps) {
  const mbs = Math.ceil(W / 16) * Math.ceil(H / 16);
  for (const [level, fs, mbps] of AVC_LEVELS) {
    if (mbs > fs || mbs * fps > mbps) continue;
    const config = {
      codec: 'avc1.6400' + level.toString(16), width: W, height: H, framerate: fps,
      bitrate: Math.round(W * H * fps * 0.2), avc: { format: 'avc' },
    };
    if ((await VideoEncoder.isConfigSupported(config)).supported) return config;
  }
  return null;
}

async function recordVideo() {
  if (!('VideoEncoder' in window)) throw new Error('Video capture needs WebCodecs: use Chrome, Edge, or Safari 17 or newer.');
  const [W0, H0] = captureDims(), k = Math.min(1, 3840 / Math.max(W0, H0));
  const W = Math.round(W0 * k / 2) * 2, H = Math.round(H0 * k / 2) * 2;
  const fps = C.fps, frames = Math.round(C.seconds * fps), label = `${W} × ${H} · ${fps} fps`;
  const config = await videoConfig(W, H, fps);
  if (!config) throw new Error(`This browser can't encode ${W} × ${H} video at ${fps} fps. Try a smaller size or frame rate.`);
  job = { cancel: false, error: null };
  const samples = [];
  let avcC = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      const desc = meta?.decoderConfig?.description;
      if (desc) avcC = ArrayBuffer.isView(desc) ? new Uint8Array(desc.buffer, desc.byteOffset, desc.byteLength).slice() : new Uint8Array(desc).slice();
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      samples.push({ data, key: chunk.type === 'key', pts: chunk.timestamp });
    },
    error: e => { job.error = e; },
  });
  encoder.configure(config);
  const savedP = JSON.stringify(P), savedAnim = JSON.stringify(ANIM);
  ANIM.playing = true;
  const step = W0 / W, rgba = new Uint8Array(W * H * 4);
  try {
    for (let f = 0; f < frames && !job.cancel && !job.error; f++) {
      if (f > 0) advance(1 / fps);
      await renderTiles(W, H, { step, samples: 1, quality: 1, into: rgba },
        t => busy(`Recording ${label}`, (f + t) / frames * 0.97, `Frame ${f + 1} of ${frames}`));
      const frame = new VideoFrame(rgba, { format: 'RGBA', codedWidth: W, codedHeight: H, timestamp: Math.round(f * 1e6 / fps), duration: Math.round(1e6 / fps) });
      encoder.encode(frame, { keyFrame: f % (fps * 2) === 0 });
      frame.close();
      busy(`Recording ${label}`, (f + 1) / frames * 0.97, `Frame ${f + 1} of ${frames}`);
      while (encoder.encodeQueueSize > 2) await nextFrame();
    }
    if (!job.cancel && !job.error) await encoder.flush();
  } finally {
    encoder.close();
    Object.assign(P, JSON.parse(savedP));
    Object.assign(ANIM, JSON.parse(savedAnim));
  }
  if (job.error) throw new Error('The video encoder stopped: ' + job.error.message);
  if (job.cancel || !samples.length) return;
  presentCapture(muxMP4(samples, avcC, W, H, fps), W, H, 'mp4');
}

function muxMP4(samples, avcC, W, H, fps) {
  const u32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, v); return b; };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v); return b; };
  const u16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, v); return b; };
  const str = s => new Uint8Array([...s].map(c => c.charCodeAt(0)));
  const zeros = n => new Uint8Array(n);
  const box = (type, ...parts) => {
    const size = 8 + parts.reduce((n, p) => n + p.length, 0), out = new Uint8Array(size);
    out.set(u32(size), 0);
    out.set(str(type), 4);
    let o = 8;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  };
  const full = (type, version, flags, ...parts) => box(type, new Uint8Array([version, flags >> 16 & 255, flags >> 8 & 255, flags & 255]), ...parts);
  const matrix = [0x10000, 0, 0, 0, 0x10000, 0, 0, 0, 0x40000000].map(u32);
  const timescale = fps * 1000, delta = 1000, n = samples.length, duration = n * delta;
  const offsets = samples.map((s, i) => Math.round(s.pts * fps / 1e6) * delta - i * delta);
  const shift = Math.max(0, -Math.min(...offsets));
  const ftyp = box('ftyp', str('isom'), u32(512), str('isom'), str('iso2'), str('avc1'), str('mp41'));
  const mdatSize = 8 + samples.reduce((t, s) => t + s.data.length, 0);
  const keys = samples.flatMap((s, i) => s.key ? [u32(i + 1)] : []);
  const stbl = box('stbl',
    full('stsd', 0, 0, u32(1), box('avc1', zeros(6), u16(1), zeros(16), u16(W), u16(H), u32(0x480000), u32(0x480000), u32(0), u16(1), zeros(32), u16(0x18), u16(0xffff), box('avcC', avcC))),
    full('stts', 0, 0, u32(1), u32(n), u32(delta)),
    ...(offsets.some(o => o + shift) ? [full('ctts', 0, 0, u32(n), ...offsets.flatMap(o => [u32(1), i32(o + shift)]))] : []),
    full('stss', 0, 0, u32(keys.length), ...keys),
    full('stsc', 0, 0, u32(1), u32(1), u32(n), u32(1)),
    full('stsz', 0, 0, u32(0), u32(n), ...samples.map(s => u32(s.data.length))),
    full('stco', 0, 0, u32(1), u32(ftyp.length + 8)));
  const moov = box('moov',
    full('mvhd', 0, 0, u32(0), u32(0), u32(timescale), u32(duration), u32(0x10000), u16(0x100), zeros(10), ...matrix, zeros(24), u32(2)),
    box('trak',
      full('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(duration), zeros(8), u16(0), u16(0), u16(0), u16(0), ...matrix, u32(W * 65536), u32(H * 65536)),
      box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(timescale), u32(duration), u16(0x55c4), u16(0)),
        full('hdlr', 0, 0, u32(0), str('vide'), zeros(12), str('Horizon\0')),
        box('minf', full('vmhd', 0, 1, zeros(8)), box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))), stbl))));
  return new Blob([ftyp, u32(mdatSize), str('mdat'), ...samples.map(s => s.data), moov], { type: 'video/mp4' });
}

let sheetURL = null;
const framed = window.self !== window.top;

function presentCapture(blob, W, H, format) {
  if (sheetURL) URL.revokeObjectURL(sheetURL);
  sheetURL = URL.createObjectURL(blob);
  const video = format === 'mp4';
  const name = `horizon-${W}x${H}.${format}`;
  const img = $('sheet-img'), vid = $('sheet-video');
  img.hidden = video;
  vid.hidden = !video;
  if (video) { vid.src = sheetURL; vid.play().catch(() => {}); } else { img.src = sheetURL; }
  $('sheet-meta').textContent = `${name} · ${(blob.size / 1048576).toFixed(1)} MB` +
    (framed ? ` · Right-click the ${video ? 'video' : 'image'} and choose Save ${video ? 'Video' : 'Image'} As, or long-press it on iPhone.` : '');
  const save = $('sheet-save');
  save.hidden = framed;
  save.onclick = () => {
    const a = document.createElement('a');
    a.href = sheetURL;
    a.download = name;
    a.click();
  };
  $('sheet').classList.add('on');
  if (!framed) save.onclick();
}

$('sheet-close').onclick = () => { $('sheet').classList.remove('on'); $('sheet-video').pause(); };

let tab = store('horizon-tab') || 'sky';
const refreshers = [];
let statEl, tabBody, tabButtons = {};

function setPanel(open) {
  panel.classList.toggle('hidden', !open);
  $('reopen').classList.toggle('on', !open);
  layout();
}

function changed() {
  invalidate();
  syncUI();
  commitSoon();
}

const history = { past: [], future: [], base: null, timer: 0 };

function commitSoon() {
  clearTimeout(history.timer);
  history.timer = setTimeout(commit, 400);
}

function commit() {
  if (ANIM.playing) return;
  const snap = JSON.stringify(P);
  if (history.base !== null && snap !== history.base) {
    history.past.push(history.base);
    if (history.past.length > 150) history.past.shift();
    history.future.length = 0;
  }
  history.base = snap;
  syncUI();
}

function restoreSnapshot(snap) {
  Object.assign(P, JSON.parse(snap));
  invalidate();
  syncUI();
}

function undo() {
  commit();
  if (!history.past.length) return;
  history.future.push(history.base);
  history.base = history.past.pop();
  restoreSnapshot(history.base);
}

function redo() {
  if (!history.future.length) return;
  history.past.push(history.base);
  history.base = history.future.pop();
  restoreSnapshot(history.base);
}

function syncUI() {
  for (const f of refreshers) f();
  for (const f of lookRefreshers) f();
  frameEl.classList.toggle('on', C.on);
  frameEl.classList.toggle('grid', C.on && C.grid);
  bar.classList.toggle('capture', C.on);
  if (!C.on || !C.loupe) loupeEl.classList.remove('on');
}

function accessor(it) {
  return {
    get: it.get ?? (() => P[resolveKey(it.key)]),
    set: it.set ?? (v => { P[resolveKey(it.key)] = v; }),
  };
}

function buildItem(it, body) {
  const { get, set } = accessor(it);
  if (it.type === 'custom') return it.build(body);
  if (it.type === 'button') {
    const row = el('div', 'row', body);
    el('button', 'btn', row, it.label).onclick = it.action;
    return;
  }
  if (it.type === 'toggle') {
    const row = el('div', 'tog', body);
    el('span', null, row, it.label);
    el('span', 'sw', row);
    row.onclick = () => { set(!get()); it.after?.(); changed(); };
    refreshers.push(() => {
      row.classList.toggle('on', !!get());
      if (it.when) row.classList.toggle('off', !it.when());
    });
    return;
  }
  if (it.type === 'choice') {
    const row = el('div', 'row', body);
    el('div', 'lab', row, it.label);
    const seg = el('div', 'seg' + (it.cols ? ' c' + it.cols : ''), row);
    for (const o of it.options) {
      const b = el('button', 'btn', seg, o.title);
      b.onclick = () => { set(o.value); it.after?.(); changed(); };
      refreshers.push(() => b.classList.toggle('active', get() === o.value));
    }
    if (it.when) refreshers.push(() => row.classList.toggle('off', !it.when()));
    return;
  }
  if (it.type === 'color') {
    const row = el('div', 'row', body);
    const lab = el('div', 'lab', row);
    el('span', null, lab, it.label);
    lab.appendChild(colorInput(it.key));
    if (it.when) refreshers.push(() => row.classList.toggle('off', !it.when()));
    return;
  }
  const row = el('div', 'row', body);
  const lab = el('div', 'lab', row);
  const name = el('span', null, lab, it.label);
  const right = el('div', 'lab-r', lab);
  const val = el('span', 'val', right);
  if (it.color) right.appendChild(colorInput(it.color));
  const input = el('input', null, row);
  Object.assign(input, { type: 'range', min: it.min, max: it.max, step: it.step });
  input.oninput = () => { set(parseFloat(input.value)); it.after?.(); changed(); };
  if (it.key) name.ondblclick = () => { set(DEFAULTS[resolveKey(it.key)]); changed(); };
  refreshers.push(() => {
    if (it.range) { const [a, b] = it.range(); input.min = a; input.max = b; }
    input.value = get();
    val.textContent = it.fmt(get());
    if (it.when) row.classList.toggle('off', !it.when());
  });
}

function buildSurfaces(body) {
  const row = el('div', 'row', body);
  el('div', 'lab', row, 'Surface Type');
  const seg = el('div', 'seg c3', row);
  for (const [title, type, values] of SURFACES) {
    const b = el('button', 'btn', seg, title);
    b.onclick = () => { Object.assign(P, values, { surface: type }); changed(); };
    refreshers.push(() => b.classList.toggle('active', P.surface === type && P.surfColorA === values.surfColorA));
  }
}

function buildLayerPicker(body) {
  const row = el('div', 'row', body);
  const seg = el('div', 'seg c3', row);
  for (let i = 0; i < 3; i++) {
    const b = el('button', 'btn', seg);
    b.onclick = () => { cloudSel = i; syncUI(); };
    refreshers.push(() => {
      b.classList.toggle('active', cloudSel === i);
      b.textContent = P[`c${i}On`] ? `${P[`c${i}Alt`].toFixed(1)} km` : `Layer ${i + 1}`;
    });
  }
}

function buildCloudTypes(body) {
  const row = el('div', 'row', body);
  el('div', 'lab', row, 'Cloud Type');
  const seg = el('div', 'seg c3', row);
  for (const [name, values] of Object.entries(CLOUD_TYPES)) {
    const b = el('button', 'btn', seg, name[0].toUpperCase() + name.slice(1));
    b.onclick = () => {
      for (const [k, v] of Object.entries(values)) P[`c${cloudSel}${k}`] = v;
      P[`c${cloudSel}On`] = true;
      changed();
    };
    refreshers.push(() => b.classList.toggle('active', Object.entries(values).every(([k, v]) => P[`c${cloudSel}${k}`] === v)));
  }
}

function colorInput(key) {
  const input = document.createElement('input');
  input.type = 'color';
  input.id = 'c-' + key;
  input.oninput = () => { P[key] = input.value; changed(); };
  refreshers.push(() => { input.value = P[key]; });
  return input;
}

function buildAspect(body) {
  const row = el('div', 'row', body);
  el('div', 'lab', row, 'Aspect Ratio');
  const seg = el('div', 'seg', row);
  for (const [name, a, b] of ASPECTS) {
    const btn = el('button', 'btn', seg, name);
    btn.onclick = () => setCapture({ ratio: a / b });
    refreshers.push(() => btn.classList.toggle('active', Math.abs(C.ratio - a / b) < 1e-4));
  }
}

function buildDevice(body) {
  const row = el('div', 'row', body);
  el('div', 'lab', row, 'Device');
  const sel = el('select', null, row);
  sel.id = 'device';
  el('option', null, sel, 'Custom').value = '';
  DEVICES.forEach(([name, w, h], i) => { el('option', null, sel, `${name} · ${w} × ${h}`).value = i; });
  sel.onchange = () => {
    if (sel.value === '') return;
    const [, w, h] = DEVICES[+sel.value];
    setCapture({ ratio: w / h, long: Math.max(w, h) });
  };
  refreshers.push(() => {
    const [W, H] = captureDims();
    const i = DEVICES.findIndex(([, w, h]) => w === W && h === H);
    sel.value = i < 0 ? '' : i;
  });
}

function buildSize(body) {
  const row = el('div', 'row', body);
  el('div', 'lab', row, 'Long Edge');
  const seg = el('div', 'seg c3', row);
  for (const [name, L] of SIZES) {
    const btn = el('button', 'btn', seg, name);
    btn.onclick = () => setCapture({ long: L });
    refreshers.push(() => btn.classList.toggle('active', C.long === L));
  }
  const dims = el('div', 'row dims', body);
  const wIn = el('input', 'num', dims);
  el('span', null, dims, '×');
  const hIn = el('input', 'num', dims);
  for (const [inp, id] of [[wIn, 'cap-w'], [hIn, 'cap-h']]) Object.assign(inp, { id, type: 'number', min: 64, max: MAX_SIDE, step: 1 });
  const commit = () => {
    const w = clamp(Math.round(+wIn.value) || 64, 64, MAX_SIDE), h = clamp(Math.round(+hIn.value) || 64, 64, MAX_SIDE);
    setCapture({ ratio: w / h, long: Math.max(w, h) });
  };
  wIn.onchange = hIn.onchange = commit;
  const note = el('div', 'note', body);
  refreshers.push(() => {
    const [W, H] = captureDims();
    if (document.activeElement !== wIn) wIn.value = W;
    if (document.activeElement !== hIn) hIn.value = H;
    note.textContent = `${(W * H / 1e6).toFixed(1)} megapixels · ${Math.ceil(W / 512) * Math.ceil(H / 512)} render tiles`;
  });
}

function showTab(id) {
  tab = id;
  store('horizon-tab', id);
  for (const [k, b] of Object.entries(tabButtons)) b.classList.toggle('active', k === id);
  refreshers.length = 0;
  refreshers.push(...staticRefreshers);
  tabBody.textContent = '';
  const t = TABS.find(t => t.id === id);
  for (const [title, items] of t.sections) {
    const sec = el('div', 'sec', tabBody);
    el('button', 'sh', sec, title).onclick = () => sec.classList.toggle('closed');
    const body = el('div', 'body', sec);
    for (const it of items) buildItem(it, body);
  }
  if (id === 'capture' && !C.on) setCaptureMode(true);
  syncUI();
}

const staticRefreshers = [];

function svg(paths) {
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round">${paths}</svg>`;
}

const lookRefreshers = [];

function buildLookStrip() {
  const strip = $('looks');
  strip.textContent = '';
  lookRefreshers.length = 0;
  thumbQueue.length = 0;
  for (const look of [...PRESETS, ...looks]) {
    const card = el('button', 'preset', strip);
    const cv = el('canvas', null, card);
    cv.width = 140;
    cv.height = 88;
    el('span', null, card, look.name);
    card.onclick = () => applyLook(look);
    if (looks.includes(look)) {
      const x = el('span', 'x', card, '×');
      x.title = 'Delete this look';
      x.onclick = e => {
        e.stopPropagation();
        if (x.classList.contains('armed')) return deleteLook(look);
        x.classList.add('armed');
        x.textContent = 'Delete';
        setTimeout(() => { x.classList.remove('armed'); x.textContent = '×'; }, 2500);
      };
    }
    thumbQueue.push([look, cv]);
    lookRefreshers.push(() => card.classList.toggle('active', lookActive(look)));
  }
  const add = el('button', 'preset add', strip);
  el('div', 'plus', add, '+');
  el('span', null, add, 'Save Look');
  add.onclick = () => { $('save-row').hidden = false; $('look-name').focus(); };
  for (const f of lookRefreshers) f();
}

function buildUI() {
  const head = el('div', 'head', panel);
  el('div', 'title', head, 'Horizon');
  const hr = el('div', 'head-r', head);
  statEl = el('span', 'stat', hr);
  for (const [title, icon, fn, has] of [
    ['Undo (⌘Z)', '<path d="M5.5 4L2.5 7l3 3"/><path d="M2.5 7h7a4 4 0 0 1 0 8H8"/>', undo, () => history.past.length],
    ['Redo (⇧⌘Z)', '<path d="M10.5 4l3 3-3 3"/><path d="M13.5 7h-7a4 4 0 0 0 0 8H8"/>', redo, () => history.future.length],
  ]) {
    const b = el('button', 'icon', hr);
    b.title = title;
    b.innerHTML = svg(icon);
    b.onclick = fn;
    staticRefreshers.push(() => { b.disabled = !has(); });
  }
  const hide = el('button', 'icon', hr);
  hide.setAttribute('aria-label', 'Hide controls (H)');
  hide.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
  hide.onclick = () => setPanel(false);
  $('reopen').onclick = () => setPanel(true);

  el('div', 'presets', panel).id = 'looks';
  const saveRow = el('form', 'saverow', panel);
  saveRow.id = 'save-row';
  saveRow.hidden = true;
  const nameIn = el('input', 'num', saveRow);
  Object.assign(nameIn, { id: 'look-name', placeholder: 'Name this look', maxLength: 32 });
  el('button', 'btn primary', saveRow, 'Save');
  const cancelSave = el('button', 'btn', saveRow, 'Cancel');
  cancelSave.type = 'button';
  cancelSave.onclick = () => { saveRow.hidden = true; };
  saveRow.onsubmit = e => {
    e.preventDefault();
    const name = nameIn.value.trim();
    if (!name) return;
    saveLook(name);
    nameIn.value = '';
    saveRow.hidden = true;
    toast(`Saved “${name}”`);
  };
  buildLookStrip();

  const tabs = el('nav', 'tabs', panel);
  for (const t of TABS) {
    const b = el('button', 'tab', tabs);
    b.innerHTML = svg(ICONS[t.id]) + `<span>${t.label}</span>`;
    b.onclick = () => showTab(t.id);
    tabButtons[t.id] = b;
  }
  tabBody = el('div', 'tabbody', panel);
  const foot = el('div', 'foot', panel);
  const seed = el('button', 'btn', foot, 'Reseed');
  seed.title = 'New random star, cloud, and terrain patterns';
  seed.onclick = reseed;
  const cap = el('button', 'btn primary', foot, 'Capture');
  cap.onclick = () => setCaptureMode(!C.on);
  staticRefreshers.push(() => { cap.textContent = C.on ? 'Exit Capture' : 'Capture'; cap.classList.toggle('primary', !C.on); });

  const play = el('button', 'icon', bar);
  play.title = 'Play timelapse (Space)';
  play.onclick = () => setPlaying(!ANIM.playing);
  const rateBtn = el('button', 'btn ghost', bar);
  rateBtn.title = 'Timelapse speed';
  rateBtn.onclick = () => {
    const i = RATES.findIndex(([r]) => r === ANIM.rate);
    setRate(RATES[(i + 1) % RATES.length][0]);
  };
  const clock = el('span', 'info clock', bar);
  const reset = el('button', 'icon', bar);
  reset.title = 'Reset time';
  reset.innerHTML = svg('<path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.3"/><path d="M3 2.5v2.8h2.8"/>');
  reset.onclick = resetTime;
  staticRefreshers.push(() => {
    play.innerHTML = svg(ANIM.playing ? '<path d="M5 3.5v9M11 3.5v9"/>' : '<path d="M5 3l8 5-8 5z"/>');
    play.classList.toggle('on', ANIM.playing);
    rateBtn.textContent = (RATES.find(([r]) => r === ANIM.rate) || RATES[2])[1];
    clock.textContent = elapsedLabel();
  });
  const group = el('div', 'capgroup', bar);
  const info = el('span', 'info', group);
  staticRefreshers.push(() => {
    const [W, H] = captureDims();
    info.innerHTML = `<b>${W} × ${H}</b> · ${(W * H / 1e6).toFixed(1)} MP · ${C.format === 'png' ? 'PNG' : C.format === 'jpg' ? 'JPEG' : 'MP4'}`;
  });
  const toggles = [
    ['grid', 'Thirds grid', '<path d="M5.5 2v12M10.5 2v12M2 5.5h12M2 10.5h12"/>'],
    ['loupe', 'Pixel loupe (L)', '<circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4L14 14"/>'],
  ];
  for (const [key, title, icon] of toggles) {
    const b = el('button', 'icon', group);
    b.title = title;
    b.innerHTML = svg(icon);
    b.onclick = () => { key === 'grid' ? setCapture({ grid: !C.grid }) : (C.loupe = !C.loupe, syncUI()); };
    staticRefreshers.push(() => b.classList.toggle('on', !!C[key]));
  }
  el('button', 'btn', group, 'Done').onclick = () => setCaptureMode(false);
  const save = el('button', 'btn primary', group);
  save.onclick = runExport;
  staticRefreshers.push(() => { save.textContent = C.format === 'mp4' ? 'Record Video' : 'Save Image'; });
  showTab(TABS.some(t => t.id === tab) ? tab : 'sky');
}

function setCaptureMode(on) {
  C.on = on;
  if (!on && tab === 'capture') showTab('sky');
  syncUI();
}

// ─── Input ──────────────────────────────────────────────────────────────────

const pointers = new Map();

function radPerCss() {
  return P.proj === 3 ? TAU / F.w : P.fov * DEG / Math.hypot(F.w, F.h);
}

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e => {
  if (C.on && C.loupe && e.pointerType === 'mouse') { loupeAt = [e.clientX, e.clientY]; queueLoupe(); }
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  if (pointers.size === 1) {
    const k = radPerCss() / DEG;
    P.heading = ((P.heading - (e.clientX - prev.x) * k) % 360 + 360) % 360;
    if (P.proj !== 3) P.pitch = clamp(P.pitch + (e.clientY - prev.y) * k, -90, 90);
  } else if (pointers.size === 2) {
    const other = [...pointers].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y);
    const d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    if (d0 > 0 && d1 > 0) zoom(d0 / d1);
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  changed();
});
canvas.addEventListener('lostpointercapture', e => {
  pointers.delete(e.pointerId);
  if (!pointers.size) canvas.classList.remove('drag');
});
canvas.addEventListener('pointerleave', () => { loupeAt = null; queueLoupe(); });

function zoom(f) {
  const r = PROJECTIONS[P.proj];
  P.fov = clamp(P.fov * f, r.min, r.max);
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  changed();
}, { passive: false });
let pinchFrom = 0;
canvas.addEventListener('gesturestart', e => { e.preventDefault(); pinchFrom = P.fov; });
canvas.addEventListener('gesturechange', e => {
  e.preventDefault();
  if (pointers.size < 2) { zoom(pinchFrom / e.scale / P.fov); changed(); }
});
canvas.addEventListener('webglcontextlost', () => fail('The GPU context was lost. Reload the page to continue.'));

window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.target.matches('input[type=number], select')) {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'h') setPanel(panel.classList.contains('hidden'));
  else if (k === 'c') setCaptureMode(!C.on);
  else if (k === 'l' && C.on) { C.loupe = !C.loupe; syncUI(); }
  else if (k === ' ') { e.preventDefault(); setPlaying(!ANIM.playing); }
  else if (k === '[' || k === ']') {
    const i = RATES.findIndex(([r]) => r === ANIM.rate);
    setRate(RATES[clamp(i + (k === ']' ? 1 : -1), 0, RATES.length - 1)][0]);
  }
  else if (k === 'escape') { if ($('sheet').classList.contains('on')) $('sheet').classList.remove('on'); else if (C.on) setCaptureMode(false); }
});
window.addEventListener('resize', layout);

// ─── Main Loop ──────────────────────────────────────────────────────────────

let statT = 0, uiT = 0, lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (!job) {
    resizeCanvas();
    if (ANIM.playing) {
      advance(dt);
      ANIM.scale = clamp(ANIM.scale * (dt > 0.034 ? 0.94 : dt < 0.022 ? 1.03 : 1), 0.3, 1);
      renderView(ANIM.scale, 0.75);
      needFull = true;
      needLow = false;
      if (now - uiT > 150) { syncUI(); uiT = now; }
    } else {
      const settling = now - lastChange < 150;
      if (needLow && settling) { renderView(LOW, 0.6); needLow = false; }
      else if (needFull && !settling) { renderView(1, 1); needFull = needLow = false; }
      else if (thumbQueue.length && !settling) renderThumb(...thumbQueue.shift());
    }
    if (now - statT > 250) { statEl.textContent = renderMs.toFixed(1) + ' ms'; statT = now; }
  }
  requestAnimationFrame(frame);
}

buildUI();
layout();
history.base = JSON.stringify(P);
requestAnimationFrame(frame);
</script>
</body>
</html>

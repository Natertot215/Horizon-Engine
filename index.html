<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon Engine</title>
<style>
:root {
  --ink: #eef0f6;
  --dim: rgba(238, 240, 246, .56);
  --faint: rgba(238, 240, 246, .14);
  --line: rgba(238, 240, 246, .08);
  --panel: rgba(9, 10, 15, .78);
  --shade: rgba(4, 5, 9, .64);
  --void: #05060a;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body {
  height: 100%; background: var(--void); color: var(--ink); overflow: hidden;
  font: 11px/1.4 ui-sans-serif, -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view.drag { cursor: grabbing; }
#view.place { cursor: crosshair; }

#frame { position: fixed; pointer-events: none; display: none; outline: 1px solid rgba(255, 255, 255, .6); box-shadow: 0 0 0 200vmax var(--shade); }
#frame.on { display: block; }
#frame.grid::before {
  content: ""; position: absolute; inset: 0;
  --g: rgba(255, 255, 255, .26);
  background:
    linear-gradient(to right, transparent calc(33.333% - .5px), var(--g) 0 calc(33.333% + .5px), transparent 0 calc(66.667% - .5px), var(--g) 0 calc(66.667% + .5px), transparent 0),
    linear-gradient(to bottom, transparent calc(33.333% - .5px), var(--g) 0 calc(33.333% + .5px), transparent 0 calc(66.667% - .5px), var(--g) 0 calc(66.667% + .5px), transparent 0);
}
#loupe {
  position: fixed; width: 220px; height: 220px; border-radius: 50%; pointer-events: none; display: none;
  border: 1px solid rgba(255, 255, 255, .7); box-shadow: 0 10px 40px rgba(0, 0, 0, .6); background: #000;
  image-rendering: pixelated;
}
#loupe.on { display: block; }

/* Frosted glass behind the panel, the bar and the toast. */
#panel, #bar, #toast {
  background: var(--panel); border: 1px solid var(--faint);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
}
#panel {
  position: fixed; top: 12px; right: 12px; bottom: 12px; width: 300px; display: flex; flex-direction: column;
  border-radius: 14px; transition: opacity .2s, transform .2s;
}
#panel.hidden { opacity: 0; transform: translateX(12px); pointer-events: none; }
/* Scrolling strips (and the panel itself on phones) hide their scrollbars. */
#panel, .presets, .tabbody { scrollbar-width: none; }
#panel::-webkit-scrollbar, .presets::-webkit-scrollbar, .tabbody::-webkit-scrollbar { display: none; }
.head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 8px 14px; }
.title { letter-spacing: .26em; text-transform: uppercase; font-size: 10px; }
.head-r { display: flex; align-items: center; gap: 4px; }
.stat { color: var(--dim); font: 10px var(--mono); margin-right: 6px; font-variant-numeric: tabular-nums; }
/* Bare buttons: no chrome, dim until hovered or active. */
.icon, .preset, .tab, .sh { background: none; border: 0; color: var(--dim); cursor: pointer; }
.icon { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; }
.icon:hover { color: var(--ink); background: var(--line); }
.presets { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 12px; flex: none; }
.preset { flex: none; width: 70px; text-align: left; font-size: 10px; position: relative; }
.preset canvas { width: 70px; height: 44px; border-radius: 7px; border: 1px solid var(--faint); display: block; margin-bottom: 4px; background: #000; }
.preset:hover canvas { border-color: var(--dim); }
.preset.active { color: var(--ink); }
.preset.active canvas { border-color: var(--ink); }
.preset .x { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: rgba(0, 0, 0, .65); color: var(--ink); display: none; place-items: center; cursor: pointer; font-size: 10px; }
.preset .x.armed { background: #b8322c; }
.preset:hover .x, .preset .x.armed { display: grid; }
.preset.add .plus { width: 70px; height: 44px; border-radius: 7px; border: 1px dashed var(--faint); display: grid; place-items: center; margin-bottom: 4px; font-size: 16px; color: var(--dim); }
.preset.add:hover .plus { border-color: var(--dim); color: var(--ink); }
.saverow { display: flex; gap: 6px; padding: 0 14px 12px; flex: none; }
.saverow .num { margin: 0; text-align: left; font-family: inherit; flex: 1; }
.saverow .btn { flex: none; padding: 6px 12px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 6px 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); flex: none; }
.tab {
  border-radius: 7px; padding: 6px 0 5px; display: grid; justify-items: center; gap: 3px;
  font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); background: var(--line); }
.tabbody { flex: 1; overflow-y: auto; padding: 0 14px 12px; min-height: 0; }
.foot { display: flex; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--line); flex: none; }
.btn {
  flex: 1; background: none; border: 1px solid var(--faint); color: var(--ink); border-radius: 8px;
  padding: 7px 0; letter-spacing: .06em; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--dim); }
.btn:disabled, .icon:disabled { opacity: .32; pointer-events: none; }
.btn.active, .btn.primary { background: var(--ink); color: #000; border-color: var(--ink); }
.btn.primary:hover { background: #fff; }
.sec { border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.sh {
  width: 100%; display: flex; justify-content: space-between;
  font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; padding: 12px 0 8px;
}
.sh::after { content: "–"; }
.sec.closed .sh::after { content: "+"; }
.sec.closed .body { display: none; }
.body { padding-bottom: 8px; }
.row { padding: 4px 0; transition: opacity .15s; }
.row.off, .tog.off { opacity: .32; }
.lab { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px; min-height: 16px; }
.lab > span:first-child { cursor: default; -webkit-user-select: none; user-select: none; }
.lab-r { display: flex; align-items: center; gap: 8px; }
.val { color: var(--dim); font: 10px var(--mono); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; cursor: pointer; display: block; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--faint); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--ink); margin-top: -5px; }
input[type=range]::-moz-range-track { height: 1px; background: var(--faint); }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); }
input[type=color] { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border: 1px solid var(--faint); border-radius: 50%; background: none; padding: 0; cursor: pointer; flex: none; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
.tog { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; cursor: pointer; -webkit-user-select: none; user-select: none; transition: opacity .15s; }
.sw { width: 26px; height: 14px; border-radius: 7px; border: 1px solid var(--dim); position: relative; transition: .15s; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: .15s; }
.tog.on .sw { background: var(--ink); border-color: var(--ink); }
.tog.on .sw::after { left: 14px; background: #000; }
.seg { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.seg .btn { flex: 1 0 calc(25% - 5px); padding: 6px 0; font-size: 10px; }
.seg.c3 .btn { flex-basis: calc(33.333% - 5px); }
.seg.c2 .btn { flex-basis: calc(50% - 5px); }
.row > .btn { width: 100%; margin-top: 4px; }
select, .num {
  width: 100%; background: transparent; border: 1px solid var(--faint); border-radius: 8px; color: var(--ink);
  font: inherit; padding: 6px 8px; margin-top: 4px; outline: none;
}
select:focus, .num:focus { border-color: var(--dim); }
select option { background: #111; }
.num { font-family: var(--mono); text-align: center; -moz-appearance: textfield; }
.num::-webkit-inner-spin-button { -webkit-appearance: none; }
.dims { display: flex; align-items: center; gap: 6px; }
.dims span { color: var(--dim); }
.note { color: var(--dim); padding: 4px 0; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

#reopen {
  position: fixed; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--faint); background: var(--panel); color: var(--ink); cursor: pointer; display: none; place-items: center;
}
#reopen.on { display: grid; }

#bar {
  position: fixed; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 999px; white-space: nowrap; z-index: 2;
}
#bar .capgroup { display: none; align-items: center; gap: 6px; margin-left: 4px; padding-left: 10px; border-left: 1px solid var(--faint); }
#bar.capture .capgroup { display: flex; }
#bar.compact > :not(.capgroup) { display: none; }
#bar.compact .capgroup { margin-left: 0; padding-left: 4px; border-left: 0; }
#bar.tight .capgroup > .info { display: none; }
#bar .btn { flex: none; padding: 7px 14px; border-radius: 999px; }
#bar .btn.ghost { border-color: transparent; color: var(--dim); padding: 7px 8px; min-width: 64px; }
#bar .btn.ghost:hover { color: var(--ink); }
#bar .clock { min-width: 58px; text-align: center; }
#bar .info { font: 10.5px var(--mono); color: var(--dim); margin-right: 4px; font-variant-numeric: tabular-nums; }
#bar .info b { color: var(--ink); font-weight: 400; }
#bar .icon { width: 30px; height: 30px; border-radius: 50%; }
#bar .icon.on { color: #000; background: var(--ink); }

.modal { position: fixed; inset: 0; background: rgba(2, 3, 6, .72); display: none; place-items: center; padding: 24px; z-index: 10; }
.modal.on { display: grid; }
.card {
  background: rgba(14, 15, 21, .96); border: 1px solid var(--faint); border-radius: 16px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; max-width: min(92vw, 980px); min-width: min(320px, 92vw);
}
.card h2 { font-size: 10px; font-weight: 400; letter-spacing: .24em; text-transform: uppercase; }
.card .meta { color: var(--dim); font: 10.5px var(--mono); }
.card .row-b { display: flex; gap: 6px; justify-content: flex-end; }
.card .row-b .btn { flex: none; padding: 7px 16px; }
.bar-track { height: 2px; background: var(--faint); border-radius: 1px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--ink); transition: width .1s; }
#sheet img, #sheet video { display: block; max-width: 100%; max-height: 64vh; object-fit: contain; border-radius: 8px; background: #000; margin: 0 auto; }
#credit {
  position: fixed; left: 16px; bottom: 18px; display: grid; gap: 3px; z-index: 2;
  font-size: 10.5px; color: var(--dim); letter-spacing: .02em; pointer-events: none; transition: opacity .3s;
}
#credit.away { opacity: 0; }
#credit.away a { pointer-events: none; }
#credit a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; pointer-events: auto; width: max-content; opacity: .82; }
#credit a:hover { opacity: 1; }
#toast {
  position: fixed; left: 50%; top: 18px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
  border-radius: 999px; padding: 7px 14px; transition: .2s; z-index: 20;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#err { position: fixed; inset: 0; padding: 24px; white-space: pre-wrap; font: 11px/1.5 var(--mono); color: var(--ink); background: var(--void); display: none; z-index: 30; }

@media (max-width: 700px) {
  /* Phones: the whole sheet scrolls as one; Reset and Capture stay pinned to its bottom edge. */
  #panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; height: 48%; display: block; overflow-y: auto; overscroll-behavior: contain; }
  .tabbody { overflow: visible; }
  .foot { position: sticky; bottom: 0; background: rgba(9, 10, 15, .97); }
  #credit { top: 60px; left: 50%; bottom: auto; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; font-size: 8px; letter-spacing: .01em; white-space: nowrap; }
  #credit svg { width: 9px; height: 9px; }
  #credit .gh { display: none; }
  #bar { bottom: auto; top: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="frame"></div>
<canvas id="loupe"></canvas>
<aside id="panel"></aside>
<button id="reopen" aria-label="Show controls (H)">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M1 3.5h12M1 10.5h12"/><circle cx="4.5" cy="3.5" r="1.6" fill="#000"/><circle cx="9.5" cy="10.5" r="1.6" fill="#000"/></svg>
</button>
<div id="bar"></div>
<div id="busy" class="modal"><div class="card">
  <h2 id="busy-title">Rendering</h2>
  <div class="bar-track"><div class="bar-fill" id="busy-fill"></div></div>
  <div class="meta" id="busy-meta"></div>
  <div class="row-b"><button class="btn" id="busy-cancel">Cancel</button></div>
</div></div>
<div id="sheet" class="modal"><div class="card">
  <h2>Capture Ready</h2>
  <img id="sheet-img" alt="Rendered sky">
  <video id="sheet-video" controls loop muted playsinline hidden></video>
  <div class="meta" id="sheet-meta"></div>
  <div class="row-b"><button class="btn" id="sheet-close">Close</button><button class="btn primary" id="sheet-save">Download</button></div>
</div></div>
<footer id="credit">
  <a href="https://github.com/Natertot215/Horizon-Engine" target="_blank" rel="noopener" aria-label="Horizon Engine on GitHub">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.34.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0z"/></svg>
    <span class="gh">GitHub</span>
  </a>
  <span>Created By Nathan Taichman</span>
</footer>
<div id="toast" role="status"></div>
<pre id="err"></pre>

<script>
'use strict';

// ─── Utilities ──────────────────────────────────────────────────────────────

const DEG = Math.PI / 180;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);
const nextFrame = () => new Promise(r => { requestAnimationFrame(r); setTimeout(r, 50); });
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};

function el(tag, cls, parent, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(value));
  } catch { return null; }
}

let toastTimer = 0;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

function fail(msg) {
  const e = $('err');
  e.textContent = msg;
  e.style.display = 'block';
  throw new Error(msg);
}

// ─── Parameters ─────────────────────────────────────────────────────────────

const CLOUD_TYPES = {
  cumulus: { Cover: 0.42, Dens: 1, Alt: 1.4, Thick: 1.6, Scale: 3.2, Billow: 0.85, Cells: 0, Streak: 0, Detail: 0.7, Soft: 0.2 },
  stratocumulus: { Cover: 0.62, Dens: 0.9, Alt: 1.2, Thick: 0.8, Scale: 4, Billow: 0.5, Cells: 0.3, Streak: 0.12, Detail: 0.5, Soft: 0.3 },
  altocumulus: { Cover: 0.55, Dens: 0.8, Alt: 4, Thick: 0.3, Scale: 1.6, Billow: 0.3, Cells: 0.85, Streak: 0.2, Detail: 0.4, Soft: 0.25 },
  cirrus: { Cover: 0.45, Dens: 0.35, Alt: 9, Thick: 0.35, Scale: 6, Billow: 0, Cells: 0, Streak: 0.85, Detail: 0.3, Soft: 0.8 },
  overcast: { Cover: 0.92, Dens: 0.8, Alt: 1, Thick: 1.1, Scale: 8, Billow: 0.2, Cells: 0, Streak: 0.1, Detail: 0.35, Soft: 0.6 },
  veil: { Cover: 0.85, Dens: 0.12, Alt: 8, Thick: 0.4, Scale: 10, Billow: 0, Cells: 0, Streak: 0.4, Detail: 0.1, Soft: 1 },
};

function cloudLayer(i, type, extra = {}) {
  const out = {};
  const base = { On: true, ...CLOUD_TYPES[type], Vary: 0.6, Wind: 70 + i * 25, Speed: 12 + i * 8, Morph: 0.4, Seed: i * 3 + 1, ...extra };
  for (const [k, v] of Object.entries(base)) out[`c${i}${k}`] = v;
  return out;
}

// Planets and moons: two slots, each one of these kinds (colours and atmosphere per kind).
const BODY_TYPES = [
  ['Gas Giant', { ColorA: '#e3c7a0', ColorB: '#9c6a44', Atmo: 0.35 }],
  ['Ice Giant', { ColorA: '#aedfea', ColorB: '#5e9ec4', Atmo: 0.6 }],
  ['Rocky', { ColorA: '#c47c45', ColorB: '#6d3f25', Atmo: 0.15 }],
  ['Moon', { ColorA: '#bdbab4', ColorB: '#5f5c58', Atmo: 0 }],
  ['Ocean World', { ColorA: '#1e4f8c', ColorB: '#6a7a3c', Atmo: 0.8 }],
  ['Lava World', { ColorA: '#1d1612', ColorB: '#ff6a1f', Atmo: 0.2 }],
];

function bodySlot(i, type, extra = {}) {
  const out = {};
  const base = {
    On: false, Type: type, Size: 14, Elev: 20, Heading: 200, Phase: 0.3, Light: 30, Roll: 12, Lean: 16, Bright: 1,
    Ring: 0, RingIn: 1.35, RingOut: 2.3, RingColor: '#d9c7a6', Seed: i * 3 + 1, ...BODY_TYPES[type][1], ...extra,
  };
  for (const [k, v] of Object.entries(base)) out[`b${i}${k}`] = v;
  return out;
}

const BAND_STYLES = [
  ['Natural', { mwCoreColor: '#ffdfbc', mwArmColor: '#d5e5ff', mwWarmth: 0.55, mwDust: 0.85, mwHII: 0.4 }],
  ['Golden', { mwCoreColor: '#ffc37a', mwArmColor: '#ffe6c4', mwWarmth: 0.9, mwDust: 1, mwHII: 0.25 }],
  ['Arctic', { mwCoreColor: '#dfeaff', mwArmColor: '#8fb6ff', mwWarmth: 0.35, mwDust: 0.7, mwHII: 0.1 }],
  ['Violet', { mwCoreColor: '#ffbde9', mwArmColor: '#a493ff', mwWarmth: 0.5, mwDust: 0.8, mwHII: 0.8 }],
  ['Rose', { mwCoreColor: '#ffc9b0', mwArmColor: '#ffa6cf', mwWarmth: 0.6, mwDust: 0.9, mwHII: 1.3 }],
  ['Emerald', { mwCoreColor: '#eaffbd', mwArmColor: '#78e3c6', mwWarmth: 0.5, mwDust: 0.8, mwHII: 0.2 }],
];

const DEFAULTS = {
  sunElev: 8, sunHeading: 200, sunDisk: true, sunSize: 1, sunGlow: 0.5, sunIntensity: 1,
  rayleigh: 1, mie: 1, mieG: 0.8, ozone: 1, skyFill: 0.5, albedo: 0.12,
  nightBright: 1, nightZenith: '#0a0e2a', nightHorizon: '#2b2550', nightCurve: 0.35, nightVibrance: 0,
  lpStrength: 0.12, lpColor: '#c98a6a', lpHeading: 20, lpFocus: 0.5, lpHeight: 0.12,
  airglow: 0.06, airglowColor: '#4f8a5e',
  surface: 1, eyeHeight: 2, surfScale: 1, surfColorA: '#0a1820', surfColorB: '#1f5a4e', surfWaves: 0.35, surfReflect: 1,
  surfWind: 60, surfSparkle: 0.5, surfMotion: 1, surfRows: 65, surfFoam: 0.5,
  grassHeight: 0.45, grassDensity: 1, grassWidth: 1, grassLean: 0.5, grassDry: 0.15, flowers: 0, flowerColor: '#f4e7a1',
  relief: 1,

function hexSRGB(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}

function hexLinear(hex) {
  return hexSRGB(hex).map(c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
}

function saturate(rgb, amount) {
  const l = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  return rgb.map(c => Math.max(0, l + (c - l) * (1 + amount)));
}

function skyVector(elev, heading) {
  const e = elev * DEG, h = heading * DEG;
  return [Math.cos(e) * Math.sin(h), Math.sin(e), Math.cos(e) * Math.cos(h)];
}

function moonPhaseName(p) {
  const names = ['New', 'Waxing Crescent', 'First Quarter', 'Waxing Gibbous', 'Full', 'Waning Gibbous', 'Last Quarter', 'Waning Crescent', 'New'];
  return names[Math.round(p * 8)] + ` · ${Math.round((1 - Math.cos(p * TAU)) * 50)}%`;
}

function sunPhase(elev) {
  if (elev < -18) return 'Night';
  if (elev < -12) return 'Astronomical Twilight';
  if (elev < -6) return 'Nautical Twilight';
  if (elev < -4) return 'Blue Hour';
  if (elev < 0) return 'Civil Twilight';
  if (elev < 6) return 'Golden Hour';
  return 'Daylight';
}

function whiteBalance() {
  const t = P.temp, g = P.tint;
  const wb = [1 + 0.32 * t, 1 - 0.12 * g, 1 - 0.32 * t];
  const l = 0.2126 * wb[0] + 0.7152 * wb[1] + 0.0722 * wb[2];
  return wb.map(c => c / l);
}

  cloudSel = [0, 1, 2].find(i => P[`c${i}On`]) ?? 0;

  store('horizon-looks', looks);
  buildLookStrip();
}

  looks.splice(looks.indexOf(look), 1);
  store('horizon-looks', looks);
  buildLookStrip();
}

}

// ─── Camera & Projection ────────────────────────────────────────────────────

function cameraBasis() {
  const h = P.heading * DEG, p = P.pitch * DEG, r = P.roll * DEG;
  const f0 = [Math.sin(h), 0, Math.cos(h)], r0 = [Math.cos(h), 0, -Math.sin(h)], u0 = [0, 1, 0];
  const fwd = v3.add(v3.scale(f0, Math.cos(p)), v3.scale(u0, Math.sin(p)));
  const up1 = v3.add(v3.scale(u0, Math.cos(p)), v3.scale(f0, -Math.sin(p)));
  const right = v3.add(v3.scale(r0, Math.cos(r)), v3.scale(up1, Math.sin(r)));
  const up = v3.add(v3.scale(up1, Math.cos(r)), v3.scale(r0, -Math.sin(r)));
  return { fwd, right, up };
}

function dirAtImage(ix, iy) {
  const [W, H] = captureDims();
  if (P.proj === 3) {
    const lon = P.heading * DEG + (ix / W - 0.5) * TAU;
    const lat = clamp((0.5 - iy / H) * Math.PI, -Math.PI / 2, Math.PI / 2);
    return [Math.sin(lon) * Math.cos(lat), Math.sin(lat), Math.cos(lon) * Math.cos(lat)];
  }
  const hd = Math.hypot(W, H) / 2;
  const nx = (ix - W / 2) / hd, ny = -(iy - H / 2) / hd;
  const b = cameraBasis(), half = P.fov * DEG / 2;
  if (P.proj === 0) {
    const t = Math.tan(half);
    return v3.norm(v3.add(b.fwd, v3.add(v3.scale(b.right, nx * t), v3.scale(b.up, ny * t))));
  }
  const r = Math.hypot(nx, ny);
  const th = P.proj === 1 ? r * half : 2 * Math.atan(r * Math.tan(half / 2));
  const ux = r > 0 ? nx / r : 0, uy = r > 0 ? ny / r : 0;
  return v3.add(v3.scale(b.fwd, Math.cos(th)), v3.scale(v3.add(v3.scale(b.right, ux), v3.scale(b.up, uy)), Math.sin(th)));
}

// ─── Layout ─────────────────────────────────────────────────────────────────

const canvas = $('view');
const frameEl = $('frame');
const panel = $('panel');
const bar = $('bar');
const F = { x: 0, y: 0, w: 1, h: 1, cx: 0 };
const BAR_SPACE = 80;

function layout() {
  const vw = innerWidth, vh = innerHeight;
  const open = !panel.classList.contains('hidden');
  const narrow = vw <= 700;
  const right = open && !narrow ? 324 : 0;
  const bottom = narrow ? (open ? panel.offsetHeight + 16 : 0) : BAR_SPACE;
  const top = narrow ? 56 : 0;
  const aw = vw - right, ah = vh - bottom - top;
  const [W, H] = captureDims();
  const s = Math.min((aw - 48) / W, (ah - 48) / H);
  F.w = Math.max(8, W * s);
  F.h = Math.max(8, H * s);
  F.x = (aw - F.w) / 2;
  F.y = top + (ah - F.h) / 2;
  F.cx = F.x + F.w / 2;
  frameEl.style.cssText = `left:${F.x}px;top:${F.y}px;width:${F.w}px;height:${F.h}px`;
  placeBar();
  invalidate();
}

// Centre the bar under the frame, but keep it on screen and clear of the credit; in capture mode,
// drop the timelapse controls, then the size readout, when space runs short.
function placeBar() {
  const vw = innerWidth, narrow = vw <= 700;
  const right = (!panel.classList.contains('hidden') && !narrow ? vw - 324 : vw) - 8;
  const left = narrow || C.on ? 8 : $('credit').getBoundingClientRect().right + 12;
  bar.classList.remove('compact', 'tight');
  if (C.on && bar.offsetWidth > right - left) bar.classList.add('compact');
  if (C.on && bar.offsetWidth > right - left) bar.classList.add('tight');
  const half = bar.offsetWidth / 2;
  bar.style.left = clamp(F.cx, left + half, Math.max(left + half, right - half)) + 'px';
}

function cssToImage(x, y) {
  const [W, H] = captureDims();
  return [(x - F.x) * W / F.w, (y - F.y) * H / F.h];
}

// ─── GLSL ───────────────────────────────────────────────────────────────────

const TR_W = 256, TR_H = 64, SKY_W = 192, SKY_H = 108;
const SUN_R = 0.00465;

const GLSL_COMMON = `
const float PI = 3.14159265359;
const float TAU = 6.28318530718;
const float DEG = 0.01745329252;
const float SUN_R = ${SUN_R};
const vec2 TR_SIZE = vec2(${TR_W}.0, ${TR_H}.0);
const vec2 SKY_SIZE = vec2(${SKY_W}.0, ${SKY_H}.0);

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

float wrapAngle(float a) { return mod(a + PI, TAU) - PI; }

float gauss(float x) { return exp(-0.5 * x * x); }

vec2 rot2(vec2 p, float a) { float c = cos(a), s = sin(a); return vec2(c * p.x - s * p.y, s * p.x + c * p.y); }

float valueNoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y);
}

vec4 fetchBilinear(sampler2D t, vec2 x, vec2 size) {
  vec2 f = clamp(x, 0.0, 1.0) * (size - 1.0);
  ivec2 i = ivec2(min(floor(f), size - 2.0));
  vec2 w = f - vec2(i);
  vec4 a = texelFetch(t, i, 0), b = texelFetch(t, i + ivec2(1, 0), 0);
  vec4 c = texelFetch(t, i + ivec2(0, 1), 0), d = texelFetch(t, i + ivec2(1, 1), 0);
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}
`;

// Requires uniforms uAtmo (rayleigh, mie, ozone, mie g) and sampler uTrans.
const GLSL_ATMO = `
const float RG = 6360.0, RT = 6460.0, OBS = 6360.05;
const vec3 RAY_SCA = vec3(5.802e-3, 13.558e-3, 33.1e-3);
const float MIE_SCA = 3.996e-3, MIE_EXT = 4.4e-3;
const vec3 OZONE_ABS = vec3(0.650e-3, 1.881e-3, 0.085e-3);

// Distance from the eye out to the sphere of radius r around the Earth's centre along a ray with
// b = OBS * d.y.
float shellDist(float b, float r) { return -b + sqrt(max(b * b - (OBS * OBS - r * r), 0.0)); }

vec3 densities(float h) {
  return vec3(exp(-h / 8.0) * uAtmo.x, exp(-h / 1.2) * uAtmo.y, max(0.0, 1.0 - abs(h - 25.0) / 15.0) * uAtmo.z);
}

vec3 extinction(float h) {
  vec3 n = densities(h);
  return RAY_SCA * n.x + MIE_EXT * n.y + OZONE_ABS * n.z;
}

vec3 transmittance(float r, float mu) {
  float H = sqrt(RT * RT - RG * RG);
  float rho = sqrt(max(0.0, r * r - RG * RG));
  float muH = -rho / r;
  float m = max(mu, muH);
  float d = max(0.0, -r * m + sqrt(max(0.0, r * r * (m * m - 1.0) + RT * RT)));
  float dMin = RT - r, dMax = rho + H;
  vec2 x = vec2((d - dMin) / max(dMax - dMin, 1e-6), rho / H);
  return fetchBilinear(uTrans, x, TR_SIZE).rgb * smoothstep(muH - SUN_R, muH + SUN_R, mu);
}

float phaseRayleigh(float c) { return 0.0596831 * (1.0 + c * c); }

float phaseMie(float c, float g) {
  float g2 = g * g;
  return 0.1193662 * (1.0 - g2) * (1.0 + c * c) / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
`;

const TRANS_FS = `#version 300 es
precision highp float;
uniform vec4 uAtmo;
uniform sampler2D uTrans;
out vec4 outColor;
${GLSL_COMMON}
${GLSL_ATMO}
void main() {
  vec2 x = (gl_FragCoord.xy - 0.5) / (TR_SIZE - 1.0);
  float H = sqrt(RT * RT - RG * RG);
  float rho = H * x.y;
  float r = sqrt(rho * rho + RG * RG);
  float dMin = RT - r, dMax = rho + H;
  float d = dMin + x.x * (dMax - dMin);
  float mu = d < 1e-4 ? 1.0 : clamp((H * H - rho * rho - d * d) / (2.0 * r * d), -1.0, 1.0);
  vec3 tau = vec3(0.0);
  const int N = 80;
  float dt = d / float(N);
  for (int k = 0; k < N; k++) {
    float t = (float(k) + 0.5) * dt;
    tau += extinction(sqrt(t * t + 2.0 * r * mu * t + r * r) - RG) * dt;
  }
  outColor = vec4(exp(-tau), 1.0);
}`;

const SKYLUT_FS = `#version 300 es
precision highp float;
uniform vec4 uAtmo;
uniform sampler2D uTrans;
uniform vec3 uLight;
uniform float uFill, uAlbedo;
out vec4 outColor;
${GLSL_COMMON}
${GLSL_ATMO}
void main() {
  vec2 x = (gl_FragCoord.xy - 0.5) / (SKY_SIZE - 1.0);
  float az = x.x * x.x * PI;
  float s = x.y * 2.0 - 1.0;
  float el = sign(s) * s * s * 0.5 * PI;
  vec3 d = vec3(cos(el) * sin(az), sin(el), cos(el) * cos(az));
  vec3 p0 = vec3(0.0, OBS, 0.0);
  float mu = d.y;
  float discG = OBS * OBS * (mu * mu - 1.0) + RG * RG;
  bool ground = mu < 0.0 && discG >= 0.0;
  float tMax = ground ? -OBS * mu - sqrt(discG) : -OBS * mu + sqrt(OBS * OBS * (mu * mu - 1.0) + RT * RT);
  float c = dot(d, uLight);
  float pr = phaseRayleigh(c), pm = phaseMie(c, uAtmo.w);
  vec3 L = vec3(0.0), T = vec3(1.0);
  const int N = 48;
  float tPrev = 0.0;
  for (int k = 0; k < N; k++) {
    float f = (float(k) + 1.0) / float(N);
    float t1 = tMax * f * f;
    float dt = t1 - tPrev;
    vec3 p = p0 + d * (tPrev + 0.5 * dt);
    tPrev = t1;
    float r = length(p);
    vec3 n = densities(r - RG);
    vec3 sR = RAY_SCA * n.x;
    float sM = MIE_SCA * n.y;
    vec3 ext = sR + MIE_EXT * n.y + OZONE_ABS * n.z;
    float muS = dot(p, uLight) / r;
    float muH = -sqrt(max(0.0, 1.0 - RG * RG / (r * r)));
    vec3 Ts = transmittance(r, muS);
    vec3 Tms = transmittance(r, max(muS, 0.25)) * exp(-max(0.0, muH - muS) * 60.0);
    vec3 S = (sR * pr + sM * pm) * Ts + (sR + sM) * (uFill * 0.08) * Tms;
    vec3 stepT = exp(-ext * dt);
    L += T * S * (1.0 - stepT) / max(ext, vec3(1e-9));
    T *= stepT;
  }
  if (ground) {
    vec3 pg = normalize(p0 + d * tMax);
    float muG = dot(pg, uLight);
    L += T * (uAlbedo / PI) * transmittance(RG, muG) * max(muG, 0.0);
  }
  outColor = vec4(L, 1.0);
}`;

const GLSL_NOISE = `
uint pcg(uint v) {
  uint s = v * 747796405u + 2891336453u;
  uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}

uint hash3u(uvec3 v) { return pcg(v.x ^ pcg(v.y ^ pcg(v.z))); }

float rnd(inout uint h) {
  h = pcg(h);
  return float(h) * (1.0 / 4294967296.0);
}
`;

const NOISE_N = 128;

const NOISE3_FS = `#version 300 es
precision highp float;
precision highp int;
uniform float uSlice;
out vec4 outColor;
${GLSL_NOISE}

vec3 rand3(vec3 c, uint salt) {
  uvec3 q = uvec3(ivec3(c));
  uint h = hash3u(q ^ uvec3(salt));
  float a = rnd(h), b = rnd(h), d = rnd(h);
  return vec3(a, b, d);
}

#define GRAD(o) dot(normalize(rand3(mod(i + o, period), salt) * 2.0 - 0.999), f - o)

float perlin(vec3 x, float period, uint salt) {
  vec3 i = floor(x), f = fract(x);
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = GRAD(vec3(0, 0, 0)), b = GRAD(vec3(1, 0, 0)), c = GRAD(vec3(0, 1, 0)), d = GRAD(vec3(1, 1, 0));
  float e = GRAD(vec3(0, 0, 1)), g = GRAD(vec3(1, 0, 1)), h = GRAD(vec3(0, 1, 1)), k = GRAD(vec3(1, 1, 1));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, g, u.x), mix(h, k, u.x), u.y), u.z);
}

float worley(vec3 x, float period, uint salt) {
  vec3 i = floor(x), f = fract(x);
  float d = 8.0;
  for (int z = -1; z <= 1; z++)
    for (int y = -1; y <= 1; y++)
      for (int xx = -1; xx <= 1; xx++) {
        vec3 o = vec3(float(xx), float(y), float(z));
        vec3 v = f - o - rand3(mod(i + o, period), salt);
        d = min(d, dot(v, v));
      }
  return sqrt(d);
}

float fbm(vec3 p, float base, int octaves, uint salt) {
  float v = 0.0, amp = 1.0, tot = 0.0;
  for (int o = 0; o < 6; o++) {
    if (o >= octaves) break;
    float fr = base * exp2(float(o));
    v += amp * perlin(p * fr, fr, salt + uint(o));
    tot += amp;
    amp *= 0.5;
  }
  return clamp(0.5 + 1.4 * v / tot, 0.0, 1.0);
}

float cells(vec3 p, float base, uint salt) {
  float w1 = worley(p * base, base, salt), w2 = worley(p * base * 2.0, base * 2.0, salt + 1u);
  float w3 = worley(p * base * 4.0, base * 4.0, salt + 2u);
  return clamp(1.0 - (w1 * 0.625 + w2 * 0.25 + w3 * 0.125) * 1.15, 0.0, 1.0);
}

void main() {
  vec3 p = vec3(gl_FragCoord.xy / ${NOISE_N}.0, uSlice);
  outColor = vec4(fbm(p, 4.0, 6, 11u), cells(p, 4.0, 23u), cells(p, 8.0, 37u), fbm(p, 8.0, 5, 41u));
}`;

const GLSL_NIGHT = `
vec4 nz(vec3 q, float rate) { return textureLod(uNoise3, q, log2(max(rate * ${NOISE_N}.0, 1.0))); }

vec3 blackbody(float t) {
  t *= 0.01;
  float r = t <= 66.0 ? 1.0 : clamp(1.292936 * pow(t - 60.0, -0.1332047), 0.0, 1.0);
  float g = t <= 66.0 ? clamp(0.3900816 * log(t) - 0.6318414, 0.0, 1.0) : clamp(1.1298909 * pow(t - 60.0, -0.0755148), 0.0, 1.0);
  float b = t >= 66.0 ? 1.0 : t <= 19.0 ? 0.0 : clamp(0.5432068 * log(t - 10.0) - 1.1962541, 0.0, 1.0);
  return pow(vec3(r, g, b), vec3(2.2));
}

vec3 starColor(inout uint h) {
  float r = rnd(h), s = rnd(h);
  float t = r < 0.08 ? mix(2900.0, 4200.0, s) : r < 0.42 ? mix(4800.0, 6600.0, s) : r < 0.8 ? mix(6600.0, 10000.0, s) : mix(10000.0, 26000.0, s);
  vec3 c = blackbody(t * exp2(-uStarLook.y * 0.8)) / blackbody(5800.0);
  c = mix(vec3(1.0), c / max(luma(c), 1e-4), uStarLook.x);
  return mix(c, uStarTint.rgb / max(luma(uStarTint.rgb), 1e-4), uStarTint.a);
}

vec3 faceDir(int face, vec2 uv) {
  if (face == 0) return vec3(1.0, uv);
  if (face == 1) return vec3(-1.0, uv);
  if (face == 2) return vec3(uv.x, 1.0, uv.y);
  if (face == 3) return vec3(uv.x, -1.0, uv.y);
  if (face == 4) return vec3(uv, 1.0);
  return vec3(uv, -1.0);
}

float twinkleAmt = 0.0;
bool gMirror = false; // tracing a reflection: sun and moon disks come from glint() instead
bool gNoLand = false; // reflection ray that would really meet another wave
float gShade = 1.0;   // tree shadow on the patch of ground being shaded

float starSigma(float fpOut) { return uStars.w * 4e-4 * length(uImg) * fpOut; }

const float STAR_CELLS[7] = float[7](8.0, 20.0, 48.0, 110.0, 250.0, 560.0, 1250.0);

vec3 stars(vec3 p, float fp, float fpOut, float boost, vec3 rightC, vec3 upC) {
  vec3 a = abs(p);
  int face;
  vec2 uv;
  if (a.x >= a.y && a.x >= a.z) { face = p.x > 0.0 ? 0 : 1; uv = p.yz / a.x; }
  else if (a.y >= a.z) { face = p.y > 0.0 ? 2 : 3; uv = p.xz / a.y; }
  else { face = p.z > 0.0 ? 4 : 5; uv = p.xy / a.z; }
  vec2 w = atan(uv) * (2.0 / PI) + 0.5;
  float sigma0 = starSigma(fpOut);
  float pix2 = 0.16 * fp * fp;
  mat2 spin = mat2(cos(uSpikes.y), sin(uSpikes.y), -sin(uSpikes.y), cos(uSpikes.y));
  vec3 sum = vec3(0.0);
  for (int L = 0; L < 7; L++) {
    float layerW = clamp(uStars.y * 7.0 - float(L), 0.0, 1.0);
    if (layerW <= 0.0) break;
    float N = STAR_CELLS[L];
    float cellAng = 0.5 * PI / N;
    float flux0 = uStars.z * 2.4 * pow(0.42, float(L));
    float gain = 1.0 + uMWLook.y * boost * 0.4;
    float pEff = clamp(uStars.x * (1.0 + uMWLook.y * boost * float(L) * 0.6), 0.0, 1.0);
    float sigL = sigma0 * (1.0 - 0.1 * float(L));
    float lod = smoothstep(0.1, 0.22, sqrt(sigL * sigL + pix2) / cellAng);
    vec3 layer = vec3(0.0);
    if (lod < 1.0) {
      bool bright = L < 2;
      int span = bright ? 3 : 2;
      vec2 g = w * N;
      vec2 base = bright ? floor(g) - 1.0 : floor(g - 0.5);
      for (int j = 0; j < 3; j++) {
        if (j >= span) break;
        for (int i = 0; i < 3; i++) {
          if (i >= span) break;
          vec2 cell = base + vec2(float(i), float(j));
          if (cell.x < 0.0 || cell.y < 0.0 || cell.x >= N || cell.y >= N) continue;
          uint h = hash3u(uvec3(uvec2(cell), uint(face * 8 + L)) ^ uvec3(uSeed));
          float e = rnd(h);
          if (e > pEff + 0.02) continue;
          float exist = clamp((pEff - e) * 25.0 + 0.5, 0.0, 1.0);
          vec2 sw = (cell + 0.15 + 0.7 * vec2(rnd(h), rnd(h))) / N * 2.0 - 1.0;
          vec3 dv = p - normalize(faceDir(face, tan(sw * (0.25 * PI))));
          float r2 = dot(dv, dv);
          float u = pow(rnd(h), 3.0);
          float f = flux0 * (0.2 + 0.8 * u) * gain;
          // Size Variation: brighter stars spread wider, fainter ones shrink toward a point.
          float sig = sigL * (0.8 + 0.3 * u) * mix(1.0, clamp(pow(f / (uStars.z * 0.4 + 1e-4), 0.4), 0.45, 3.0), uSpikes.w);
          float se2 = sig * sig + pix2;
          if (!bright && r2 > 30.0 * se2) continue;
          vec3 col = starColor(h) * f * exist;
          col *= 1.0 + twinkleAmt * sin(uTime.y * (5.0 + 7.0 * rnd(h)) + rnd(h) * TAU);
          vec3 c = col * exp(-0.5 * r2 / se2) * (sig * sig / se2);
          if (bright) {
            c += col * uStarLook.z * 0.05 * exp(-sqrt(r2) / (sigma0 * 7.0 + fp));
            if (uSpikes.x > 0.0) {
              vec2 o = spin * vec2(dot(dv, rightC), dot(dv, upC));
              float len = sigma0 * 30.0 * uSpikes.z * sqrt(f);
              float wd = sqrt(se2) * 0.5;
              float sp = exp(-abs(o.y) / wd - abs(o.x) / len) + exp(-abs(o.x) / wd - abs(o.y) / len);
              c += col * uSpikes.x * 0.35 * sp * sig / sqrt(se2);
            }
          }
          layer += c;
        }
      }
    }
    if (lod > 0.0) {
      float avg = pEff * flux0 * gain * 0.4 * TAU * sigL * sigL / (cellAng * cellAng);
      layer = mix(layer, vec3(1.0, 0.96, 0.92) * avg, lod);
    }
    sum += layer * layerW;
  }
  return sum;
}

vec3 starTrails(vec3 p, float fp, float fpOut) {
  float rho = acos(clamp(p.z, -1.0, 1.0));
  float psi = atan(p.y, p.x);
  const float DR = 0.35 * DEG;
  float k0 = floor(rho / DR);
  float sigma0 = starSigma(fpOut);
  float pix2 = 0.16 * fp * fp;
  float L = uTrails.x;
  vec3 sum = vec3(0.0);
  for (int dk = -1; dk <= 1; dk++) {
    float k = k0 + float(dk);
    if (k < 0.0) continue;
    uint hk = hash3u(uvec3(uint(k), 91u, uSeed));
    float count = min(64.0, floor(uTrails.y * 700.0 * TAU * sin((k + 0.5) * DR) * DR + rnd(hk)));
    for (int j = 0; j < 64; j++) {
      if (float(j) >= count) break;
      uint h = hash3u(uvec3(uint(k), uint(j), uSeed ^ 0x5bd1e995u));
      float r = (k + 0.1 + 0.8 * rnd(h)) * DR;
      float f = uTrails.z * (0.06 + 1.4 * pow(rnd(h), 6.0));
      float sig = sigma0 * (0.75 + 0.3 * sqrt(f));
      float se2 = sig * sig + pix2;
      float dr = rho - r;
      if (dr * dr > 25.0 * se2) continue;
      float a = mod(psi - rnd(h) * TAU, TAU);
      if (a > PI + 0.5 * L) a -= TAU;
      float arc = sin(max(r, 1e-4)), se = sqrt(se2);
      float span = smoothstep(-se, se, a * arc) * smoothstep(-se, se, (L - a) * arc);
      if (span <= 0.0) continue;
      float fade = 0.55 + 0.45 * clamp(a / L, 0.0, 1.0);
      sum += starColor(h) * f * exp(-0.5 * dr * dr / se2) * (sig / se) * span * fade;
    }
  }
  return sum;
}

const vec3 GNP = vec3(-0.8677, -0.1981, 0.4560);
const vec3 GC = vec3(-0.0549, -0.8734, -0.4838);

vec3 milkyWay(vec3 p, float fp, out float boost, out float clear) {
  // Galactic frame; Band Tilt turns the plane about the direction of the core.
  vec3 gnp = normalize(GNP * cos(uMWB.x) + cross(GC, GNP) * sin(uMWB.x));
  vec3 gy = cross(gnp, GC);
  float b = asin(clamp(dot(p, gnp), -1.0, 1.0));
  float l = atan(dot(p, gy), dot(p, GC));
  float w = uMW.y;
  boost = 0.0;
  clear = 1.0;
  if (abs(b) > w * 5.0 + 0.35) return vec3(0.0);
  vec3 o = vec3(0.37, 0.11, 0.73) + uMWLook.z * vec3(0.193, 0.317, 0.071);
  // Star clouds: billowy brightness at several scales, plus a fine grain of unresolved stars.
  vec3 g = vec3(dot(p, GC), dot(p, gy), dot(p, gnp) * 2.4);
  float n1 = nz(g * 1.3 + o, 1.3 * fp).r;
  float n2 = nz(g * 4.1 + o.yzx, 4.1 * fp).r;
  float n3 = nz(g * 13.0 + o.zxy, 13.0 * fp).r;
  float n4 = nz(g * 41.0 + o, 41.0 * fp).r;
  float bw = b + (n1 - 0.5) * w * 0.8 + (n2 - 0.5) * w * 0.25;
  float band = exp(-0.5 * bw * bw / (w * w));
  float halo = exp(-0.5 * b * b / (9.0 * w * w)) * 0.12;
  float toward = pow(0.5 + 0.5 * cos(l), 1.6);
  float bulge = exp(-0.5 * (l * l / 0.13 + b * b / (2.6 * w * w)));
  float clouds = smoothstep(0.3, 0.76, n1 * 0.45 + n2 * 0.3 + n3 * 0.17 + n4 * 0.08);
  float lum = band * (0.25 + 0.75 * toward) * (0.3 + 1.4 * clouds) + halo + uMW.z * bulge * (0.7 + 0.6 * clouds);
  lum *= 0.72 + 0.56 * n4;
  // Dust: ridged filaments stretched along the plane, and the Great Rift running from the core
  // toward Cygnus a little off the midplane.
  vec3 gd = vec3(dot(p, GC), dot(p, gy), dot(p, gnp) * 2.2);
  float f1 = nz(gd * 2.4 + o.zxy, 2.4 * fp).a;
  float f2 = 1.0 - abs(nz(gd * 7.0 + o.yzx, 7.0 * fp).a * 2.0 - 1.0);
  float f3 = nz(gd * 21.0 + o, 21.0 * fp).a;
  float dustN = f1 * 0.55 + f2 * 0.3 + f3 * 0.15;
  float rb = b - w * (0.15 + 0.22 * (n1 - 0.5) + 0.12 * sin(l * 1.7 + o.x * 6.0));
  float rift = exp(-0.5 * rb * rb / (0.12 * w * w)) * smoothstep(-0.35, 0.15, l) * smoothstep(2.1, 0.9, l);
  float zone = exp(-0.5 * b * b / (0.5 * w * w)) * (0.55 + 0.45 * smoothstep(0.35, 0.65, n1));
  float dust = clamp((smoothstep(0.48, 0.78, dustN) * zone * 0.85 + rift * smoothstep(0.3, 0.62, dustN) * 0.8) * uMW.w, 0.0, 0.95);
  lum *= 1.0 - dust;
  clear = 1.0 - dust * 0.8;
  boost = (band * (0.4 + 0.6 * clouds) + bulge) * (1.0 - dust);
  float warm = clamp((bulge * 1.4 + toward * 0.3) * uMWLook.x * 1.3, 0.0, 1.0);
  vec3 col = mix(uMWArm, uMWCore, warm);
  col = mix(col, col * vec3(1.0, 0.6, 0.4), clamp(dust * 1.8, 0.0, 1.0) * 0.6);
  // Pink HII regions sprinkled along the plane, thickest toward the core.
  float hii = smoothstep(0.8, 0.95, nz(g * 9.0 + o.yzx + 5.3, 9.0 * fp).g) * band * (0.35 + toward) * (1.0 - dust) * uMWB.y;
  return (col * lum + vec3(1.0, 0.3, 0.42) * hii * 0.7) * uMW.x * 0.1;
}

// Emission nebula: large soft clouds with a gentle warp, faint filaments, hot cores that whiten,
// and dark dust lanes across them. Alpha returns how much the dust hides the stars behind.
vec4 nebula(vec3 p, float fp) {
  float S = uNeb.y * 0.5;
  vec3 q = p * S + uNeb.w * vec3(0.173, 0.311, 0.097);
  float r = S * fp;
  vec3 wq = vec3(nz(q * 0.9, 0.9 * r).a, nz(q * 0.9 + 0.41, 0.9 * r).a, nz(q * 0.9 + 0.83, 0.9 * r).a) - 0.5;
  q += wq * uNeb.z * 0.9;
  float dens = nz(q, r).r * 0.72 + nz(q * 3.1 + 1.3, 3.1 * r).r * 0.28;
  float glow = smoothstep(0.4, 0.88, dens);
  if (glow <= 0.0) return vec4(0.0);
  float fil = pow(1.0 - abs(nz(q * 2.4 + 1.7, 2.4 * r).a * 2.0 - 1.0), 8.0);
  float dust = smoothstep(0.52, 0.76, nz(q * 1.5 + 3.9, 1.5 * r).a + (nz(q * 4.4 + 0.6, 4.4 * r).a - 0.5) * 0.25);
  vec3 col = mix(uNebA, uNebB, smoothstep(0.32, 0.68, nz(q * 0.6 + 2.3, 0.6 * r).a));
  vec3 c = col * (pow(glow, 1.6) * 0.85 + fil * glow * 0.5) + mix(col, vec3(1.0), 0.6) * pow(smoothstep(0.62, 0.95, dens), 2.0) * 0.6;
  float veil = dust * smoothstep(0.05, 0.45, glow) * 0.85;
  return vec4(c * (1.0 - veil) * uNeb.x * 0.25, veil * min(uNeb.x, 1.0));
}

// Extinction toward elevation sine mu relative to the zenith, by the Extinction setting: it dims
// stars, planets and the moon (and the moon's glitter on water) low in the sky.
vec3 skyExtinction(float mu) { return mix(vec3(1.0), transmittance(OBS, max(mu, 0.0)) / transmittance(OBS, 1.0), uStarLook.w); }

vec4 moonDisk(vec3 d, float fp) {
  vec3 dv = d - uMoonDir;
  float ang = 2.0 * asin(clamp(length(dv) * 0.5, 0.0, 1.0));
  float r = uMoon.y;
  float illum = 0.5 + 0.5 * uMoonLight.z;
  vec3 glow = vec3(0.85, 0.9, 1.0) * uMoon.w * illum * (0.35 * exp(-ang / (r * 2.5)) + 0.08 * exp(-ang / 0.06) + 0.02 * exp(-ang / 0.3));
  float hr = (ang - 22.0 * DEG) / (0.9 * DEG);
  glow += uMoonHalo * illum * 0.05 * exp(-hr * hr) * mix(vec3(1.0, 0.55, 0.35), vec3(0.75, 0.85, 1.0), smoothstep(-1.0, 1.5, hr));
  glow *= uMoon.z;
  float cover = clamp((r - ang) / max(fp, 1e-7) + 0.5, 0.0, 1.0);
  if (cover <= 0.0 || gMirror) return vec4(glow, 0.0);
  vec3 mr = normalize(cross(vec3(0.0, 1.0, 0.0), uMoonDir));
  vec3 mu = cross(uMoonDir, mr);
  vec2 xy = vec2(dot(dv, mr), dot(dv, mu)) / r;
  float z = sqrt(max(0.0, 1.0 - dot(xy, xy)));
  vec3 n = vec3(xy, z);
  float mu0 = max(dot(n, uMoonLight.xyz), 0.0);
  float shade = 2.0 * mu0 / (mu0 + max(z, 0.05));
  float maria = smoothstep(0.5, 0.66, textureLod(uNoise3, n * 0.42 + vec3(0.31, 0.57, 0.13), 0.0).r);
  float crater = textureLod(uNoise3, n * 1.5 + 0.2, 0.0).g;
  float albedo = 0.95 - 0.38 * maria - 0.14 * (crater - 0.5);
  vec3 col = vec3(1.0, 0.98, 0.94) * albedo * (shade + uMoonLight.w * 0.02);
  return vec4(col * uMoon.z * cover + glow, cover);
}

// ── Planets, moons and a deep-sky galaxy ──

const int MAX_BODIES = 2;

// Where d lies on the sky around the direction c (cosA = dot(d, c)): azimuthal equidistant
// coordinates in units of the angular radius R, x to the right and y up.
vec2 skyPlane(vec3 d, vec3 c, float cosA, float R) {
  vec3 right = abs(c.y) > 0.999 ? vec3(1.0, 0.0, 0.0) : normalize(cross(vec3(0.0, 1.0, 0.0), c)), up = cross(c, right);
  vec3 tv = d - c * cosA;
  float tl = length(tv), ang = acos(clamp(cosA, -1.0, 1.0));
  return tl > 1e-8 ? vec2(dot(tv, right), dot(tv, up)) / tl * (ang / R) : vec2(0.0);
}

// Ring opacity across the ring (u: 0 inner edge, 1 outer edge); fu is the footprint in u.
float ringDensity(float u, float seed, float fu) {
  float d = smoothstep(0.0, 0.03, u) * smoothstep(1.0, 0.95, u);
  float fine = mix(0.5 + 0.5 * sin(u * 260.0 + seed * 3.0), 0.5, smoothstep(0.002, 0.008, fu));
  float mid = mix(0.5 + 0.5 * sin(u * 47.0 + seed * 1.3), 0.5, smoothstep(0.015, 0.05, fu));
  float gu = (u - 0.64) / 0.022;
  float gap = 1.0 - 0.94 * exp(-gu * gu) * (1.0 - smoothstep(0.02, 0.06, fu));
  return d * gap * mix(0.3, 1.0, smoothstep(0.05, 0.4, u)) * (0.5 + 0.3 * mid + 0.2 * fine);
}

// Albedo (rgb) of a body's surface at unit normal n, plus emission for lava worlds.
vec3 bodySurface(int type, vec3 n, vec3 ax, float seed, vec3 c1, vec3 c2, float fr, out vec3 emit) {
  vec3 e1 = normalize(cross(ax, vec3(0.0, 0.0, 1.0)) + vec3(1e-4, 0.0, 0.0)), e2 = cross(ax, e1);
  float lat = asin(clamp(dot(n, ax), -1.0, 1.0));
  float lon = atan(dot(n, e2), dot(n, e1)) + uTime.y * 0.01;
  vec3 sp = vec3(cos(lat) * cos(lon), sin(lat), cos(lat) * sin(lon));
  vec3 o = seed * vec3(0.173, 0.311, 0.097);
  emit = vec3(0.0);
  if (type == 0 || type == 1) {
    // Banded giant: turbulent zones and belts, with an oval storm on gas giants.
    float turb = nz(sp * 1.1 + o, fr * 1.1).a - 0.5;
    float fine = nz(sp * vec3(1.6, 9.0, 1.6) + o.yzx, fr * 6.0).r - 0.5;
    float t = lat * (type == 0 ? 8.0 : 5.0) + turb * 0.6 + fine * 0.4;
    float bands = 0.5 + 0.32 * sin(t * PI + seed) + 0.18 * sin(t * 2.3 * PI + seed * 2.0);
    vec3 alb = mix(c1, c2, smoothstep(0.15, 0.85, bands) * (type == 0 ? 1.0 : 0.35));
    if (type == 0) {
      alb = mix(alb, vec3(0.95, 0.9, 0.82), 0.25 * smoothstep(0.75, 0.95, bands));
      vec2 sd = vec2(wrapAngle(lon - seed * 1.9) * cos(lat), (lat + 0.38) * 2.4);
      float storm = smoothstep(0.2, 0.11, length(sd) + turb * 0.05);
      alb = mix(alb, c2 * vec3(1.25, 0.75, 0.6), storm * 0.75);
    }
    return alb;
  }
  vec4 n1 = nz(sp * 1.4 + o, fr * 1.4), n2 = nz(sp * 4.5 + o.zxy, fr * 4.5);
  float relief = n1.r * 0.65 + n2.r * 0.35;
  if (type == 2) {
    vec3 alb = mix(c2, c1, smoothstep(0.35, 0.65, relief)) * (0.85 + 0.3 * n2.g);
    return mix(alb, vec3(0.9, 0.9, 0.92), smoothstep(1.2, 1.35, abs(lat) + (n2.r - 0.5) * 0.2));
  }
  if (type == 3) {
    float maria = smoothstep(0.52, 0.62, n1.r);
    float craters = smoothstep(0.55, 0.85, nz(sp * 6.0 + o.yzx, fr * 6.0).g);
    return mix(c1, c2, maria * 0.85) * (0.9 + 0.25 * craters - 0.1 * n2.r);
  }
  if (type == 4) {
    // Ocean world: a few continents, ice caps and bands of swirling cloud.
    float cont = nz(sp * 0.5 + o, fr * 0.5).r * 0.8 + n2.r * 0.2;
    float land = smoothstep(0.52, 0.535, cont);
    vec3 ground = mix(c2, c2 * vec3(1.4, 1.1, 0.7), smoothstep(0.56, 0.66, cont));
    vec3 alb = mix(c1 * (0.85 + 0.3 * smoothstep(0.52, 0.45, cont)), ground, land);
    alb = mix(alb, vec3(0.92), smoothstep(1.15, 1.3, abs(lat) + (n2.r - 0.5) * 0.25));
    vec3 cw = sp + (vec3(nz(sp * 0.7 + 5.1, fr * 0.7).r, nz(sp * 0.7 + 7.3, fr * 0.7).r, nz(sp * 0.7 + 2.9, fr * 0.7).r) - 0.5) * 0.9;
    float cloud = smoothstep(0.52, 0.72, nz(cw * vec3(1.4, 2.6, 1.4) + o.yzx, fr * 2.0).r);
    return mix(alb, vec3(0.95), cloud * 0.85);
  }
  // Lava world: dark crust broken by glowing fissures.
  float crack = pow(1.0 - abs(nz(sp * 3.5 + o, fr * 3.5).a * 2.0 - 1.0), 12.0) * (1.0 - smoothstep(0.02, 0.08, fr * 3.5));
  emit = c2 * (crack * 3.0 + smoothstep(0.62, 0.8, relief) * 0.15);
  return c1 * (0.7 + 0.6 * n2.r);
}

// Planets and moons over the sky: premultiplied colour and coverage (which hides what is behind).
vec4 bodies(vec3 d, float fp) {
  vec3 acc = vec3(0.0);
  float T = 1.0;
  for (int i = 0; i < MAX_BODIES; i++) {
    if (i >= uBodyN) break;
    vec4 A = uBodyA[i], B = uBodyB[i], C = uBodyC[i], Dd = uBodyD[i];
    vec3 c = A.xyz;
    float R = A.w, cosA = dot(d, c), reach = R * max(Dd.w, 1.0) * 1.12;
    if (cosA < cos(min(reach, 3.0))) continue;
    vec2 xy = skyPlane(d, c, cosA, R);
    float r = length(xy), fr = fp / R;
    int type = int(B.x);
    vec3 ax = vec3(sin(Dd.x) * cos(Dd.y), cos(Dd.x) * cos(Dd.y), sin(Dd.y)), L = C.xyz;
    vec3 c1 = uBodyCol1[i], c2 = uBodyCol2[i];
    vec3 atmo = mix(c1, vec3(0.55, 0.75, 1.0), type == 4 ? 0.8 : 0.3) * B.w;
    // Disk.
    float pa = clamp((1.0 - r) / fr + 0.5, 0.0, 1.0), z = sqrt(max(1.0 - r * r, 0.0));
    vec3 pc = vec3(0.0);
    if (pa > 0.0) {
      vec3 n = vec3(xy, z), emit;
      vec3 alb = bodySurface(type, n, ax, C.w, c1, c2, fr, emit);
      float mu0 = dot(n, L);
      float lit = type == 3 || type == 2 ? 2.0 * max(mu0, 0.0) / (max(mu0, 0.0) + max(z, 0.05)) : smoothstep(-0.08, 0.35, mu0) * max(mu0 + 0.08, 0.0) / 1.08;
      if (B.z > 0.0 && abs(dot(L, ax)) > 1e-3) {
        // Shadow of the rings across the disk.
        float s = -dot(n, ax) / dot(L, ax);
        if (s > 0.0) {
          float rho = length(n + L * s);
          float u = (rho - Dd.z) / max(Dd.w - Dd.z, 1e-3);
          if (u > 0.0 && u < 1.0) lit *= 1.0 - 0.85 * B.z * ringDensity(u, C.w, fr);
        }
      }
      vec3 rim = atmo * pow(1.0 - z, 3.0) * smoothstep(-0.2, 0.4, mu0);
      pc = (alb * (lit + 0.012) + rim + emit) * B.y * pa;
    }
    // Atmosphere halo just outside the limb, on the lit side.
    vec3 halo = vec3(0.0);
    if (B.w > 0.0 && r > 0.9) {
      vec2 rd = xy / max(r, 1e-4);
      float side = smoothstep(-0.3, 0.6, dot(rd, L.xy) + L.z * 0.3);
      halo = atmo * 0.6 * exp(-max(r - 1.0, 0.0) / 0.035) * side * B.y;
    }
    // Rings: where the view ray crosses the ring plane, in front of or behind the disk.
    vec3 rc = vec3(0.0);
    float ra = 0.0, zr = -1e9;
    if (B.z > 0.0 && abs(ax.z) > 1e-3) {
      zr = -(ax.x * xy.x + ax.y * xy.y) / ax.z;
      vec3 q = vec3(xy, zr);
      float rho = length(q), u = (rho - Dd.z) / max(Dd.w - Dd.z, 1e-3);
      if (u > 0.0 && u < 1.0) {
        float fu = fr / max(Dd.w - Dd.z, 1e-3) / max(abs(ax.z), 0.05);
        ra = B.z * ringDensity(u, C.w, fu);
        // The planet's shadow falls across the rings.
        float bq = dot(q, L), cq = dot(q, q) - 1.0, disc = bq * bq - cq;
        float shade = disc > 0.0 && -bq - sqrt(disc) > 0.0 ? 0.08 : 1.0;
        float lightUp = 0.3 + 0.7 * abs(dot(L, ax));
        rc = uBodyRing[i] * (0.65 + 0.35 * sin(u * 19.0 + C.w)) * lightUp * shade * B.y;
      }
    }
    // Composite front to back: rings in front of the disk, the disk, rings behind, halo.
    vec3 col;
    float a;
    if (ra > 0.0 && (pa <= 0.0 || zr > z)) {
      col = rc * ra + (1.0 - ra) * (pc + (1.0 - pa) * halo);
      a = 1.0 - (1.0 - ra) * (1.0 - pa);
    } else {
      col = pc + (1.0 - pa) * (rc * ra + halo);
      a = 1.0 - (1.0 - pa) * (1.0 - ra);
    }
    acc += T * col;
    T *= 1.0 - a;
  }
  return vec4(acc, 1.0 - T);
}

// A spiral galaxy hanging in the night sky: bulge, logarithmic arms with knots of young stars,
// dust lanes along the arms' inner edges, seen at any inclination.
vec3 galaxy(vec3 d, float fp) {
  vec3 c = uGalDir;
  float R = uGal.y, cosA = dot(d, c);
  if (cosA < cos(min(R * 1.6, 3.0))) return vec3(0.0);
  vec2 xy = rot2(skyPlane(d, c, cosA, R), uGal.w);
  float ci = max(cos(uGal.z), 0.06);
  vec2 g = vec2(xy.x, xy.y / ci);
  float r = length(g), th = atan(g.y, g.x), fr = fp / R / ci;
  float arms = uGalB.x, twist = uGalB.y;
  vec3 o = vec3(uGalB.z * 0.37, uGalB.z * 0.11, 0.53);
  float w = (nz(vec3(g * 1.5, 0.0) + o, fr * 1.5).a - 0.5) * 1.2;
  float spiral = arms * (th - twist * log(max(r, 0.02))) + w;
  float arm = pow(0.5 + 0.5 * cos(spiral), 2.2);
  float lane = pow(0.5 + 0.5 * cos(spiral + 0.9), 8.0) * smoothstep(0.06, 0.25, r);
  float disk = exp(-r * 2.3) * smoothstep(1.4, 0.8, r);
  float bulge = exp(-r * r / 0.01) * 1.6 + exp(-r / 0.09) * 0.45;
  float knots = smoothstep(0.62, 0.9, nz(vec3(g * 7.0, 0.31) + o, fr * 7.0).g) * arm;
  // Edge-on galaxies show a dark band through the middle of the disk.
  float band = gauss(xy.y / (0.03 * (1.0 - ci) + 0.01)) * smoothstep(0.35, 0.95, 1.0 - ci) * smoothstep(1.2, 0.3, r);
  vec3 col = uGalCore * bulge + uGalArm * disk * (0.3 + 1.1 * arm) * (1.0 - 0.75 * lane) + vec3(1.0, 0.45, 0.6) * knots * disk * 2.2;
  col *= 1.0 - 0.8 * band;
  return col * uGal.x * 0.2;
}

vec3 meteors(vec3 d, float fp, float fpOut) {
  vec3 sum = vec3(0.0);
  float sigma0 = starSigma(fpOut) * 0.8;
  float se = sqrt(sigma0 * sigma0 + 0.16 * fp * fp);
  for (int i = 0; i < 12; i++) {
    if (i >= uMeteorN) break;
    vec3 A = uMeteorA[i].xyz, T = uMeteorB[i].xyz;
    float len = uMeteorA[i].w;
    float perp = dot(d, cross(A, T));
    float t = atan(dot(d, T), dot(d, A));
    if (abs(perp) > 8.0 * se || t < -0.05 || t > len + 0.05) continue;
    float prog = uMeteorP[i];
    if (prog > 1.0) continue;
    float x = clamp(t / len, 0.0, 1.0);
    float profile = pow(x, 1.5) * smoothstep(1.0, 0.9, x);
    float head = len;
    if (prog >= 0.0) {
      head = len * min(prog * 1.4, 1.0);
      profile = smoothstep(head / len - 0.4, head / len, x) * (1.0 - smoothstep(0.7, 1.0, prog));
    }
    float caps = smoothstep(-se, se, t) * smoothstep(-se, se, head - t);
    float wd = mix(se, se * 1.8, x);
    float core = exp(-0.5 * perp * perp / (wd * wd)) * sigma0 / se;
    vec3 col = mix(vec3(0.55, 1.0, 0.7), vec3(1.0, 0.97, 0.9), smoothstep(0.4, 1.0, x));
    sum += col * uMeteorB[i].w * core * profile * caps * 1.5;
  }
  return sum;
}

vec3 nightLayers(vec3 d, float fp, float fpOut) {
  vec3 p = d * uCel;
  twinkleAmt = uTime.w * 0.35 * (1.3 - d.y);
  float boost = 0.0, clear = 1.0;
  vec3 c = vec3(0.0);
  if (uMW.x > 0.0) c += milkyWay(p, fp, boost, clear);
  if (uNeb.x > 0.0) { vec4 nb = nebula(p, fp); c += nb.rgb; clear *= 1.0 - nb.a; }
  if (uGal.x > 0.0) c += galaxy(d, fp) * clear;
  if (uStars.x > 0.0) c += clear * (uTrails.x > 0.0 ? starTrails(p, fp, fpOut) : stars(p, fp, fpOut, boost * uMW.x, uRight * uCel, uUp * uCel));
  return c;
}
`;

const GLSL_CLOUDS = `
float remap(float v, float a, float b) { return clamp((v - a) / (b - a), 0.0, 1.0); }

vec3 cloudAmbient = vec3(0.0);

float hg(float c, float g) {
  float g2 = g * g;
  return 0.0795775 * (1.0 - g2) / pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5);
}

// A layer's field in cell units: x is the puff field before thresholding, y the local coverage.
// Weather (two very large octaves) makes coverage and cell size wander across the sky, and every
// octave is rotated and scaled by an irrational ratio, so the tiled noise never visibly repeats.
vec2 cloudField(int i, vec2 xz, float rate) {
  vec4 B = uCloudB[i], Cc = uCloudC[i], Dd = uCloudD[i];
  vec2 q = xz + Dd.zw;
  vec2 r = vec2(dot(q, Dd.xy), dot(q, vec2(-Dd.y, Dd.x))) / B.x;
  rate /= B.x;
  float m = Cc.z, vary = uCloudE[i].x;
  vec3 o = Cc.w * vec3(0.137, 0.291, 0.533);
  float w = nz(vec3(rot2(r, 0.6) * 0.017 + o.xy, 0.31 + m * 0.1), 0.017 * rate).r * 0.6
          + nz(vec3(rot2(r, 2.2) * 0.043 + o.yz, 0.67 + m * 0.2), 0.043 * rate).r * 0.4;
  r.x /= 1.0 + B.w * 5.0;
  // Dense weather breaks into tighter cells; thin weather into larger, looser ones.
  r *= 1.0 + (w - 0.5) * 0.7 * vary;
  if (B.w > 0.0) {
    vec2 wv = vec2(nz(vec3(r * 0.35, m) + o.zxy, 0.35 * rate).a, nz(vec3(r * 0.35, m) + o.yzx + 0.5, 0.35 * rate).a) - 0.5;
    r += wv * B.w * 1.6;
  }
  float big = nz(vec3(rot2(r, 1.1) * 0.13, m * 0.5) + o, 0.13 * rate).r;
  float n1 = nz(vec3(r * 0.5, m) + o.yzx, 0.5 * rate).r;
  float base = mix(n1, nz(vec3(rot2(r, 0.83) * 1.37, m * 1.3) + o.zxy, 1.37 * rate).a, 0.3);
  if (B.y > 0.0) base = mix(base, nz(vec3(rot2(r, 0.4) * 0.53, m) + o.zxy, 0.53 * rate).g * 0.6 + base * 0.4, B.y);
  if (B.z > 0.0) base = mix(base, base * 0.45 + nz(vec3(rot2(r, 1.9) * 2.3, m * 1.5) + o, 2.3 * rate).b * 0.75 - 0.08, B.z);
  return vec2(base, uCloudA[i].x + (big - 0.5) * 0.5 + (w - 0.5) * 1.3 * vary);
}

float cloudDensity(int i, vec3 pw, float hf, float rate, bool detailed) {
  if (hf < 0.0 || hf > 1.0) return 0.0;
  vec2 f = cloudField(i, pw.xz, rate);
  float puff = uCloudB[i].y, soft = uCloudC[i].y;
  // Flat bases and domed tops for heaped clouds, lens shapes for thin layers: only the strongest
  // part of the field reaches the top and bottom, so puffs are rounded rather than extruded. Edges
  // soften with the pixel footprint instead of breaking into blocks.
  float top = max(hf - 0.2, 0.0) / 0.8;
  float prof = mix(4.0 * hf * (1.0 - hf), smoothstep(0.0, 0.1, hf) * (1.0 - top * top), puff);
  float lo = 1.0 - f.y + (1.0 - prof) * mix(0.6 - 0.25 * soft, 0.3, puff);
  float d = remap(f.x, lo, lo + 0.06 + 0.3 * soft + min(rate * 2.0, 0.3));
  if (d <= 0.0) return 0.0;
  d = mix(d * d * (3.0 - 2.0 * d), sqrt(d), puff);
  if (detailed && uCloudC[i].x > 0.0) {
    float ds = uCloudB[i].x * 0.16;
    vec3 dq = vec3(pw.x + uCloudD[i].z, pw.y, pw.z + uCloudD[i].w) / ds + vec3(0.0, uCloudC[i].z * 2.0, 0.0);
    float det = nz(dq, rate / ds).g * 0.65 + nz(dq * 2.7, 2.7 * rate / ds).b * 0.35;
    d = remap(d, uCloudC[i].x * 0.55 * (1.0 - det), 1.0);
  }
  return d;
}

vec4 cloudLayer(int i, vec3 d, float fp, float jitter) {
  float hb = uCloudA[i].z, th = uCloudA[i].w;
  float rIn = RG + hb, rOut = rIn + th;
  float t0 = shellDist(OBS * d.y, rIn), t1 = shellDist(OBS * d.y, rOut);
  float tEnd = min(t1, t0 + 12.0 * th + 20.0);
  if (tEnd <= t0) return vec4(0.0, 0.0, 0.0, 1.0);
  float tm = 0.5 * (t0 + tEnd);
  vec3 pm = d * tm + vec3(0.0, OBS, 0.0);
  vec3 up = normalize(pm);
  float rm = length(pm);
  bool moonLit = uMoonScale > uSunScale * luma(transmittance(rm, dot(up, uSunDir)));
  vec3 L = moonLit ? uMoonDir : uSunDir;
  float glow = 1.0 + uCloudLight.z * (1.0 - smoothstep(-0.05, 0.25, uSunDir.y));
  vec3 tint = mix(vec3(1.0), uCloudTint.rgb / max(luma(uCloudTint.rgb), 0.05), uCloudTint.a);
  vec3 lightCol = (moonLit ? uMoonScale : uSunScale * glow) * transmittance(rm, dot(up, L)) * tint * uCloudLight.w;
  vec3 ambTop = skyLight(vec3(0.0, 1.0, 0.0));
  vec3 ambBot = cloudAmbient * 0.6;
  ambBot += uLPColor * uLP.x * uCloudMisc.y * uNightScale * lpFocus(d) * (1.0 - 0.5 * smoothstep(0.0, 0.6, d.y));
  vec3 shade = mix(vec3(1.0), uCloudShade.rgb / max(luma(uCloudShade.rgb), 0.05), uCloudShade.a);
  ambTop *= shade * uCloudLight.y * uCloudLight.w;
  ambBot *= shade * uCloudLight.y * uCloudLight.w;
  float c = dot(d, L);
  float phase = mix(0.0796, 0.75 * hg(c, 0.82) + 0.25 * hg(c, -0.25), uCloudLight.x);
  float sigma = uCloudA[i].y * 32.0;
  float Lup = dot(L, up);
  // At most the 64 steps the loop below allows, or the march would stop short of tEnd.
  int n = int(clamp((tEnd - t0) / (th * 0.07) * uQuality, 8.0, min(48.0 * uQuality, 64.0)));
  float graze = inversesqrt(max(abs(dot(d, up)), 0.04));
  float dt = (tEnd - t0) / float(n);
  float t = t0 + dt * jitter;
  vec3 acc = vec3(0.0);
  float T = 1.0;
  for (int k = 0; k < 64; k++) {
    if (k >= n || T < 0.01) break;
    vec3 pw = d * t;
    float hf = (length(pw + vec3(0.0, OBS, 0.0)) - rIn) / th;
    float rate = fp * t * graze;
    float den = cloudDensity(i, pw, hf, rate, true);
    if (den > 0.002) {
      float dist = min(Lup > 0.08 ? (1.0 - hf) * th / Lup : Lup < -0.08 ? hf * th / -Lup : th * 3.0, 3.0);
      float tau = 0.0;
      tau += cloudDensity(i, pw + L * dist * 0.1, hf + Lup * dist * 0.1 / th, rate * 2.0, false) * 0.22;
      tau += cloudDensity(i, pw + L * dist * 0.35, hf + Lup * dist * 0.35 / th, rate * 2.0, false) * 0.3;
      tau += cloudDensity(i, pw + L * dist * 0.8, hf + Lup * dist * 0.8 / th, rate * 2.0, false) * 0.48;
      tau *= dist * sigma;
      float beer = exp(-tau) + 0.35 * exp(-tau * 0.25) + 0.12 * exp(-tau * 0.06);
      float powder = 1.0 - 0.55 * exp(-den * sigma * 0.35);
      vec3 S = lightCol * beer * phase * powder + mix(ambBot, ambTop, clamp(hf, 0.0, 1.0));
      float st = exp(-den * sigma * dt);
      acc += T * S * (1.0 - st);
      T *= st;
    }
    t += dt;
  }
  float fade = exp(-tm / mix(500.0, 25.0, uCloudMisc.x));
  return vec4(acc * fade, mix(1.0, T, fade));
}

vec4 clouds(vec3 d, float fp, float jitter, vec3 amb) {
  vec3 L = vec3(0.0);
  float T = 1.0;
  if (d.y < -0.02) return vec4(L, T);
  cloudAmbient = amb;
  for (int i = 0; i < 3; i++) {
    if (i >= uCloudN) break;
    vec4 c = cloudLayer(i, d, fp, jitter);
    L += T * c.rgb;
    T *= c.a;
    if (T < 0.01) break;
  }
  return vec4(L, T);
}
`;

const GLSL_LAND = `
vec3 horizonSky(vec3 d) { return skyLight(normalize(vec3(d.x, 0.006, d.z) + vec3(1e-5, 0.0, 0.0))); }

vec3 skyAmbient() {
  vec3 toSun = normalize(vec3(uSunDir.x, 0.0, uSunDir.z) + vec3(1e-4, 0.0, 0.0));
  return 0.5 * physicalSky(vec3(0.0, 1.0, 0.0)) + 0.3 * physicalSky(normalize(toSun + vec3(0.0, 0.15, 0.0)))
    + 0.2 * physicalSky(normalize(vec3(-toSun.x, 0.15, -toSun.z)))
    + (nightSky(vec3(0.0, 1.0, 0.0)) + uLPColor * uLP.x * 0.25) * uNightScale;
}

// Sun and moon irradiance at the eye, set at the start of sceneColor.
vec3 gSunE, gMoonE;

vec3 directLight(vec3 n) {
  vec3 E = gSunE * max(dot(n, uSunDir), 0.0);
  if (uMoonScale > 0.0) E += gMoonE * max(dot(n, uMoonDir), 0.0);
  return E / PI;
}

float hazeT(float km) { return exp(-km / mix(150.0, 4.0, uHaze)); }

float fogDepth(vec3 d, float dist) {
  float H = max(uFog.y, 1.0), h0 = uSurf.y;
  float rho = uFog.x * 0.0008 * exp(-h0 / H);
  if (abs(d.y) < 1e-5) return rho * dist;
  return rho * H * (1.0 - exp(-d.y * dist / H)) / d.y;
}

// Light the fog scatters toward the eye; Fog Glow brightens it along the horizon.
vec3 fogLight(vec3 d, vec3 amb) {
  vec3 sun = gSunE * hg(dot(d, uSunDir), 0.65) * 3.0;
  return uFogColor * (amb + sun) * (1.0 + uFog.z * 2.0 * exp(-abs(d.y) * 40.0));
}

vec3 applyFog(vec3 c, vec3 d, float dist, vec3 amb) {
  if (uFog.x <= 0.0) return c;
  return mix(c, fogLight(d, amb), 1.0 - exp(-fogDepth(d, dist)));
}

// ── Far land: hills, mountains, forest and city in 3D ──

// The land starts at the shoreline (Distance) and runs past the horizon. Hills and mountains are
// eroded heightfields whose height grows with distance, so range rises behind range; a forest is a
// canopy of individual trees on low swells; a city is a grid of towers traced lot by lot. Distant
// land sinks with the Earth's curvature and fades into the air.

const float EARTH_R = 6371000.0;
const float CITY_G = 64.0;
const mat2 LAND_ROT = mat2(0.8, 0.6, -0.6, 0.8);

float landNear() { return 1000.0 * uLandB.x; }
float landFar() { return landNear() * (uLand.x > 3.5 ? 3.0 + 2.5 * uLand.w : 8.0 + 14.0 * uLand.w); }
float curveDrop(float r) { return r * r / (2.0 * EARTH_R); }
// Relief height per metre of distance, in units of tan(Height): hills, mountains, forest floor.
float landGain() { return uLand.x < 1.5 ? 1.3 : uLand.x < 2.5 ? 1.8 : 0.45; }

// Sky light on a surface facing n: mostly the part of the sky it faces, so a facade turned away
// from a sunset stays dusky blue instead of catching the glow behind it.
vec3 skyFacing(vec3 n, vec3 amb) { return 0.65 * skyLight(normalize(n + vec3(0.0, 0.7, 0.0))) + 0.35 * amb; }

float hashL(vec2 c) {
  uvec2 q = uvec2(ivec2(c) + 1048576);
  return float(pcg(q.x ^ pcg(q.y ^ uint(uLandB.z * 977.0)))) * (1.0 / 4294967296.0);
}

// Value noise in [-1, 1] and its gradient.
vec3 noised(vec2 x) {
  vec2 i = floor(x), f = fract(x);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  float a = hashL(i), b = hashL(i + vec2(1.0, 0.0)), c = hashL(i + vec2(0.0, 1.0)), e = hashL(i + vec2(1.0, 1.0));
  float k = a - b - c + e;
  return vec3(2.0 * (a + (b - a) * u.x + (c - a) * u.y + k * u.x * u.y) - 1.0, 2.0 * du * (vec2(b - a, c - a) + k * u.yx));
}

// Eroded relief: each octave is damped where the slopes so far are steep, so ridges stay sharp and
// valleys smooth. Returns (height, gradient) in feature units.
vec3 relief(vec2 p, int oct, float erode) {
  float a = 0.0, b = 0.5;
  vec2 d = vec2(0.0), g = vec2(0.0);
  mat2 m = mat2(1.0);
  for (int i = 0; i < 10; i++) {
    if (i >= oct) break;
    vec3 n = noised(p);
    d += n.yz;
    float w = 1.0 / (1.0 + erode * dot(d, d));
    a += b * w * n.x;
    g += b * w * (n.yz * m);
    b *= 0.5;
    p = 2.0 * (LAND_ROT * p);
    m = 2.0 * (LAND_ROT * m);
  }
  return vec3(a, g);
}

float gCanopy = 0.0;  // height within the tree last sampled (0 at its foot, 1 at its tip)
float gPeak = 0.0;    // 1 where the last sample was the volcano

// Trees on a jittered 10 m grid, conifer cones or broadleaf domes by Mix and Density. Once a tree
// is smaller than a pixel the canopy turns into its average height.
float canopy(vec2 p, float px, inout vec2 g) {
  const float cs = 10.0, Ht = 22.0;
  float far = smoothstep(2.5, 7.0, px);
  gCanopy = 0.75;
  if (far >= 1.0) return Ht * 0.7 * uLandC.w;
  vec2 c = floor(p / cs), bg = vec2(0.0);
  float best = 0.0;
  for (int j = -1; j <= 1; j++)
    for (int i = -1; i <= 1; i++) {
      vec2 cc = c + vec2(float(i), float(j));
      if (hashL(cc * 1.7 + 3.1) > uLandC.w) continue;
      vec2 pos = (cc + 0.15 + 0.7 * vec2(hashL(cc + 11.3), hashL(cc * 0.37 + 5.7))) * cs;
      float ht = Ht * (0.55 + 0.6 * hashL(cc + 23.9));
      bool con = hashL(cc + 41.0) < uLandC.z;
      float rad = ht * (con ? 0.21 : 0.36);
      vec2 dv = p - pos;
      float dd = length(dv);
      if (dd >= rad) continue;
      float v;
      vec2 gv;
      if (con) { v = ht * (1.0 - dd / rad); gv = -ht / rad * dv / max(dd, 1e-3); }
      else { float s = sqrt(rad * rad - dd * dd); v = ht * 0.45 + s * 1.3; gv = -1.3 * dv / max(s, 0.3); }
      if (v > best) { best = v; bg = gv; gCanopy = clamp(v / ht, 0.0, 1.0); }
    }
  g += bg * (1.0 - far);
  return mix(best, Ht * 0.7 * uLandC.w, far);
}

// Land height (m) above the base plane at p (metres from the eye) and its gradient g. Octaves finer
// than the footprint px are left out.
float landHeight(vec2 p, float px, out vec2 g) {
  float r = length(p), type = uLand.x;
  float L = type < 1.5 ? 1700.0 : type < 2.5 ? 2600.0 : 1500.0;
  float A = tan(uLand.y * DEG) * clamp(r - 0.4 * landNear(), 0.6 * landNear(), 30000.0) * landGain();
  int oct = int(clamp(log2(L / max(px, 1.0)), 2.0, type < 2.5 ? 9.0 : 5.0));
  vec2 q = rot2(p, uLandB.y) / L + uLandB.z * vec2(0.71, 1.37);
  vec3 n = relief(q, oct, type < 1.5 ? 0.35 : type < 2.5 ? 0.6 + 1.4 * uLand.z : 0.2);
  float v = n.x + 0.42;
  float h = A * max(v, 0.0);
  g = v > 0.0 ? A * rot2(n.yz, -uLandB.y) / L : vec2(0.0);
  if (type > 2.5) h += canopy(p, px, g);
  gPeak = 0.0;
  if (uPeak.x > 0.0) {
    // A stratovolcano: concave flanks scored by radial gullies, a flat crater rim on top.
    float Dp = landNear() * 14.0;
    vec2 dv = p - vec2(sin(uPeak.y), cos(uPeak.y)) * Dp;
    float R = Dp * tan(min(uPeak.z, 1.3)), Hp = Dp * tan(uPeak.x * DEG);
    float rr = length(dv) / R;
    if (rr < 1.0) {
      float prof = pow(1.0 - rr, 1.9);
      float hp = Hp * min(prof, 0.955) * (1.0 + 0.04 * rr * (valueNoise(vec2(atan(dv.y, dv.x) * 22.0, rr * 4.0 + uLandB.z)) - 0.5));
      if (hp > h) {
        h = hp;
        gPeak = 1.0;
        g = prof < 0.955 ? -1.9 * Hp * pow(1.0 - rr, 0.9) / R * dv / max(length(dv), 1e-3) : vec2(0.0);
      }
    }
  }
  float shore = smoothstep(landNear(), landNear() * 1.5, r);
  g *= shore;
  return h * shore;
}

// Where a ray leaves the shoreline circle (the eye is inside it).
float shoreEntry(vec3 ro, vec3 rd) {
  vec2 o = ro.xz, v = rd.xz;
  float vv = max(dot(v, v), 1e-10), b = dot(o, v), c = dot(o, o) - landNear() * landNear();
  return c < 0.0 ? (-b + sqrt(max(b * b - vv * c, 0.0))) / vv : 0.0;
}

// Distance along the ray to the hills, mountains or forest, or -1.
float landTrace(vec3 ro, vec3 rd, float fp) {
  float far = landFar(), t = shoreEntry(ro, rd), kStep = uLand.x > 1.5 && uLand.x < 2.5 ? 0.4 : 0.5;
  // The steepest apparent slope anything can reach (relief stays below 1, so landHeight's v below
  // 1.42; the volcano adds its own): a ray climbing faster, above it, is clear.
  float top = tan(uLand.y * DEG) * landGain() * 1.42 + (uPeak.x > 0.0 ? tan(uPeak.x * DEG) : 0.0);
  float tPrev = t, dPrev = 1e9;
  for (int i = 0; i < 600; i++) {
    vec3 p = ro + rd * t;
    float r = length(p.xz);
    if (r > far) break;
    vec2 g;
    float dy = p.y - (landHeight(p.xz, fp * t, g) - uSurf.y - curveDrop(r));
    if (dy < 0.3 * fp * t) return dPrev < 1e8 ? mix(tPrev, t, clamp(dPrev / max(dPrev - dy, 1e-6), 0.0, 1.0)) : t;
    if (rd.y > top && p.y + uSurf.y > top * r + 40.0) break;
    tPrev = t;
    dPrev = dy;
    // Tree cones are steep: step finely inside the canopy band (trees stand at most 26 m) while
    // canopy() still draws single trees. Steps never shrink below a share of the distance, so rays
    // that skim the land all the way out still arrive within the loop.
    float band = uLand.x > 2.5 && fp * t < 7.0 ? 26.0 : 0.0;
    t += max(dy > band ? (dy - band) * kStep + band * 0.2 : dy * 0.2, max(fp, dy > band ? 0.01 : 0.003) * t + 0.5);
  }
  return -1.0;
}

// Rock, meadow, forest and snow by height and slope; the volcano's ash, forest skirt and gullied
// snow cap; soft shadows cast by the land itself.
vec3 landShade(vec3 ro, vec3 rd, float t, float fp, vec3 amb) {
  vec3 p = ro + rd * t;
  float r = length(p.xz), type = uLand.x;
  vec2 g;
  float h = landHeight(p.xz, fp * t * 0.35, g);
  vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
  float n1 = valueNoise(p.xz / 90.0 + uLandB.z), n2 = valueNoise(p.xz / 17.0 - uLandB.z);
  // Rock in strata that follow the height, darker on the steepest faces.
  float strata = valueNoise(vec2(h / 23.0 + n1 * 2.0, 0.5));
  vec3 alb = uLandColor * (0.62 + 0.3 * n1 + 0.18 * n2 + 0.25 * strata) * mix(0.75, 1.0, smoothstep(0.35, 0.75, n.y));
  vec3 forest = vec3(0.022, 0.04, 0.018) * (0.7 + 0.6 * n2), meadow = vec3(0.07, 0.09, 0.035) * (0.8 + 0.4 * n1);
  float snowLine = mix(2600.0, 120.0, uLandC.x);
  float ao = 1.0;
  if (gPeak > 0.5) {
    float Hp = landNear() * 14.0 * tan(uPeak.x * DEG), e = h / max(Hp, 1.0);
    float gully = valueNoise(vec2(atan(p.z - cos(uPeak.y) * landNear() * 14.0, p.x - sin(uPeak.y) * landNear() * 14.0) * 40.0, e * 6.0));
    alb = mix(vec3(0.09, 0.08, 0.075), vec3(0.16, 0.13, 0.11), n1) * (0.8 + 0.4 * n2);
    alb = mix(alb, forest, smoothstep(0.32, 0.18, e + 0.08 * n1));
    float snow = smoothstep(1.0 - uPeak.w - 0.03, 1.0 - uPeak.w + 0.03, e + (gully - 0.5) * 0.22);
    alb = mix(alb, vec3(0.84, 0.86, 0.9), snow);
  } else if (type > 2.5) {
    // Forest: darker deep in each crown, a little lighter and warmer at the tips.
    alb = mix(forest, uLandColor * 0.5, 0.15) * (0.75 + 0.5 * hashL(floor(p.xz / 10.0)));
    ao = mix(0.35, 1.0, gCanopy);
  } else {
    // Forest on gentle ground below the tree line, meadow in clearings, snow above the snow line.
    float veg = smoothstep(0.66, 0.86, n.y + 0.1 * n2) * (1.0 - smoothstep(0.55, 0.8, h / snowLine + 0.15 * n1));
    alb = mix(alb, mix(meadow, forest, smoothstep(0.25, 0.45, valueNoise(p.xz / 41.0) * 0.6 + n2 * 0.4)), veg);
    float snow = smoothstep(-60.0, 60.0, h - snowLine + (n1 - 0.5) * 250.0) * smoothstep(0.45, 0.7, n.y + 0.15 * n2) * step(0.001, uLandC.x);
    alb = mix(alb, vec3(0.83, 0.86, 0.91), snow);
  }
  float sh = 1.0;
  if (uSunDir.y > -0.04) {
    float s = 15.0 + 0.003 * t;
    for (int k = 0; k < 22; k++) {
      vec3 q = p + uSunDir * s;
      float rq = length(q.xz);
      vec2 gq;
      float yq = landHeight(q.xz, fp * t + s * 0.03, gq) - uSurf.y - curveDrop(rq);
      sh = min(sh, clamp(25.0 * (q.y - yq) / s, 0.0, 1.0));
      s *= 1.4;
      if (sh < 0.02 || q.y > 9000.0) break;
    }
  }
  return alb * (directLight(n) * sh + skyFacing(n, amb) * (0.55 + 0.45 * n.y)) * ao;
}

// ── City ──

// The building on lot c: (centre, height, id). Avenues every sixth row and column; a downtown of
// towers out along the land heading, low-rise blocks elsewhere.
vec4 cityLot(vec2 c, out vec2 hs) {
  vec2 cen = (c + 0.5) * CITY_G;
  float r = length(cen), near = landNear();
  hs = vec2(0.0);
  if (r < near * 1.04 || r > landFar() || mod(c.x, 6.0) < 1.0 || mod(c.y, 6.0) < 1.0) return vec4(0.0);
  float h1 = hashL(c * 1.31 + 17.0), h2 = hashL(c + 3.7);
  vec2 dc = vec2(sin(uLandB.y), cos(uLandB.y)) * near * 4.2;
  float down = exp(-dot(cen - dc, cen - dc) / (2.0 * near * near * 1.1));
  float tower = down * step(0.55, h2);
  float H = (7.0 + 26.0 * h1 * h1) * (0.45 + 0.8 * valueNoise(cen / 700.0 + uLandB.z)) + tower * (60.0 + 320.0 * pow(hashL(c + 7.7), 1.6)) + down * 25.0 * h1;
  // Towers are slim; low-rise blocks fill more of their lots.
  hs = CITY_G * mix(vec2(0.3 + 0.15 * hashL(c * 0.71 + 9.1), 0.3 + 0.15 * hashL(c + 21.3)), vec2(0.2 + 0.1 * hashL(c + 2.9)), tower);
  return vec4(cen, H * uLand.y * 0.5, h1);
}

vec4 gLot = vec4(0.0);
float gBeacon = 0.0;  // red aviation lights the ray passed close to

// The first building face or street a ray meets, walking the lot grid cell by cell, or -1.
float cityTrace(vec3 ro, vec3 rd, float fp, out vec3 n) {
  // Above top (over the tallest building cityLot can make, 446 m before scaling) nothing is hit.
  float t = shoreEntry(ro, rd), top = 450.0 * uLand.y * 0.5 - uSurf.y;
  n = vec3(0.0, 1.0, 0.0);
  vec2 v = rd.xz, o = ro.xz + v * t, c = floor(o / CITY_G), s = vec2(v.x >= 0.0 ? 1.0 : -1.0, v.y >= 0.0 ? 1.0 : -1.0);
  vec2 inv = 1.0 / max(abs(v), vec2(1e-7));
  vec2 tN = t + ((c + max(s, 0.0)) * CITY_G - o) * s * inv, tD = CITY_G * inv;
  vec3 ri = 1.0 / mix(rd, vec3(1e-7), lessThan(abs(rd), vec3(1e-7)));
  for (int i = 0; i < 160; i++) {
    float tx = min(tN.x, tN.y);
    vec2 hs;
    vec4 lot = cityLot(c, hs);
    if (lot.z > 150.0 && fract(lot.w * 13.7) < 0.6) {
      vec3 b = vec3(lot.x, lot.z - uSurf.y + 2.0, lot.y) - ro;
      float tb = max(dot(b, rd), 1.0), dd = length(b - rd * tb), w = max(fp * tb * 0.6, 0.3);
      gBeacon += exp(-0.5 * dd * dd / (w * w)) * exp(-tb / 9000.0);
    }
    if (lot.z > 0.0) {
      vec3 ta = (vec3(lot.x - hs.x, -uSurf.y, lot.y - hs.y) - ro) * ri, tb = (vec3(lot.x + hs.x, lot.z - uSurf.y, lot.y + hs.y) - ro) * ri;
      vec3 mn = min(ta, tb), mx = max(ta, tb);
      float te = max(max(mn.x, mn.y), mn.z), tl = min(min(mx.x, mx.y), mx.z);
      if (te < tl && te > 0.0) {
        n = -sign(rd) * step(mn.yzx, mn) * step(mn.zxy, mn);
        gLot = lot;
        return te;
      }
    }
    if (rd.y < 0.0) {
      float tg = (-uSurf.y - ro.y) / rd.y;
      if (tg < tx) { gLot = vec4(0.0); return max(tg, t); }
    }
    if (rd.y > 0.0 && ro.y + rd.y * tx > top) break;
    t = tx;
    if (tN.x < tN.y) { c.x += s.x; tN.x += tD.x; } else { c.y += s.y; tN.y += tD.y; }
    if (dot(c, c) * CITY_G * CITY_G > pow(landFar() + CITY_G, 2.0)) break;
  }
  return -1.0;
}

// Facades of punched windows or glass curtain wall that mirror the sky; lit windows after dark in
// a mix of warm and cool light; windows smaller than a pixel blend to their average.
vec3 cityShade(vec3 ro, vec3 rd, float t, vec3 n, float fp, vec3 amb) {
  vec3 p = ro + rd * t;
  float px = fp * t, id = gLot.w, lights = uLandB.w;
  vec3 c;
  if (gLot.z <= 0.0) {
    c = vec3(0.045) * (directLight(n) + amb) + uCityColor * lights * 0.5 * uNightScale;
  } else if (n.y > 0.5) {
    c = mix(vec3(0.2), vec3(0.32, 0.3, 0.28), fract(id * 9.1)) * (directLight(n) + skyFacing(n, amb));
  } else {
    bool glassy = fract(id * 7.13) < 0.45;
    vec3 wall = mix(vec3(0.17, 0.165, 0.16), vec3(0.36, 0.33, 0.29), fract(id * 3.7)) * (glassy ? 0.35 : 1.0);
    float up = p.y + uSurf.y, fh = 3.7, cw = glassy ? 1.5 : 2.2 + 1.6 * fract(id * 5.3);
    vec2 w = vec2((abs(n.x) > 0.5 ? p.z : p.x) / cw, up / fh), f = fract(w);
    float win = glassy ? smoothstep(0.02, 0.1, f.y) * (1.0 - smoothstep(0.86, 0.94, f.y)) * smoothstep(0.02, 0.08, f.x) * (1.0 - smoothstep(0.92, 0.98, f.x))
                       : step(0.2, f.x) * step(f.x, 0.8) * step(0.3, f.y) * step(f.y, 0.82);
    float lod = smoothstep(0.2, 0.8, px / cw), winAvg = glassy ? 0.72 : 0.31;
    float cover = mix(win, winAvg, lod);
    vec3 R = reflect(rd, n);
    float fres = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    vec3 refl = mix(horizonSky(R), physicalSky(normalize(vec3(R.x, max(R.y, 0.02), R.z))), smoothstep(0.0, 0.3, R.y));
    refl += sunLight(normalize(R + vec3(0.0, 1e-4, 0.0)), max(fp, 0.004)) * 0.3;
    vec3 sky = skyFacing(n, amb);
    // Tinted, coated glass: a dim mirror head-on that brightens toward grazing.
    vec3 glass = refl * mix(0.05, 0.5, fres) + vec3(0.015, 0.02, 0.025) * sky;
    c = mix(wall * (directLight(n) + sky * 0.85), glass, cover);
    uint hh = hash3u(uvec3(uvec2(ivec2(floor(w)) + 65536), uint(id * 1e6)));
    // A share of windows lit, warm or cool and at varied levels; the far average stays dim so towers
    // read as dark masses pricked with light rather than glowing slabs.
    float on = step(rnd(hh), lights * 0.6), tone = rnd(hh), level = mix(0.35, 1.0, rnd(hh) * rnd(hh));
    vec3 lamp = mix(uCityColor, vec3(0.8, 0.9, 1.0) * luma(uCityColor) * 1.4, step(0.7, tone)) * level;
    c += mix(lamp * on * win * 3.0, uCityColor * lights * 0.6 * 0.6 * winAvg * 1.8, lod) * uNightScale;
    c *= mix(0.6, 1.0, smoothstep(0.0, 30.0, up));
  }
  return c;
}

vec2 noiseGrad(vec3 c, float rate, int ch) {
  const float e = 0.01;
  vec4 a = nz(c, rate), bx = nz(c + vec3(e, 0.0, 0.0), rate), by = nz(c + vec3(0.0, e, 0.0), rate);
  return ch == 0 ? vec2(bx.r - a.r, by.r - a.r) / e : vec2(bx.a - a.a, by.a - a.a) / e;
}

// ── Water ──

const int WAVES = 32;

float smithG1(float c, float a2) {
  float x = c / sqrt(a2 * max(1.0 - c * c, 1e-6));
  return x < 1.6 ? (3.535 * x + 2.181 * x * x) / (1.0 + 2.276 * x + 2.577 * x * x) : 1.0;
}

// Beckmann microfacet reflectance toward light l; multiply by the light's irradiance.
float glint(vec3 n, vec3 v, vec3 l, float a2) {
  float nl = dot(n, l), nv = max(dot(n, v), 1e-3);
  if (nl <= 0.0) return 0.0;
  vec3 h = normalize(v + l);
  float nh2 = max(dot(n, h), 1e-3);
  nh2 *= nh2;
  float D = exp((nh2 - 1.0) / (nh2 * a2)) / (PI * a2 * nh2 * nh2);
  float F = 0.02 + 0.98 * pow(1.0 - max(dot(v, h), 0.0), 5.0);
  return F * D * smithG1(nv, a2) * smithG1(min(nl, 1.0), a2) / (4.0 * nv);
}

// Sum of directional deep-water waves. Waves smaller than the pixel footprint drop out of the
// normal and move into the unresolved slope variance (x), which widens the sun's glitter path.
// fpD is the pixel footprint across the view (m); along the view it stretches by 1 / sin(grazing).
vec2 waves(vec2 P, vec2 vh, float fpD, float graze, out vec3 n) {
  float t = uTime.y * uSurfC.z, S = uSurf.z, stretch2 = 1.0 / (graze * graze);
  float rate = fpD / graze;
  // Wave groups: slowly drifting amplitude patches stop the components reading as a lattice.
  vec4 grp = nz(vec3(P / (90.0 * S) * 0.1, 0.19 + t * 0.0007), rate / (90.0 * S) * 0.1) * 1.6 - 0.3;
  vec3 g = vec3(0.0);
  float h = 0.0, hs = 1e-6, mss = 0.0;

  for (int i = 0; i < WAVES; i++) {
    vec4 w = uWave[i];
    float k = length(w.xy);
    float c = dot(w.xy, vh) / k;
    float vis = smoothstep(1.5, 4.0, TAU / (k * fpD * sqrt(1.0 + c * c * (stretch2 - 1.0))));
    float a = w.w * grp[i & 3];
    float s = a * k;
    float th = dot(w.xy, P) - sqrt(9.81 * k * (1.0 + k * k * 7.4e-6)) * t + w.z;
    float sn = sin(th);
    g += vec3(w.xy / k * cos(th), sn * uWaveFx.x) * (s * vis);
    h += a * sn * vis;
    hs += w.w;
    mss += 0.5 * s * s * (1.0 - vis * vis);
  }
  // Wind ripples: two octaves of stretched, animated noise carry the finest slopes.
  vec2 wd = vec2(sin(uSurfC.x), cos(uSurfC.x));
  vec2 q = vec2(dot(P, wd), dot(P, vec2(wd.y, -wd.x)) * 0.55);
  float lr = 0.6 * S, sr = sqrt(uWaveFx.z);
  for (int o = 0; o < 2; o++) {
    float vis = smoothstep(1.5, 4.0, lr / rate);
    if (vis > 0.0) {
      vec2 gr = noiseGrad(vec3((q - vec2(t * 0.35 * sqrt(lr), 0.0)) / lr * 0.25, 0.53 + float(o) * 0.31 + t * 0.03 / sqrt(lr)), rate / lr * 0.25, 0) * 0.25 * sr * vis;
      g.xy += gr.x * wd + gr.y * vec2(wd.y, -wd.x);
    }
    mss += uWaveFx.z * (1.0 - vis * vis);
    lr *= 0.3;
  }
  n = normalize(vec3(-g.x, 1.0 - g.z, -g.y));
  return vec2(mss, h / hs);
}

vec2 worley2(vec2 x) {
  vec2 i = floor(x), f = fract(x);
  float f1 = 8.0, f2 = 8.0;
  for (int y = -1; y <= 1; y++)
    for (int k = -1; k <= 1; k++) {
      vec2 o = vec2(float(k), float(y));
      uint h = hash3u(uvec3(uvec2(ivec2(i + o) + 100000), 61u));
      vec2 r = o + 0.15 + 0.7 * vec2(rnd(h), rnd(h)) - f;
      float dd = dot(r, r);
      if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd;
    }
  return sqrt(vec2(f1, f2));
}

// Water at the point the view ray d meets it: body scattering, sun and moon glints and foam.
// F is the weight left for the reflected scene and r its direction; under marks facets that
// reflect below the horizon (they would see another wave, i.e. more sky, not the shore).
vec3 waterSurface(vec3 d, float Dm, float rate, float fp, vec3 amb, out float F, out vec3 r, out bool under) {
  vec2 P = d.xz * Dm;
  vec3 n;
  vec2 w = waves(P, normalize(d.xz + 1e-6), fp * Dm, max(-d.y, 0.003), n);
  vec3 v = -d;
  F = (0.02 + 0.98 * pow(1.0 - max(dot(n, v), 0.0), 5.0)) * uSurfB.a;
  r = reflect(d, n);
  // Even flat water reflects only E / Dm above the horizon, so only facets that tilt the ray
  // below it count, and the clamp stays small enough not to lift the shore's mirror image.
  under = r.y < 0.0;
  r = normalize(vec3(r.x, max(r.y, 1e-5), r.z));
  vec3 sunE = gSunE * gShade;
  vec3 spec = sunE * glint(n, v, uSunDir, w.x + 2e-5 + uSunDisk.y * uSunDisk.y);
  if (uMoon.x > 0.0) {
    // The disk is drawn far below its true radiance so its face stays visible; the glitter path
    // uses a brighter moon so it reads the way it does in a night photograph.
    spec += skyExtinction(uMoonDir.y) * uMoon.z * 250.0 * PI * uMoon.y * uMoon.y * (0.5 + 0.5 * uMoonLight.z) * glint(n, v, uMoonDir, w.x + 2e-5 + uMoon.y * uMoon.y);
  }
  vec3 E = directLight(vec3(0.0, 1.0, 0.0)) * gShade + amb;
  vec3 body;
  if (int(uSurf.x) == 2) {
    // Salt crust under a thin film: polygonal ridges break through the mirror.
    float S = uSurf.z;
    vec2 c = worley2(P / (1.6 * S));
    float ridge = 1.0 - smoothstep(0.0, 0.06 + 0.5 * rate / (1.6 * S), c.y - c.x);
    float far = smoothstep(0.02, 0.3, rate / (1.6 * S));
    ridge = mix(ridge, 0.12, far);
    float tone = nz(vec3(P / (40.0 * S) * 0.1, 0.33), rate / (40.0 * S) * 0.1).r;
    body = mix(uSurfA.rgb, uSurfB.rgb, 0.35 * tone) * (0.9 + 0.25 * ridge) * E;
    F *= 1.0 - 0.8 * ridge * (1.0 - far);
    spec *= 1.0 - 0.8 * ridge * (1.0 - far);
  } else {
    // Light scattered back out of the water column; sunlit crests glow when facing the sun.
    vec2 dh = normalize(d.xz + 1e-5), sh = normalize(uSunDir.xz + 1e-5);
    float fwd = pow(max(dot(dh, sh), 0.0), 4.0) * smoothstep(-0.1, 0.9, w.y);
    body = uSurfA.rgb * E + uSurfB.rgb * sunE * fwd * 0.02;
  }
  vec3 col = body * (1.0 - F) + spec * uSurfB.a;
  if (uWaveFx.y > 0.0) {
    vec2 wd = vec2(sin(uSurfC.x), cos(uSurfC.x));
    vec2 q = vec2(dot(P, wd), dot(P, vec2(wd.y, -wd.x))) / uSurf.z;
    float t = uTime.y * uSurfC.z;
    float streak = nz(vec3(q * vec2(0.012, 0.06) + vec2(-t * 0.004, 0.0), 0.37), rate * 0.06 / uSurf.z).r;
    float speck = nz(vec3(q * 0.35, 0.71 + t * 0.002), rate * 0.35 / uSurf.z).g;
    float foam = clamp(smoothstep(0.62, 0.95, w.y + (streak - 0.5) * 0.7 + (speck - 0.5) * 0.3) * uWaveFx.y, 0.0, 1.0);
    col = mix(col, vec3(0.82) * E, foam);
    F *= 1.0 - foam;
  }
  return col;
}

// ── Grass ──

// Blades sit on a grid whose u axis runs downwind. A blade is rooted in its cell and leans downwind
// by at most one cell, so a ray crossing cell (i, j) only tests the blades of (i, j) and (i - 1, j).
// In its face frame a blade's spine follows a = kb·y², so the ray test is a quadratic.
const int GRASS_K = 5;

vec2 gWind, gCell, gLean, gOff; // grid u axis (world xz), cell size, lean direction and origin offset in grid space
float gSigma;
bool gWheat;

struct Blade { vec2 root; vec2 nh; float kb; float ka; float hy; float w; float kind; uint h; };

float grassGust(vec2 uv, float t) {
  return 0.55 * sin(uv.x * 0.8 - t * 1.9 + 0.8 * sin(uv.y * 0.27 + t * 0.15))
       + 0.30 * sin(uv.x * 2.1 + uv.y * 0.6 - t * 3.1)
       + 0.15 * sin(uv.y * 1.3 + uv.x * 0.5 - t * 1.1);
}

Blade grassBlade(ivec2 c, int k, float t) {
  Blade b;
  uint h = hash3u(uvec3(uvec2(c + 1000000), uint(k) + 977u));
  float u0 = rnd(h), v0 = 0.18 + 0.64 * rnd(h);
  b.root = (vec2(c) + vec2(u0, v0)) * gCell - gOff;
  // Kind: 0 leaf blade, 1 seed-head stem standing above the canopy, 2 flower, 3 wheat stalk.
  float kind = rnd(h), len;
  if (gWheat) {
    v0 = 0.22 + 0.56 * v0;
    b.root.y = (float(c.y) + v0) * gCell.y - gOff.y;
    b.kind = kind < 0.82 ? 3.0 : 0.0;
    len = uGrass.x * (b.kind > 2.5 ? 0.86 + 0.14 * rnd(h) : 0.3 + 0.3 * rnd(h)) * (0.92 + 0.16 * valueNoise(b.root * 0.4 + 3.3));
    b.w = uGrass.z * (b.kind > 2.5 ? 0.6 : 1.4);
  } else {
    b.kind = kind < uGrassB.y * 0.12 ? 2.0 : kind > 0.93 ? 1.0 : 0.0;
    len = uGrass.x * (b.kind > 0.5 ? 1.05 + 0.4 * rnd(h) : (0.45 + 0.55 * rnd(h)) * (0.6 + 0.8 * valueNoise(b.root * 1.3 + 7.1)));
    b.w = uGrass.z * (b.kind > 0.5 ? 0.35 : 0.7 + 0.6 * rnd(h));
  }
  float gust = grassGust(b.root, t) + 0.25 * sin(t * (2.0 + 2.0 * rnd(h)) + rnd(h) * TAU);
  float lean = len * clamp(0.06 + 0.55 * uGrass.w * rnd(h) + 0.12 * uSurfA.a * (1.0 + gust), 0.0, 0.85) * (b.kind > 0.5 && b.kind < 2.5 ? 0.4 : 1.0);
  float side = b.kind > 1.5 && b.kind < 2.5 ? 0.0 : (rnd(h) - 0.5) * 0.8;
  vec2 L = lean * normalize(gLean + vec2(-gLean.y, gLean.x) * side);
  float m = min(v0, 1.0 - v0) * gCell.y - (b.kind > 1.5 && b.kind < 2.5 ? 0.012 : 0.5 * b.w);
  L = vec2(clamp(L.x, -u0 * gCell.x, (2.0 - u0) * gCell.x - b.w), clamp(L.y, -m, m));
  b.hy = sqrt(max(len * len - dot(L, L), 0.05 * len * len));
  float phi = rnd(h) * TAU;
  b.nh = vec2(cos(phi), sin(phi));
  b.kb = dot(L, b.nh) / (b.hy * b.hy);
  b.ka = dot(L, vec2(-b.nh.y, b.nh.x)) / (b.hy * b.hy);
  b.h = h;
  return b;
}

// rd = ray direction in (u, v, up). Returns coverage; outputs hit distance, height and offset
// across the blade (-1..1), or side = 2 for a flower head.
float bladeHit(Blade b, vec3 rd, float tA, float tB, float pw0, out float tHit, out float y, out float side) {
  vec2 wv = vec2(-b.nh.y, b.nh.x);
  float a0 = -dot(b.root, b.nh), da = dot(rd.xy, b.nh);
  float b0 = -dot(b.root, wv), db = dot(rd.xy, wv);
  float E = uSurf.y, dy = rd.z;
  if (b.kind > 1.5 && b.kind < 2.5) {
    // Flower head: a small sphere on the stem tip.
    vec3 c = vec3(b.root + (b.kb * b.nh + b.ka * wv) * b.hy * b.hy, b.hy) - vec3(0.0, 0.0, E);
    float r = 0.012 * uGrass.z / 0.006, bq = dot(rd, c), cq = dot(c, c) - r * r, disc = bq * bq - cq;
    if (disc > 0.0) {
      float t = bq - sqrt(disc);
      if (t >= tA && t <= tB) {
        tHit = t;
        y = b.hy;
        side = 2.0;
        return clamp((r - length(cross(rd, c))) / (pw0 * t) + 0.5, 0.0, 1.0);
      }
    }
  }
  float A = b.kb * dy * dy, B = 2.0 * b.kb * E * dy - da, C = b.kb * E * E - a0;
  vec2 ts;
  if (abs(A) < 1e-9) ts = vec2(abs(B) > 1e-12 ? -C / B : -1.0, -1.0);
  else {
    float disc = B * B - 4.0 * A * C;
    if (disc < 0.0) return 0.0;
    float q = -0.5 * (B + (B >= 0.0 ? 1.0 : -1.0) * sqrt(disc));
    if (abs(q) < 1e-12) return 0.0;
    ts = vec2(q / A, C / q);
    if (ts.y < ts.x) ts = ts.yx;
  }
  for (int i = 0; i < 2; i++) {
    float t = ts[i];
    if (t < tA || t > tB) continue;
    float yy = (E + dy * t) / b.hy;
    if (yy < 0.0 || yy > 1.0) continue;
    float prof = b.kind < 0.5 ? pow(clamp((1.0 - yy) * 3.0, 0.0, 1.0), 0.6)
               : b.kind < 1.5 && yy > 0.72 ? 1.0 + 3.2 * sin(PI * min((yy - 0.72) / 0.3, 1.0)) * smoothstep(1.0, 0.96, yy)
               : b.kind > 2.5 && yy > 0.86 ? 1.0 + 2.6 * sqrt(sin(PI * min((yy - 0.86) / 0.15, 1.0))) * smoothstep(1.0, 0.975, yy) : 1.0;
    float hw = 0.5 * b.w * prof;
    float off = b0 + db * t - b.ka * (yy * b.hy) * (yy * b.hy);
    // Overlap of the blade with the pixel footprint, so sub-pixel blades add the right coverage.
    float pw = pw0 * t;
    float a = clamp((min(hw, off + 0.5 * pw) - max(-hw, off - 0.5 * pw)) / pw, 0.0, 1.0);
    if (a <= 0.0) continue;
    tHit = t;
    y = yy * b.hy;
    side = clamp(off / max(hw, 1e-5), -1.0, 1.0);
    return a;
  }
  return 0.0;
}

// Leaf lighting: diffuse on the lit face, yellow-green transmission when backlit, a waxy sheen,
// and sunlight that thins out toward the base of the canopy. gap < 0 averages over gap sizes.
vec3 grassLight(vec3 alb, vec3 n, vec3 d, float y, float gap, vec3 amb) {
  float H = uGrass.x;
  vec3 col = alb * amb * mix(0.22, 1.0, pow(clamp(y / H, 0.0, 1.0), 0.6));
  vec3 L = uSunDir;
  float k = gSigma * max(H - y, 0.0) / max(L.y, 0.04), x = max(1.4 * k, 1e-4);
  // The average over gap in [0, 1] is exp(-0.3 k) (1 - exp(-x)) / x, which goes to 1 (not 0) as k
  // does: tips above the canopy are in full sun.
  float shadow = gap >= 0.0 ? exp(-k * (0.3 + 1.4 * gap)) : exp(-0.3 * k) * (1.0 - exp(-x)) / x;
  float ndl = dot(n, L);
  vec3 lit = ndl > 0.0 ? alb * ndl : alb * vec3(1.3, 1.5, 0.55) * (-ndl);
  vec3 hv = normalize(L - d);
  float spec = ndl > 0.0 ? (0.04 + 0.96 * pow(1.0 - max(dot(-d, hv), 0.0), 5.0)) * 2.3 * pow(max(dot(n, hv), 0.0), 50.0) * ndl : 0.0;
  col += (lit / PI + spec) * gSunE * shadow * gShade;
  if (uMoonScale > 0.0) col += alb * max(dot(n, uMoonDir), 0.0) / PI * gMoonE * shadow;
  return col;
}

const vec3 STRAW = vec3(0.34, 0.25, 0.11);

vec3 shadeBlade(Blade b, vec3 d, float t, float y, float side, vec3 amb) {
  vec2 wp = vec2(gWind.y, -gWind.x);
  uint h = b.h;
  float r1 = rnd(h), r2 = rnd(h), r3 = rnd(h);
  if (side > 1.5) {
    // Flower head: sphere normal, petals lit with some translucency.
    vec2 wv0 = vec2(-b.nh.y, b.nh.x);
    vec2 cu = b.root + (b.kb * b.nh + b.ka * wv0) * b.hy * b.hy;
    vec3 c = vec3(cu.x * gWind + cu.y * wp, b.hy).xzy;
    vec3 p = vec3(d.xz * t, uSurf.y + d.y * t).xzy;
    vec3 n = normalize(p - c);
    vec3 alb = uFlower * (0.75 + 0.5 * r1);
    alb = mix(alb, alb.gbr, step(0.85, r2) * 0.6);
    return grassLight(alb, normalize(n + vec3(0.0, 0.4, 0.0)), d, y, r3 * 0.3, amb) * 1.3;
  }
  vec2 nh = b.nh.x * gWind + b.nh.y * wp, wv = -b.nh.y * gWind + b.nh.x * wp;
  vec3 n = normalize(vec3(nh.x, -2.0 * b.kb * y, nh.y));
  if (dot(n, d) > 0.0) n = -n;
  n = normalize(n + vec3(wv.x, 0.0, wv.y) * side * 0.35);
  float yy = y / b.hy;
  // Parallel veins and a pale midrib, visible on blades close to the lens.
  float veins = 0.93 + 0.07 * sin(side * 23.0 + r1 * 6.0) + 0.12 * exp(-side * side * 40.0);
  vec3 alb = mix(uSurfA.rgb, uSurfB.rgb, yy * yy) * (0.7 + 0.6 * r1) * mix(0.8, 1.0, yy) * veins;
  if (gWheat) {
    // Stalk colour up to the ear, the ear itself in the accent colour; leaves stay greener.
    vec3 stalk = uSurfA.rgb * (0.8 + 0.4 * r1), ear = uSurfB.rgb * (0.8 + 0.4 * r1);
    alb = b.kind > 2.5 ? mix(stalk, ear, smoothstep(0.84, 0.9, yy)) : mix(uSurfA.rgb * vec3(0.7, 0.85, 0.5), stalk, 0.5 + 0.5 * uGrassB.x);
  } else if (b.kind > 0.5) alb = mix(uSurfB.rgb, STRAW, b.kind < 1.5 ? smoothstep(0.6, 0.8, yy) : 0.2);
  else if (r2 < uGrassB.x * 0.5) alb = mix(alb, STRAW, 0.7);
  return grassLight(alb, n, d, y, r3, amb);
}

vec3 grassGround(vec2 P, float rate, vec3 amb) {
  float n1 = nz(vec3(P / 0.6 * 0.1, 0.61), rate / 0.6 * 0.1).r;
  vec3 alb = gWheat ? vec3(0.09, 0.065, 0.04) * (0.7 + 0.6 * n1)
                    : mix(uSurfA.rgb * 0.5, vec3(0.05, 0.04, 0.02), 0.45) * (0.6 + 0.8 * n1);
  float shadow = exp(-gSigma * uGrass.x / max(uSunDir.y, 0.04)) * gShade;
  return alb * (gSunE * max(uSunDir.y, 0.0) * shadow / PI + amb * (gWheat ? 0.4 : 0.2));
}

// Blades below pixel size: the expected first hit, estimated with fixed stratified samples of the
// same blade population the tracer uses (height profile, face angles weighted by projected area,
// colours and lighting), so the far field matches the traced blades on average. soil is the
// ground's colour at P, seen through the gaps.
vec3 grassCanopy(vec3 d, vec2 P, float rate, vec3 soil, vec3 amb) {
  float H = uGrass.x, S = uSurf.z;
  float cb = max(length(d.xz), 1e-4), cot = cb / max(-d.y, 1e-4);
  vec2 dh = d.xz / cb;
  // Blade density is full below mid and fades to zero at top (meadow clumps run tall; wheat
  // stands level with its ears on top).
  float top = gWheat ? H : 1.3 * H, mid = gWheat ? 0.86 * H : 0.5 * H, Fm = 0.5 * (top - mid);
  float tauTot = gSigma * cot * (Fm + mid);
  vec3 sum = vec3(0.0);
  for (int i = 0; i < 5; i++) {
    float tau = -log(1.0 - (float(i) + 0.5) / 5.0 * (1.0 - exp(-tauTot)));
    float F = tau / (gSigma * cot);
    float y = max(F < Fm ? top - sqrt(2.0 * F * (top - mid)) : mid - (F - Fm), 0.0);
    float yy = clamp(y / H, 0.0, 1.0);
    vec3 alb = mix(uSurfA.rgb, uSurfB.rgb, yy * yy) * mix(0.8, 1.0, yy);
    if (gWheat) alb = mix(uSurfA.rgb, uSurfB.rgb, smoothstep(0.82, 0.9, yy));
    else {
      alb = mix(alb, STRAW, 0.35 * uGrassB.x);
      // Above the leaf canopy only seed-head stems and flowers remain.
      float above = smoothstep(0.95, 1.1, y / H);
      alb = mix(alb, mix(mix(uSurfB.rgb, STRAW, 0.6), uFlower * 1.3, clamp(uGrassB.y * 0.6, 0.0, 0.7)), above);
    }
    for (int j = 0; j < 4; j++) {
      float s = asin((float(j) + 0.5) * 0.5 - 1.0);
      vec2 nh = -rot2(dh, s);
      sum += grassLight(alb, normalize(vec3(nh.x, (float(j & 1) - 0.5) * 0.6 * yy, nh.y)), d, y, -1.0, amb);
    }
  }
  vec3 col = mix(sum / 20.0, soil, exp(-tauTot));
  // Structure the eye still resolves: clumps, dry patches, gusts combing across the field, and
  // blade-scale streaks that carry the traced texture past the hand-off distance.
  vec4 nA = nz(vec3(P / (5.0 * S) * 0.1, 0.23), rate / (5.0 * S) * 0.1);
  vec4 nB = nz(vec3(P / (18.0 * S) * 0.1, 0.41), rate / (18.0 * S) * 0.1);
  float gust = grassGust(vec2(dot(P, gWind), dot(P, vec2(gWind.y, -gWind.x))), uTime.y * uSurfC.z);
  vec2 q = vec2(dot(P, vec2(-dh.y, dh.x)) / (1.2 * gCell.y), dot(P, dh) / max(0.6 * H * cot, 0.05));
  float streak = mix(valueNoise(q) + 0.5 * valueNoise(q * vec2(2.3, 1.0) + 9.1) - 0.75, 0.0, smoothstep(0.3, 1.0, rate / (1.2 * gCell.y)));
  col *= (0.88 + 0.24 * nA.r) * (0.92 + 0.16 * nB.g) * (1.0 + 0.1 * uSurfA.a * gust) * (1.0 + 0.7 * streak);
  if (gWheat) {
    float rows = cos(TAU * dot(P, vec2(gWind.y, -gWind.x)) / gCell.y);
    return col * (1.0 + 0.12 * rows * (1.0 - smoothstep(0.25, 0.8, rate / gCell.y)));
  }
  return mix(col, col * vec3(1.25, 1.0, 0.55), smoothstep(0.55, 0.8, nB.a) * uGrassB.x);
}

// Premultiplied grass radiance (rgb) and coverage (a) along the ray between t0 and t1; tEnd is
// how far the traversal got before running out of steps.
vec4 grassTrace(vec3 d, float t0, float t1, float tFade, float fp, vec3 amb, out float tEnd) {
  vec2 wp = vec2(gWind.y, -gWind.x);
  vec3 rd = vec3(dot(d.xz, gWind), dot(d.xz, wp), d.y);
  vec2 dg = rd.xy / gCell, g0 = (rd.xy * t0 + gOff) / gCell;
  ivec2 c = ivec2(floor(g0));
  vec2 sg = vec2(dg.x >= 0.0 ? 1.0 : -1.0, dg.y >= 0.0 ? 1.0 : -1.0);
  vec2 dgs = sg * max(abs(dg), vec2(1e-9));
  vec2 tNext = t0 + (vec2(c) + max(sg, 0.0) - g0) / dgs, tDelta = 1.0 / abs(dgs);
  float tc0 = t0, T = 1.0, time = uTime.y * uSurfC.z, pw0 = 0.75 * fp;
  vec3 acc = vec3(0.0);
  tEnd = t0;
  for (int s = 0; s < 128; s++) {
    float tc1 = min(min(tNext.x, tNext.y), t1);
    tEnd = tc1;
    float best = tc1, by = 0.0, bs = 0.0, ba = 0.0;
    Blade bb;
    for (int q = 0; q < 2; q++)
      for (int k = 0; k < GRASS_K; k++) {
        Blade b = grassBlade(c - ivec2(q, 0), k, time);
        float th, yh, sd;
        float a = bladeHit(b, rd, tc0, best, pw0, th, yh, sd);
        if (a > 0.0) { best = th; by = yh; bs = sd; ba = a; bb = b; }
      }
    if (ba > 0.0) {
      ba *= 1.0 - smoothstep(0.6 * tFade, tFade, best);
      acc += T * ba * shadeBlade(bb, d, best, by, bs, amb);
      T *= 1.0 - ba;
      if (T < 0.03) break;
      tc0 = best + 1e-4;
      continue;
    }
    if (tc1 >= t1) break;
    if (tNext.x < tNext.y) { c.x += int(sg.x); tc0 = tNext.x; tNext.x += tDelta.x; }
    else { c.y += int(sg.y); tc0 = tNext.y; tNext.y += tDelta.y; }
  }
  return vec4(acc, 1.0 - T);
}

void grassSetup() {
  vec2 wind = vec2(sin(uSurfC.x), cos(uSurfC.x));
  float n = uGrass.y * 600.0;
  gWheat = int(uSurf.x) == 4;
  if (gWheat) {
    // Crop rows: u runs along the rows (pointing downwind) and v across, one row per cell.
    vec2 row = vec2(sin(uSurfC.w), cos(uSurfC.w));
    gWind = dot(row, wind) < 0.0 ? -row : row;
    gLean = normalize(vec2(dot(wind, gWind), dot(wind, vec2(gWind.y, -gWind.x))) + vec2(0.4, 0.0));
    gCell = vec2(float(GRASS_K) / (n * 0.17), 0.17);
    gOff = vec2(0.0, 0.5 * gCell.y); // stand in a row, not in a gap
  } else {
    gWind = wind;
    gLean = vec2(1.0, 0.0);
    gOff = vec2(0.0);
    gCell.x = clamp(0.5 * uGrass.x, 0.03, 0.5);
    gCell.y = clamp(float(GRASS_K) / (n * gCell.x), 0.015, 0.3);
  }
  gSigma = n * uGrass.z * 0.32;
}

// ── Trees ──

// Foreground trees stand on the ground plane. Crowns are raymarched foliage volumes (lumpy
// ellipsoids of leaf clusters, or tiered cones for conifers); trunks and limbs are capsules.

const int MAX_TREES = 16;

struct Tree { vec3 base; vec3 c; vec3 R; float h; float seed; int type; float rt; float trunk; };

Tree treeAt(int i) {
  vec4 T = uTree[i];
  Tree tr;
  tr.base = vec3(T.x, -uSurf.y, T.y);
  tr.h = T.z;
  tr.type = int(T.w / 1000.0);
  tr.seed = mod(T.w, 1000.0);
  float w = uTreeLook.z * (0.85 + 0.3 * fract(tr.seed * 0.618));
  if (tr.type == 1) { tr.c = vec3(0.0, 0.55, 0.0) * tr.h; tr.R = vec3(0.2 * w, 0.46, 0.2 * w) * tr.h; }
  else if (tr.type == 2) { tr.c = vec3(0.0, 0.64, 0.0) * tr.h; tr.R = vec3(0.24 * w, 0.34, 0.24 * w) * tr.h; }
  else { tr.c = vec3(0.0, 0.6, 0.0) * tr.h; tr.R = vec3(0.44 * w, 0.37, 0.44 * w) * tr.h; }
  // Trunk radius and the height the trunk reaches (a conifer's stops inside its lower crown).
  tr.rt = tr.h * (tr.type == 1 ? 0.016 : tr.type == 2 ? 0.014 : 0.024);
  tr.trunk = tr.type == 1 ? 0.42 * tr.h : tr.c.y;
  return tr;
}

// A broadleaf crown is the union of a main lobe and two offset side lobes.
float crownShape(Tree tr, vec3 l) {
  vec3 q = (l - tr.c) / tr.R;
  float s = 1.0 - length(q);
  for (int k = 0; k < 2; k++) {
    float a = tr.seed * 1.7 + float(k) * 2.6;
    vec3 o = vec3(cos(a) * 0.48, 0.18 - 0.36 * float(k), sin(a) * 0.48);
    s = max(s, 1.0 - length((q - o) / (0.62 - 0.08 * float(k))));
  }
  return s;
}

// Entry and exit of a ray through an axis-aligned ellipsoid (centre c, radii R).
vec2 ellipsoidSpan(vec3 ro, vec3 rd, vec3 c, vec3 R) {
  vec3 o = (ro - c) / R, v = rd / R;
  float a = dot(v, v), b = dot(o, v), k = dot(o, o) - 1.0, disc = b * b - a * k;
  if (disc < 0.0) return vec2(1e9, -1e9);
  float s = sqrt(disc);
  return vec2(-b - s, -b + s) / a;
}

float capsule(vec3 ro, vec3 rd, vec3 pa, vec3 pb, float r) {
  vec3 ba = pb - pa, oa = ro - pa;
  float baba = dot(ba, ba), bard = dot(ba, rd), baoa = dot(ba, oa), rdoa = dot(rd, oa), oaoa = dot(oa, oa);
  float a = baba - bard * bard, b = baba * rdoa - baoa * bard, c = baba * oaoa - baoa * baoa - r * r * baba;
  float h = b * b - a * c;
  if (h >= 0.0) {
    float t = (-b - sqrt(h)) / a, y = baoa + t * bard;
    if (y > 0.0 && y < baba) return t;
    vec3 oc = y <= 0.0 ? oa : ro - pb;
    b = dot(rd, oc);
    c = dot(oc, oc) - r * r;
    h = b * b - c;
    if (h > 0.0) return -b - sqrt(h);
  }
  return -1.0;
}

vec3 limbEnd(Tree tr, int k) {
  float a = tr.seed * 2.39 + float(k) * 1.75 + 0.4 * sin(tr.seed + float(k));
  float y = tr.c.y - tr.R.y * (0.1 - 0.12 * float(k & 1));
  return tr.base + vec3(cos(a) * tr.R.x * 0.72, y, sin(a) * tr.R.z * 0.72);
}

// Nearest trunk or limb hit; n is the bark normal, v the height along the trunk (0..1).
float treeWood(Tree tr, vec3 ro, vec3 rd, out vec3 n, out float v) {
  vec3 pa = tr.base - vec3(0.0, 0.5, 0.0), pb = tr.base + vec3(0.0, tr.trunk, 0.0);
  float t = capsule(ro, rd, pa, pb, tr.rt), best = t > 0.0 ? t : 1e9;
  float rr = tr.rt;
  if (tr.type != 1) {
    vec3 fork = tr.base + vec3(0.0, tr.c.y - 0.75 * tr.R.y, 0.0);
    for (int k = 0; k < 4; k++) {
      vec3 e = limbEnd(tr, k);
      float tk = capsule(ro, rd, fork, e, tr.rt * 0.45);
      if (tk > 0.0 && tk < best) { best = tk; pa = fork; pb = e; rr = tr.rt * 0.45; }
    }
  }
  if (best > 1e8) return -1.0;
  vec3 p = ro + rd * best, ba = pb - pa;
  float h = clamp(dot(p - pa, ba) / dot(ba, ba), 0.0, 1.0);
  n = (p - pa - ba * h) / rr;
  v = (p.y - tr.base.y) / tr.h;
  return best;
}

// Returns (density, cluster signal): the signal is high in the core of a leaf clump.
vec2 crownDensity(Tree tr, vec3 p, float rate) {
  vec3 l = p - tr.base;
  if (tr.type == 1) {
    // Conifer: a cone of drooping branch tiers whose tips reach out at uneven lengths.
    float yy = (l.y - 0.1 * tr.h) / (0.9 * tr.h);
    if (yy < 0.0 || yy > 1.0) return vec2(0.0);
    float rr = length(l.xz) / tr.R.x, ang = atan(l.z, l.x);
    float nt = 10.0 + 4.0 * fract(tr.seed * 0.31), ti = floor(yy * nt + rr * 0.6);
    float tier = fract(yy * nt + rr * 0.6);
    float reach = 0.7 + 0.45 * valueNoise(vec2(ang * 2.2 + ti * 1.7, ti + tr.seed));
    vec4 n1 = nz(l / (tr.h * 0.05) * 0.1 + tr.seed * 0.137, rate / (tr.h * 0.05) * 0.1);
    float Rc = pow(1.0 - yy, 0.95) * mix(1.0, 0.62, tier) * reach * (0.88 + 0.24 * n1.r);
    // Each whorl splits into separate drooping limbs, with needle clumps along them.
    float spoke = abs(fract(ang * (1.1 + 0.18 * mod(ti, 3.0)) + ti * 0.37) - 0.5) * 2.0;
    float limbs = smoothstep(0.95, 0.55, spoke + rr * 0.35 - 0.25);
    float d = smoothstep(Rc, Rc - 0.06, rr) * smoothstep(0.0, 0.12, tier + 0.08) * smoothstep(0.42, 0.56, n1.g + 0.12);
    return vec2(d * mix(limbs, 1.0, smoothstep(0.55, 0.2, rr / max(Rc, 1e-3))) * uTreeLook.x, clamp((Rc - rr) * 3.0, 0.0, 1.0));
  }
  float shape = crownShape(tr, l);
  if (shape < -0.35) return vec2(0.0);
  float cs = tr.h * (tr.type == 2 ? 0.08 : 0.12);
  vec3 w = l / cs + tr.seed * vec3(0.37, 0.71, 0.13);
  vec4 n1 = nz(w * 0.1, rate / cs * 0.1);
  shape += (n1.r - 0.5) * 0.7;
  if (shape <= 0.0) return vec2(0.0);
  vec4 n2 = nz(w * 0.33 + 3.1, rate / cs * 0.33);
  vec4 n3 = nz(w * 1.1 + 7.7, rate / cs * 1.1);
  // Leaf clusters with sky between them; mostly an outer shell around a sparser core.
  float sig = n1.g * 0.55 + n2.g * 0.33 + n3.g * 0.14 + shape * 0.5;
  float leaf = smoothstep(0.5, 0.57, sig);
  return vec2(leaf * smoothstep(0.0, 0.04, shape) * mix(0.35, 1.0, smoothstep(0.1, 0.4, 1.0 - shape)) * uTreeLook.x, smoothstep(0.52, 0.78, sig));
}

// Sunlight reaching p through its own crown (no shadows between trees).
float crownSun(Tree tr, vec3 p) {
  if (tr.type == 1) {
    // Horizontal depth to the sunward side of the cone at this height.
    vec3 l = p - tr.base;
    float Rc = tr.R.x * pow(clamp(1.0 - (l.y - 0.1 * tr.h) / (0.9 * tr.h), 0.0, 1.0), 0.95);
    vec2 sh = normalize(uSunDir.xz + 1e-5);
    float side = dot(l.xz, sh), across = dot(l.xz, vec2(-sh.y, sh.x));
    float depth = max(sqrt(max(Rc * Rc - across * across, 0.0)) - side, 0.0) / max(length(uSunDir.xz), 0.2);
    return exp(-3.0 * depth / tr.R.x * uTreeLook.x);
  }
  vec2 s = ellipsoidSpan(p, uSunDir, tr.base + tr.c, tr.R);
  return exp(-2.4 * max(s.y, 0.0) / tr.R.x * uTreeLook.x);
}

vec3 foliage(Tree tr, vec3 p) {
  uint h = hash3u(uvec3(ivec3(floor((p - tr.base) / (tr.h * 0.1))) + 4096) + uint(tr.seed * 7.0));
  vec3 base = tr.type == 1 ? uTreeColor * vec3(0.42, 0.58, 0.62) : tr.type == 2 ? uTreeColor * vec3(1.25, 1.2, 0.7) : uTreeColor;
  float autumn = uTreeLook.y * (0.4 + 0.6 * fract(tr.seed * 0.73)) * float(tr.type != 1);
  base = mix(base, mix(vec3(0.55, 0.16, 0.03), vec3(0.62, 0.38, 0.04), rnd(h)), autumn);
  return base * (0.7 + 0.6 * rnd(h)) * mix(vec3(1.0), vec3(1.1, 1.05, 0.8), rnd(h) * 0.6);
}

vec4 treeShade(Tree tr, vec3 ro, vec3 rd, float t0, float t1, float tw, vec3 n, float v, float fp, float jitter, vec3 amb) {
  float tEnd = tw > 0.0 ? min(t1, tw) : t1;
  vec3 acc = vec3(0.0), L = uSunDir;
  float T = 1.0;
  if (t0 < tEnd) {
    // More steps for crowns that cover many pixels.
    int N = int(clamp(tr.R.x / (fp * t0 + 1e-4) * 0.35, 18.0, 56.0));
    float dt = (tEnd - t0) / float(N), t = t0 + dt * jitter;
    float sigma = 30.0 / tr.R.x;
    for (int k = 0; k < N; k++) {
      vec3 p = ro + rd * t;
      vec2 cd = crownDensity(tr, p, fp * t);
      float dens = cd.x;
      if (dens > 0.01) {
        vec3 q = (p - tr.base - tr.c) / tr.R;
        vec3 nn = normalize(q / tr.R);
        // Light reaching this leaf through the crown; backlit crowns glow only at the rim.
        float sun = crownSun(tr, p);
        float wrap = max(dot(nn, L) * 0.55 + 0.45, 0.0);
        float trans = pow(max(dot(rd, L), 0.0), 4.0) * 2.2;
        float sky = mix(0.25, 1.0, smoothstep(0.2, 1.1, length(q))) * (0.7 + 0.3 * nn.y);
        // Clump cores stand proud and catch light; their edges sit in each other's shade.
        float clump = 0.45 + 0.75 * cd.y;
        vec3 alb = foliage(tr, p);
        vec3 c = alb * (gSunE * sun * (wrap * clump + trans * vec3(1.1, 1.25, 0.6)) / PI + amb * sky * (0.6 + 0.4 * cd.y));
        if (uMoonScale > 0.0) c += alb * gMoonE * max(dot(nn, uMoonDir) * 0.5 + 0.5, 0.0) / PI;
        float a = 1.0 - exp(-sigma * dens * dt);
        acc += T * a * c;
        T *= 1.0 - a;
        if (T < 0.02) break;
      }
      t += dt;
    }
  }
  if (tw > 0.0 && tw <= t1 + 1e-3 && T > 0.02) {
    vec3 p = ro + rd * tw;
    float angle = atan(n.z, n.x);
    float marks = tr.type == 2 ? smoothstep(0.55, 0.75, valueNoise(vec2(angle * 3.0, v * tr.h * 4.0) + tr.seed)) : 0.0;
    vec3 bark = tr.type == 2 ? mix(vec3(0.6, 0.58, 0.54), vec3(0.06, 0.05, 0.05), marks) : vec3(0.075, 0.06, 0.05) * (0.8 + 0.4 * valueNoise(vec2(angle * 2.0, v * tr.h * 1.5) + tr.seed));
    float sun = crownSun(tr, p);
    vec3 c = bark * (gSunE * max(dot(n, L), 0.0) * sun / PI + amb * mix(0.35, 0.8, sun));
    acc += T * c;
    T = 0.0;
  }
  return vec4(acc, 1.0 - T);
}

// Trees along a ray from ro (eye at the origin, ground at y = -eye height), front to back, up
// to tMax (where the ray meets the ground).
vec4 treesTrace(vec3 ro, vec3 rd, float tMax, float fp, float jitter, vec3 amb, out float tHit) {
  vec3 acc = vec3(0.0);
  float T = 1.0;
  tHit = 1e9;
  for (int i = 0; i < MAX_TREES; i++) {
    if (i >= uTreeN) break;
    Tree tr = treeAt(i);
    vec3 bc = tr.base + vec3(0.0, 0.5 * tr.h, 0.0);
    vec3 oc = ro - bc;
    float br = 0.58 * tr.h + tr.R.x, b = dot(oc, rd), k = dot(oc, oc) - br * br;
    if (b * b - k < 0.0 || -b + sqrt(max(b * b - k, 0.0)) < 0.0) continue;
    vec2 s = ellipsoidSpan(ro, rd, tr.base + tr.c, tr.R * 1.35);
    vec3 n;
    float v, tw = treeWood(tr, ro, rd, n, v);
    if (tw > tMax) tw = -1.0;
    s.y = min(s.y, tMax);
    if (s.y < max(s.x, 0.0) && tw < 0.0) continue;
    float t0 = max(s.x, 0.0), t1 = s.y < t0 ? t0 : s.y;
    if (tw > 0.0) t1 = max(t1, tw + 1e-3);
    vec4 c = treeShade(tr, ro, rd, t0, t1, tw, n, v, fp, jitter, amb);
    if (c.a <= 0.0) continue;
    float tc = tw > 0.0 ? min(t0, tw) : t0;
    tHit = min(tHit, tc);
    // Aerial perspective toward each tree.
    c.rgb = mix(horizonSky(rd) * c.a, c.rgb, hazeT(tc * 0.001));
    acc += T * c.rgb;
    T *= 1.0 - c.a;
    if (T < 0.01) break;
  }
  return vec4(acc, 1.0 - T);
}

// Sunlight left after passing through tree crowns and trunks on the way to p.
float treeShadow(vec3 p) {
  float s = 1.0;
  for (int i = 0; i < MAX_TREES; i++) {
    if (i >= uTreeN) break;
    Tree tr = treeAt(i);
    vec2 sp = ellipsoidSpan(p, uSunDir, tr.base + tr.c, tr.R);
    if (sp.y > max(sp.x, 0.0)) s *= mix(1.0, exp(-2.6 * (sp.y - max(sp.x, 0.0)) / tr.R.x), 0.9 * min(uTreeLook.x, 1.0));
    if (capsule(p, uSunDir, tr.base, tr.base + vec3(0.0, tr.trunk, 0.0), tr.rt) > 0.0) s *= 0.15;
  }
  return s;
}

// ── Ground surfaces ──

// Plain ground: a dark, faintly mottled floor for silhouette scenes.
vec3 plainGround(vec2 P, float rate) {
  float S = uSurf.z;
  return mix(uSurfA.rgb, uSurfB.rgb, nz(vec3(P / (6.0 * S) * 0.1, 0.43), rate / (6.0 * S) * 0.1).r);
}

// ── Terrain: dunes, snow drifts, rocky ground ──

// Height (m) above the base plane. Dunes are transverse ridges with a gentle windward slope and a
// steep slip face whose crests meander; snow lies in soft drifts; rock is broken ground.
float gDunePhase = 0.0;

float terrainH(vec2 p, float rate) {
  int type = int(uSurf.x);
  float S = uSurf.z, A = uTerrain.x;
  vec2 wd = vec2(sin(uSurfC.x), cos(uSurfC.x));
  vec2 q = vec2(dot(p, wd), dot(p, vec2(wd.y, -wd.x)));
  if (type == 5) {
    float lam = 110.0 * S;
    vec4 w1 = nz(vec3(q * vec2(1.0, 0.55) / (lam * 4.0) * 0.1, 0.11), rate / (lam * 4.0) * 0.1);
    vec4 w2 = nz(vec3(q / lam * 0.1, 0.23), rate / lam * 0.1);
    float f = fract(q.x / lam + (w1.r - 0.5) * 3.2 + (w2.r - 0.5) * 0.5 + gDunePhase);
    float prof = f < 0.78 ? sin(f / 0.78 * PI * 0.5) : 1.0 - pow((f - 0.78) / 0.22, 0.85);
    prof = mix(prof, 0.6, smoothstep(0.08, 0.45, rate / lam));
    float small = (w2.a - 0.5) * 4.0 * (1.0 - smoothstep(0.3, 1.0, rate / (lam * 0.25)));
    return (prof * (0.45 + 0.8 * w1.g) * 13.0 + small) * A * S;
  }
  vec4 n1 = nz(vec3(p / (60.0 * S) * 0.1, 0.37), rate / (60.0 * S) * 0.1);
  vec4 n2 = nz(vec3(q * vec2(0.6, 1.0) / (14.0 * S) * 0.1, 0.59), rate / (14.0 * S) * 0.1);
  if (type == 6) return ((n1.r - 0.5) * 3.0 + (n2.r - 0.5) * 0.9) * A * S;
  return ((n1.r - 0.5) * 2.4 + (n2.a - 0.5) * 1.6 + pow(n2.g, 3.0) * 1.8) * A * S;
}

float gH0;

// First intersection of the view ray with the terrain (eye at the origin, uSurf.y above the local
// ground), or -1 if it escapes past the march range.
float terrainTrace(vec3 d, float fp) {
  float E = uSurf.y, top = 22.0 * uTerrain.x * uSurf.z + 1.0;
  if (int(uSurf.x) == 5) {
    // Stand just upwind of a crest so the view runs out over the dune field.
    float lam = 110.0 * uSurf.z;
    float w1 = nz(vec3(0.0, 0.0, 0.11), 0.0).r, w2 = nz(vec3(0.0, 0.0, 0.23), 0.0).r;
    gDunePhase = 0.7 - fract((w1 - 0.5) * 3.2 + (w2 - 0.5) * 0.5);
  }
  gH0 = terrainH(vec2(0.0), 0.0);
  float t = 0.0, tPrev = 0.0, gapPrev = E;
  for (int i = 0; i < 450; i++) {
    vec3 p = d * t;
    float gap = p.y + E + gH0 - terrainH(p.xz, fp * t);
    if (gap < 0.0) {
      // Refine between the last point above ground and this one.
      for (int k = 0; k < 5; k++) {
        float tm = mix(tPrev, t, gapPrev / max(gapPrev - gap, 1e-5));
        vec3 pm = d * tm;
        float gm = pm.y + E + gH0 - terrainH(pm.xz, fp * tm);
        if (gm < 0.0) { t = tm; gap = gm; } else { tPrev = tm; gapPrev = gm; }
      }
      return t;
    }
    if (d.y > 0.0 && p.y + E > top) return -1.0;
    tPrev = t;
    gapPrev = gap;
    // Steps never shrink below a share of the distance (a little more past 500 m), so rays that
    // graze crests still reach the end of the march within the loop.
    t += max(gap * 0.55, 0.04 + t * mix(0.012, 0.018, smoothstep(500.0, 3000.0, t)));
    if (t > 6000.0) break;
  }
  return -1.0;
}

// Soft shadow from the terrain itself toward the sun.
float terrainShadow(vec3 p, float rate) {
  float E = uSurf.y, res = 1.0, t = 0.5 + rate;
  for (int i = 0; i < 22; i++) {
    vec3 q = p + uSunDir * t;
    float gap = q.y + E + gH0 - terrainH(q.xz, max(rate, 0.002 * t));
    res = min(res, 10.0 * gap / t);
    if (res < 0.0) break;
    t *= 1.38;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 terrainShade(vec3 d, float t, float fp, vec3 amb) {
  int type = int(uSurf.x);
  float S = uSurf.z, rate = fp * t * inversesqrt(max(abs(d.y), 0.03));
  vec3 p = d * t;
  vec2 P = p.xz;
  float e = max(0.2, rate);
  float h = terrainH(P, rate);
  vec3 n = normalize(vec3(h - terrainH(P + vec2(e, 0.0), rate), e, h - terrainH(P + vec2(0.0, e), rate)));
  vec2 wd = vec2(sin(uSurfC.x), cos(uSurfC.x));
  vec2 q = vec2(dot(P, wd), dot(P, vec2(wd.y, -wd.x)));
  vec3 A = uSurfA.rgb, B = uSurfB.rgb;
  vec3 alb;
  float rough = 1.0;
  if (type == 5) {
    // Wind ripples run across the wind; sand shades from crest to trough.
    float warp = nz(vec3(P / (6.0 * S) * 0.1, 0.81), rate / (6.0 * S) * 0.1).r;
    float rw = 0.22 * S, fade = (1.0 - smoothstep(0.15, 0.5, rate / rw)) * uSurfA.a;
    vec2 g = wd * cos((q.x / rw + warp * 7.0) * TAU) * 0.25 * fade;
    n = normalize(n + vec3(-g.x, 0.0, -g.y));
    alb = mix(B, A, smoothstep(-2.0, 6.0, h / max(uTerrain.x * S, 0.05)) * 0.8 + 0.2 * nz(vec3(P / (25.0 * S) * 0.1, 0.15), rate / (25.0 * S) * 0.1).r);
  } else if (type == 6) {
    // Sastrugi: wind-carved ridges along the wind, and glints from individual crystals.
    vec2 g = noiseGrad(vec3(q * vec2(0.35, 1.0) / (2.0 * S) * 0.1, 0.47), rate / (2.0 * S) * 0.1, 3) * uSurfA.a * 0.045;
    n = normalize(n + vec3(-(g.x * wd.x + g.y * wd.y), 0.0, -(g.x * wd.y - g.y * wd.x)));
    alb = mix(A, B, 0.25 * nz(vec3(P / (30.0 * S) * 0.1, 0.61), rate / (30.0 * S) * 0.1).r);
  } else {
    float n1 = nz(vec3(P / (8.0 * S) * 0.1, 0.27), rate / (8.0 * S) * 0.1).r;
    float crack = pow(1.0 - abs(nz(vec3(P / (3.0 * S) * 0.1, 0.39), rate / (3.0 * S) * 0.1).a * 2.0 - 1.0), 10.0);
    alb = mix(A, B, smoothstep(0.3, 0.7, n1)) * (1.0 - 0.45 * crack * (1.0 - smoothstep(0.05, 0.3, rate / (3.0 * S))));
    vec2 g = noiseGrad(vec3(P / (1.5 * S) * 0.1, 0.91), rate / (1.5 * S) * 0.1, 0) * 0.04 * uSurfA.a;
    n = normalize(n + vec3(-g.x, 0.0, -g.y));
  }
  float sh = terrainShadow(p + n * (0.3 + 2.0 * rate), rate) * gShade;
  vec3 col = alb * (gSunE * max(dot(n, uSunDir), 0.0) * sh / PI + amb * (0.55 + 0.45 * n.y));
  if (uMoonScale > 0.0) col += alb * gMoonE * max(dot(n, uMoonDir), 0.0) / PI;
  if (type == 6 && uSurfC.y > 0.0) {
    // Sparkle: a few crystal facets per footprint catch the sun or moon.
    float cell = max(rate * 2.0, 0.015);
    uint hh = hash3u(uvec3(uvec2(ivec2(floor(P / cell)) + 1000000), 7u));
    vec3 nf = normalize(n * 1.6 + vec3(rnd(hh) - 0.5, 0.0, rnd(hh) - 0.5));
    vec3 L = uSunDir.y > -0.05 ? uSunDir : uMoonDir;
    vec3 E2 = uSunDir.y > -0.05 ? gSunE : vec3(uMoonScale) * 30.0;
    col += E2 * pow(max(dot(reflect(d, nf), L), 0.0), 600.0) * step(0.75, rnd(hh)) * uSurfC.y * 25.0 * sh;
  }
  return col;
}

// ── Aurora ──

vec3 aurora(vec3 d, float fp, float jitter) {
  if (uAurora.x <= 0.0 || d.y <= 0.0) return vec3(0.0);
  vec2 hd = vec2(sin(uAurora.z), cos(uAurora.z));
  float time = uTime.z, base = mix(1100.0, -150.0, uAurora.w);
  vec3 acc = vec3(0.0);
  const int N = 28;
  for (int k = 0; k < N; k++) {
    float hf = (float(k) + jitter) / float(N);
    float t = shellDist(OBS * d.y, RG + 95.0 + 190.0 * uAurora.y * hf);
    vec2 xz = d.xz * t;
    float along = dot(xz, vec2(hd.y, -hd.x)), across = dot(xz, hd);
    float rate = fp * t * 0.001;
    // Curtains meander at three scales; a few run side by side.
    float fold = (nz(vec3(along * 0.0006, time * 0.0015, 0.37), rate * 0.6).a - 0.5) * 420.0
               + (nz(vec3(along * 0.003, time * 0.004, 0.71), rate * 3.0).a - 0.5) * 90.0
               + (nz(vec3(along * 0.012, time * 0.01, 0.55), rate * 12.0).r - 0.5) * 18.0;
    float c = across - base - fold;
    float band = gauss(c / 7.0) + 0.55 * gauss((c - 120.0) / 10.0) + 0.35 * gauss((c + 260.0) / 12.0) + 0.1 * gauss(c / 90.0);
    if (band < 0.002) continue;
    // Fine vertical rays and brighter knots along the curtain.
    float rays = 0.45 + 0.55 * smoothstep(0.35, 0.8, nz(vec3(along * 0.09, time * 0.03, 0.13 + hf * 0.04), rate * 90.0).r);
    float knots = 0.55 + 0.45 * smoothstep(0.3, 0.7, nz(vec3(along * 0.004, time * 0.006, 0.91), rate * 4.0).r);
    float vprof = smoothstep(0.0, 0.03, hf) * exp(-hf * 3.0);
    vec3 col = mix(uAuroraA, uAuroraB, smoothstep(0.12, 0.65, hf));
    acc += col * band * rays * knots * vprof;
  }
  return acc * uAurora.x * 0.12;
}
`;
